// SHA-256 hashing via Web Crypto API (inbyggt i alla moderna webbläsare)
async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Hasha PIN med user-id som salt (unikt per användare) – jämförs sedan server-side via RPC
async function hashPin(pin,userId){ return sha256(pin+"|"+userId); }

async function subscribeToPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return null;
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    // Spara prenumeration i Supabase (matchar riktig tabellstruktur: member_name, endpoint, p256dh, auth)

      p256dh:subJson.keys.p256dh,
      auth:subJson.keys.auth
    });
    if(subErr){console.error("Push subscribe save failed:",subErr);return null;}
    return sub;
  }catch(e){console.error("Push subscribe failed:",e);return null;}
}

async function unsubscribeFromPush(){
  if(!('serviceWorker' in navigator)) return;
  const reg=await navigator.serviceWorker.ready;
  const sub=await reg.pushManager.getSubscription();
  if(sub){

    await sb.from("push_subscriptions").delete().eq("member_name",currentUser.namn).eq("league_id",currentLeague.id);
  }
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

window.saveTips = async function(){
  if(blockIfTrialExpired())return;
  const statusEl = document.getElementById("tipp-status");
  if(statusEl) statusEl.textContent = "Sparar…";
  try {
    const rd = rounds[String(userSelectedRound||cfg.omg)];
    if(!rd || !rd.matches.length){ if(statusEl) statusEl.textContent="Inga matcher att tippa på."; return; }
    const savedTips=(currentUser.tips&&currentUser.tips[String(userSelectedRound||cfg.omg)])||[];
    const savedBoostMatch=savedTips.find(t=>t.boost);
    const boostKey=tipDraft._boost!==undefined?tipDraft._boost:(savedBoostMatch?savedBoostMatch.hId+"-"+savedBoostMatch.aId:null);
    if(!boostKey){
      if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">⚡ Välj en boost-match innan du sparar – klicka blixten bredvid en av matcherna.</span>';
      return;
    }
    const tipsArr = rd.matches.map(m => {
      const hEl = document.querySelector('[data-hid="'+m.hId+'"][data-aid="'+m.aId+'"][data-side="h"]');
      const aEl = document.querySelector('[data-hid="'+m.hId+'"][data-aid="'+m.aId+'"][data-side="a"]');
      const key=m.hId+"-"+m.aId;
      return { hId:m.hId, aId:m.aId, predH: hEl?Number(hEl.value)||0:0, predA: aEl?Number(aEl.value)||0:0, boost: key===boostKey };
    });
    const allTips = Object.assign({}, currentUser.tips || {});
    allTips[String(userSelectedRound||cfg.omg)] = tipsArr;
    const { error } = await sb.from("fantasy_users").update({ tips: allTips }).eq("id", currentUser.id);
    if(error){
      if(statusEl) statusEl.innerHTML = '<span style="color:#A32D2D">Fel: '+error.message+'</span>';
      return;
    }
    currentUser = Object.assign({}, currentUser, { tips: allTips });
    users = users.map(u => u.id === currentUser.id ? Object.assign({}, u, { tips: allTips }) : u);
    tipDraft._boost=undefined;
    if(statusEl) statusEl.innerHTML = '<span style="color:#1a6b3c;font-weight:500">✓ Tips sparade! ⚡ Boost på vald match.</span>';
  } catch(e){
    if(statusEl) statusEl.innerHTML = '<span style="color:#A32D2D">JS-fel: '+e.message+'</span>';
  }
};

// Registrerar samma spelare (namn+PIN) i en ANNAN serie, som del av
// multi-serie-registreringen. Returnerar {error} eller {error:null}.
async function registerInOtherLeague(leagueId,namn,rawPin){
  try{
    const {data:existing}=await sb.from("fantasy_users").select("id").eq("league_id",leagueId).ilike("namn",namn).maybeSingle();
    if(existing) return {error:{message:"Namnet är redan taget i den serien"}};
    const newId=Math.random().toString(36).slice(2,10);
    const pinHash=await hashPin(rawPin,newId);
    const {error}=await sb.from("fantasy_users").insert({
      id:newId,namn,picks:{GK:[],DEF:[],MID:[],FW:[]},kapten:null,pin:pinHash,league_id:leagueId,tips:{}
    });
    if(error) return {error};
    try{
      const {data:candidates}=await sb.from("player_accounts").select("id,namn").ilike("namn",namn);
      if(candidates&&candidates.length){
        for(const cand of candidates){
          const hash=await hashPin(rawPin,cand.id);
          const {data:match}=await sb.rpc("verify_account_pin",{p_account_id:cand.id,p_pin_hash:hash});
          if(match){ await sb.from("fantasy_users").update({account_id:cand.id}).eq("id",newId); break; }
        }
      }
    }catch(e){console.error("registerInOtherLeague account-link error:",e);}
    return {error:null};
  }catch(e){
    return {error:e};
  }
}

  const {data,error}=await sb.from("leagues").insert({
    name:currentLeague.name,
    slug:currentLeague.slug+"-"+slugPart,
    season:newSeasonLabel,
    is_current:true
  }).select().single();
  if(error)return{error};
  // Kopiera lag till ny säsong
  const {data:teamData}=await sb.from("teams").select("*").eq("league_id",currentLeague.id);
  if(teamData?.length){
    await sb.from("teams").insert(teamData.map(t=>({
      name:t.name,league_id:data.id

// Föreslår nästa säsongsetikett utifrån den nuvarande. Klarar både rena årtal
// ("2027" -> "2028") och delade säsonger ("2026/27" eller "2026/2027" -> "2027/28"/"2027/2028").
// Känns formatet inte igen returneras nuvarande etikett oförändrad, så admin kan redigera manuellt.
function suggestNextSeasonLabel(current){
  const s=String(current??"").trim();
  let m=s.match(/^(\d{4})\s*\/\s*(\d{2}|\d{4})$/);
  if(m){
    const y1=Number(m[1])+1;
    const shortForm=m[2].length===2;
    const y2=shortForm?String((y1+1)%100).padStart(2,"0"):String(y1+1);
    return `${y1}/${y2}`;
  }
  m=s.match(/^(\d{4})$/);
  if(m) return String(Number(m[1])+1);
  return s;
}
// Säker sorteringsnyckel för säsongsetiketter som kan vara fri text (t.ex. "2026/27") –
// plockar ut det första 4-siffriga årtalet i strängen, annars 0.
function seasonSortNum(s){
  const m=String(s??"").match(/\d{4}/);
  return m?Number(m[0]):0;
}

// Sant om spelarens provperiod gått ut OCH de inte markerats som betalda.
// Provperioden räknas nu GLOBALT (via det delade Väg A-kontot) i antal DAGAR
// sedan personens allra första registrering, oavsett vilken serie – inte per
// serie längre, så man kan inte längre "förnya" provperioden genom att gå med
// i en ny serie. Saknas trialStartedAt (t.ex. inget delat konto ännu, eller
// spelaren registrerades innan den här funktionen fanns) är de undantagna.
function isTrialExpired(user){
  if(!cfg.trialEnabled) return false;
  if(!user) return false;
  if(user.paid) return false;
  if(!user.trialStartedAt) return false;
  const daysSince=(Date.now()-new Date(user.trialStartedAt).getTime())/(1000*60*60*24);
  return daysSince>=(cfg.trialDays||14);
}

async function ensureAccountLink(u,rawPin){
  if(u.account_id) return u.account_id;
  try{
    const {data:candidates}=await sb.from("player_accounts").select("id,namn").ilike("namn",u.namn);
    if(candidates&&candidates.length){
      for(const cand of candidates){
        const hash=await hashPin(rawPin,cand.id);
        const {data:match}=await sb.rpc("verify_account_pin",{p_account_id:cand.id,p_pin_hash:hash});
        if(match){
          await sb.from("fantasy_users").update({account_id:cand.id}).eq("id",u.id);
          return cand.id;
        }
      }

    const ownHash=await hashPin(rawPin,u.id);
    const {error:accErr}=await sb.from("player_accounts").insert({id:u.id,namn:u.namn,pin:ownHash,trial_started_at:new Date().toISOString()});
    if(!accErr){
      await sb.from("fantasy_users").update({account_id:u.id}).eq("id",u.id);

// ── Måljakten-poäng ────────────────────────────────────────────────────────────
function calcMåljaktenTeamPts(teamId,rd){
  if(!rd||!rd.matches)return{pts:0,goals:0,isHome:null};
  const m=rd.matches.find(m=>Number(m.hId)===Number(teamId)||Number(m.aId)===Number(teamId));
  if(!m)return{pts:0,goals:0,isHome:null};
  const isHome=Number(m.hId)===Number(teamId);
  const goals=isHome?Number(m.hMål||0):Number(m.aMål||0);
  const pts=goals*(isHome?2:3)+(goals>=3?5:0);
  return{pts,goals,isHome};
}
function userMåljaktenRoundPts(userId,roundNum){
  const rd=rounds[String(roundNum)];
  if(!rd||!rd.results_published)return 0;
  const tip=måljaktenAllTipsGlobal.find(t=>t.user_id===userId&&Number(t.round_num)===Number(roundNum));
  if(!tip)return 0;
  return (tip.picks||[]).reduce((s,teamId)=>s+calcMåljaktenTeamPts(teamId,rd).pts,0);
}
function userMåljaktenTotalPts(userId){

async function distributeQuizQuestions(totalRounds=26){
  // Hämta alla frågor i banken (round_num = null)
  const bank=await fetchQuizBank();
  if(!bank.length)return{error:{message:"Inga frågor i banken."},distributed:0};
  // Blanda slumpmässigt
  const shuffled=[...bank].sort(()=>Math.random()-0.5);
  let distributed=0;
  for(let round=1;round<=totalRounds;round++){
    const slice=shuffled.slice((round-1)*5,round*5);
    if(!slice.length)break;
    for(const q of slice){
      await sb.from("quiz_questions").update({round_num:round}).eq("id",q.id);
      distributed++;
    }
  }
  return{error:null,distributed};
}

function calcUserStreak(allTips,userId,publishedRounds){
  const myTips=allTips.filter(t=>t.user_id===userId).sort((a,b)=>a.round_num-b.round_num);
  const roundsSorted=[...publishedRounds].sort((a,b)=>a-b);
  let current=0,best=0,streak=0;
  for(const r of roundsSorted){
    const tip=myTips.find(t=>t.round_num===r);
    if(tip?.correct===true){streak++;best=Math.max(best,streak);}
    else{streak=0;}
  }
  current=streak;
  return{current,best};
}

async function autoCloseStaleTickets(tickets){
  const WEEK_MS=7*24*60*60*1000;
  const now=Date.now();
  const staleIds=tickets.filter(t=>
    t.status!=="closed" &&
    t.last_sender==="admin" &&
    (now-new Date(t.updated_at).getTime())>WEEK_MS
  ).map(t=>t.id);
  if(!staleIds.length) return tickets;
  try{
    await sb.from("support_tickets").update({status:"closed"}).in("id",staleIds);
  }catch(e){console.error("autoCloseStaleTickets error:",e);}
  return tickets.map(t=>staleIds.includes(t.id)?{...t,status:"closed"}:t);
}

// Gemensam poängväljare för privata ligor – används både här och i spelarvyn,
// så att alla 14 spelformer stöds konsekvent på ett och samma ställe.
function privateLeagueGetPts(gm,u){
  if(gm==="fantasy")return userTotPts(u);
  if(gm==="tipp")return userTipTotalPts(u);
  if(gm==="snabbast")return userSnabbastTotalPts(u.id);
  if(gm==="måljakten")return userMåljaktenTotalPts(u.id);
  if(gm==="ligatipp")return userLigatippTotalPts(allLeagueTips.find(t=>t.user_id===u.id)||{});
  if(gm==="quiz")return userQuizTotalPts(u.id,window._quizAllAnswers||[],quizQuestions);
  if(gm==="streak"){
    const pubRounds=Object.keys(rounds).map(Number).filter(r=>rounds[String(r)].results_published);
    return calcUserStreak(streakAllTips,u.id,pubRounds).best;
  }
  if(gm==="matchfokus")return userMatchfokusTotalPts(u.id);
  if(gm==="duellen")return duellenStandings(duellenFixtures).find(r=>r.id===u.id)?.pts||0;
  if(gm==="malregn")return userMalregnTotalPts(u.id);
  if(gm==="jubel")return userJubelTotalPts(u.id);
  if(gm==="investerare")return Math.round(investerareCurrentBalance(u.id));
  if(gm==="lts")return userLtsRoundsSurvived(u.id);
  if(gm==="anytime")return userAnytimeTotalPts(u.id);
  if(gm==="alla")return userTotPts(u)+userTipTotalPts(u)+userSnabbastTotalPts(u.id)+userMåljaktenTotalPts(u.id);
  return 0;
}
async function updatePrivateLeagueSnapshots(){
  // Se till att nödvändig data är laddad för de spelformer som faktiskt har privata ligor,
  // oavsett vilken flik admin råkar stå på just nu.
  const modesInUse=new Set(allPrivateLeagues.filter(pl=>pl.approved).map(pl=>pl.game_mode));
  try{
    if(modesInUse.has("quiz")&&!quizQuestions.length){ quizQuestions=await fetchAllQuizAdmin(); window._quizAllAnswers=await fetchAllQuizAnswersAll(); }
    if(modesInUse.has("streak")&&!streakAllTips.length){ streakAllTips=await fetchAllStreakTips(); }
    if(modesInUse.has("duellen")&&!duellenFixtures.length){ duellenFixtures=await fetchDuellenFixtures(); }
    if(modesInUse.has("lts")&&!ltsAllPicksGlobal.length){ ltsConfig=await fetchLtsConfig(); ltsAllPicksGlobal=await fetchAllLtsPicks(); }
  }catch(e){console.error("updatePrivateLeagueSnapshots preload error:",e);}
  for(const pl of allPrivateLeagues){
    if(!pl.approved||!pl.private_league_members)continue;
    const memberIds=(pl.private_league_members||[]).map(m=>m.user_id);
    const memberUsers=users.filter(u=>memberIds.includes(u.id));
    const gm=pl.game_mode;
    const sorted=[...memberUsers].sort((a,b)=>privateLeagueGetPts(gm,b)-privateLeagueGetPts(gm,a));
    const snapshot={};
    sorted.forEach((u,i)=>{snapshot[u.id]=i+1;});
    await sb.from("private_leagues").update({standings_snapshot:snapshot}).eq("id",pl.id);
  }
}

  }
  const now=Date.now();

  try{
    if(!presenceSessionId){
      presenceSessionId=currentUser.id+"-"+Date.now();

      else { console.warn("🟢 presence session skapad:",presenceSessionId); logPresenceDebug("insert_ok",{sessionId:presenceSessionId}); }
    } else {

      // helt genom att bara lägga till en ny rad varje gång istället).

// Slår ihop user_sessions med presence_pings så att last_seen blir korrekt
// (den gamla UPDATE-baserade last_seen litar vi inte längre på).
function mergeSessionsWithPings(sessions,pings){
  const maxPingBySession={};
  pings.forEach(p=>{
    const t=new Date(p.ts).getTime();
    if(!maxPingBySession[p.session_id]||t>maxPingBySession[p.session_id]) maxPingBySession[p.session_id]=t;
  });
  return sessions.map(s=>{
    const startMs=new Date(s.session_start).getTime();
    const oldLastSeenMs=new Date(s.last_seen).getTime();
    const pingMs=maxPingBySession[s.id];
    const bestMs=Math.max(startMs,oldLastSeenMs,pingMs||0);
    return {...s,last_seen:new Date(bestMs).toISOString()};
  });
}

// Räknar fram en spelares liv/utslagning live, omgång för omgång.
// Gränserna är proportionella mot totala antalet omgångar (ungefär 36%/36%/28%,
// samma fördelning som ursprungligen designades för en 14-lagsserie), så känslan
// blir densamma oavsett om serien har 14, 20 eller något annat antal lag.
function ltsLifeCap(compRound,totalRounds){
  const total=totalRounds||14;
  const cutoff1=Math.round(total*(5/14));
  const cutoff2=Math.round(total*(10/14));
  if(compRound<=cutoff1) return 3;
  if(compRound<=cutoff2) return 2;
  return 1;
}
function ltsComputeState(userId){
  const startRound=ltsConfig.start_round;
  if(!startRound) return {lives:3,eliminated:false,eliminatedAtRound:null,usedTeams:new Set(),history:[]};
  let rawLives=3, lives=3, eliminated=false, eliminatedAtRound=null;
  const usedTeams=new Set();
  const maxRound=startRound+(ltsConfig.max_rounds||TEAMS.length)-1;
  const roundKeys=Object.keys(rounds).map(Number).sort((a,b)=>a-b).filter(r=>r>=startRound&&r<=maxRound);
  const history=[];
  for(const r of roundKeys){
    if(eliminated) break;
    const compRound=r-startRound+1;
    const cap=ltsLifeCap(compRound,ltsConfig.max_rounds||TEAMS.length);
    const rd=rounds[String(r)];
    const pick=ltsAllPicksGlobal.find(p=>p.user_id===userId&&Number(p.round_num)===r);
    if(!rd||!rd.results_published){
      lives=Math.min(rawLives,cap);
      history.push({round:r,teamId:pick?Number(pick.team_id):null,pending:true,cap});
      break;
    }
    if(!pick){
      rawLives--;
      lives=Math.min(rawLives,cap);
      history.push({round:r,teamId:null,result:"no-pick",livesAfter:lives,cap});
      if(lives<=0){eliminated=true;eliminatedAtRound=r;}
      continue;
    }
    const teamId=Number(pick.team_id);
    const m=rd.matches.find(x=>x.hId===teamId||x.aId===teamId);
    if(!m){ lives=Math.min(rawLives,cap); history.push({round:r,teamId,result:"no-match",cap}); continue; }
    const isHome=m.hId===teamId;
    const gf=isHome?m.hMål:m.aMål, ga=isHome?m.aMål:m.hMål;
    const survived=gf>=ga;
    usedTeams.add(teamId);
    if(!survived) rawLives--;
    lives=Math.min(rawLives,cap);
    history.push({round:r,teamId,result:survived?"safe":"loss",livesAfter:lives,cap});
    if(lives<=0){eliminated=true;eliminatedAtRound=r;}
  }
  return {lives,eliminated,eliminatedAtRound,usedTeams,history};
}
function ltsTotalGoalsSoFar(){
  const startRound=ltsConfig.start_round;
  if(!startRound) return 0;
  const maxRound=startRound+(ltsConfig.max_rounds||TEAMS.length)-1;
  let total=0;
  Object.keys(rounds).map(Number).filter(r=>r>=startRound&&r<=maxRound).forEach(r=>{
    const rd=rounds[String(r)];
    if(rd&&rd.results_published&&rd.matches) total+=rd.matches.reduce((s,m)=>s+(m.hMål||0)+(m.aMål||0),0);
  });
  return total;
}
function userLtsRoundsSurvived(userId){
  const state=ltsComputeState(userId);
  return state.history.filter(h=>h.result==="safe").length;
}

const INVESTERARE_START=1000;
function investerareTeamPct(teamId,m){
  const isHome=m.hId===teamId;
  const gf=isHome?m.hMål:m.aMål, ga=isHome?m.aMål:m.hMål;
  let pct=0;
  if(gf>ga) pct+=10; else if(gf===ga) pct+=2; else pct-=8;
  if(ga===0) pct+=2;
  if(gf>3) pct+=3;
  if(gf>ga && (gf-ga)>=3) pct+=3;
  return pct;
}

// Räknar fram en spelares portfölj-historik omgång för omgång (körs live, inget sparas mellanvägen)
function investerareComputeState(userId,uptoRound){
  let balance=INVESTERARE_START;
  const history=[];
  const roundKeys=Object.keys(rounds).map(Number).sort((a,b)=>a-b).filter(r=>r<=uptoRound);
  for(const r of roundKeys){
    const rd=rounds[String(r)];
    const invs=investerareAllTipsGlobal.filter(t=>t.user_id===userId&&Number(t.round_num)===r);
    const totalInvested=invs.reduce((s,i)=>s+Number(i.amount),0);
    const uninvested=Math.max(0,balance-totalInvested);
    if(!rd||!rd.results_published){
      history.push({round:r,balanceStart:balance,invested:totalInvested,uninvested,pending:true,details:invs.map(i=>({teamId:Number(i.team_id),amount:Number(i.amount)})),balanceEnd:balance});
      break;
    }
    let balanceEnd=uninvested;
    const details=invs.map(inv=>{
      const teamId=Number(inv.team_id);
      const m=rd.matches.find(x=>x.hId===teamId||x.aId===teamId);
      if(!m){ balanceEnd+=Number(inv.amount); return {teamId,amount:Number(inv.amount),pct:0,newAmount:Number(inv.amount)}; }
      const pct=investerareTeamPct(teamId,m);
      const newAmount=Number(inv.amount)*(1+pct/100);
      balanceEnd+=newAmount;
      return {teamId,amount:Number(inv.amount),pct,newAmount};
    });
    history.push({round:r,balanceStart:balance,invested:totalInvested,uninvested,details,balanceEnd,pending:false});
    balance=balanceEnd;
  }
  return {balance,history};
}
function investerareCurrentBalance(userId){
  const maxRound=Math.max(0,...Object.keys(rounds).map(Number));
  return investerareComputeState(userId,maxRound).balance;
}

function generateRoundRobinSchedule(participantIds){
  let ids=[...participantIds];
  // Blanda slumpmässigt innan schemat byggs, så det inte alltid blir samma ordning
  for(let i=ids.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [ids[i],ids[j]]=[ids[j],ids[i]];
  }
  if(ids.length%2!==0) ids.push("BOT");
  const n=ids.length;
  if(n<2) return [];
  const fixed=ids[0];
  let rest=ids.slice(1);
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const rotated=[fixed,...rest];
    const pairs=[];
    for(let i=0;i<n/2;i++){
      let a=rotated[i], b=rotated[n-1-i];
      // Växla hemma/borta mellan omgångar för lite balans
      if(r%2===1){ const t=a; a=b; b=t; }
      pairs.push([a,b]);
    }
    rounds.push(pairs);
    rest.unshift(rest.pop());
  }
  return rounds; // array av omgångar, varje omgång = array av [homeId,awayId]
}
async function generateDuellenSeason(){
  const signups=await fetchDuellenSignups();
  const ids=signups.map(s=>s.user_id);
  if(ids.length<2) return {error:{message:"Behöver minst 2 anmälda för att starta."}};
  const schedule=generateRoundRobinSchedule(ids);
  const fixtures=[];
  schedule.forEach((pairs,idx)=>{
    const roundNum=idx+1;
    pairs.forEach(([a,b],pIdx)=>{
      fixtures.push({
        id:`${currentLeague.id}-${roundNum}-${pIdx}`,
        league_id:currentLeague.id,
        round_num:roundNum,
        home_user_id:a==="BOT"?null:a,
        away_user_id:b==="BOT"?null:b,
        home_is_bot:a==="BOT",
        away_is_bot:b==="BOT"
      });
    });
  });
  const {error:delErr}=await sb.from("duellen_fixtures").delete().eq("league_id",currentLeague.id);
  if(delErr) return {error:delErr};
  const {error:insErr}=await sb.from("duellen_fixtures").insert(fixtures);
  if(insErr) return {error:insErr};
  const {error:cfgErr}=await sb.from("duellen_config").upsert({league_id:currentLeague.id,status:"active",total_rounds:schedule.length});
  if(cfgErr) return {error:cfgErr};
  return {error:null,rounds:schedule.length};
}

// Avancerar Duellen till nästa säsong. Säsong 1→2: rak indelning efter poäng.
// Säsong 2+: upp-/nedflyttning mellan divisioner (Div2→Div1: topp 2 + 4 "lucky treor").
async function advanceDuellenSeason(){
  const curSeason=duellenConfig.season_num||1;
  const nextSeason=curSeason+1;
  const existingRoundNums=duellenFixtures.map(fx=>fx.round_num);
  const startRound=(existingRoundNums.length?Math.max(...existingRoundNums):0)+1;
  let assignments=[]; // {tier,name,members:[userId,...]}

  if(!duellenDivisions.length){
    // Säsong 1 (fritt seriespel) → dela in rakt efter slutplacering
    const curFixtures=duellenFixtures.filter(fx=>(fx.season_num||1)===curSeason && !fx.division_id);
    const standings=duellenStandings(curFixtures);
    if(standings.length<2) return {error:{message:"För få spelare med resultat för att dela in i divisioner."}};
    let idx=0;
    outer1:
    for(const tierDef of DUELLEN_TIERS){
      for(const name of tierDef.names){
        if(idx>=standings.length) break outer1;
        assignments.push({tier:tierDef.tier,name,members:standings.slice(idx,idx+DUELLEN_DIV_SIZE).map(s=>s.id)});
        idx+=DUELLEN_DIV_SIZE;
      }
    }
    if(idx<standings.length) assignments.push({tier:4,name:"Div2 Extra",members:standings.slice(idx).map(s=>s.id)});
  } else {
    // Säsong 2+: räkna ut varje divisions slutställning, flytta upp/ner
    const perDivStandings={}; // divisionId -> sorted standings
    duellenDivisions.forEach(div=>{
      const divFixtures=duellenFixtures.filter(fx=>fx.division_id===div.id);
      perDivStandings[div.id]=duellenStandings(divFixtures);
    });
    const byTier={};
    duellenDivisions.forEach(div=>{ (byTier[div.tier]=byTier[div.tier]||[]).push(div); });

    // Bygg nya divisionslistor per tier, börjar tomma
    const pools={}; // tier -> array of userIds som ska in i den tiern nästa säsong
    DUELLEN_TIERS.forEach(t=>pools[t.tier]=[]);

    DUELLEN_TIERS.forEach((tierDef,tIdx)=>{
      const divs=byTier[tierDef.tier]||[];
      divs.forEach(div=>{
        const st=perDivStandings[div.id]||[];
        const isTop=tierDef.tier===DUELLEN_TIERS[0].tier;
        const isBottom=tIdx===DUELLEN_TIERS.length-1;
        const up=st.slice(0,isTop?0:2).map(s=>s.id);
        const stay=st.slice(isTop?0:2, isBottom?st.length:Math.max(st.length-2,0)).map(s=>s.id);
        const down=isBottom?[]:st.slice(Math.max(st.length-2,0)).map(s=>s.id);
        if(up.length) pools[DUELLEN_TIERS[tIdx-1].tier].push(...up);
        pools[tierDef.tier].push(...stay);
        if(down.length) pools[DUELLEN_TIERS[tIdx+1]?DUELLEN_TIERS[tIdx+1].tier:tierDef.tier].push(...down);
      });
      // Special: Div2(4)→Div1(3): "lucky treor" – bästa 3:orna över alla Div2-serier
      // fyller upp Div1 till 28 platser om det behövs
      if(tierDef.tier===4){
        const thirds=divs.map(div=>({div,third:(perDivStandings[div.id]||[])[2]})).filter(x=>x.third);
        thirds.sort((a,b)=>b.third.pts-a.third.pts||b.third.gd-a.third.gd);
        const luckyCount=Math.max(0, Math.min(4, thirds.length));
        thirds.slice(0,luckyCount).forEach(x=>{
          pools[3].push(x.third.id);
          // Ta bort denna spelare från "stay"-poolen för tier 4 (de flyttas upp istället)
          const i=pools[4].indexOf(x.third.id);
          if(i>=0) pools[4].splice(i,1);
        });
      }
    });

    // Bygg assignments: fyll varje tiers namngivna divisioner med max DUELLEN_DIV_SIZE spelare
    DUELLEN_TIERS.forEach(tierDef=>{
      const pool=[...new Set(pools[tierDef.tier]||[])];
      let idx=0;
      tierDef.names.forEach(name=>{
        if(idx>=pool.length) return;
        assignments.push({tier:tierDef.tier,name,members:pool.slice(idx,idx+DUELLEN_DIV_SIZE)});
        idx+=DUELLEN_DIV_SIZE;
      });
      if(idx<pool.length) assignments.push({tier:tierDef.tier,name:`Div${tierDef.tier} Extra`,members:pool.slice(idx)});
    });
    assignments=assignments.filter(a=>a.members.length>=2);
  }

  for(const a of assignments){
    const divId=`${currentLeague.id}-s${nextSeason}-${a.name.replace(/\s+/g,"_")}`;
    const {error:dErr}=await sb.from("duellen_divisions").insert({id:divId,league_id:currentLeague.id,season_num:nextSeason,tier:a.tier,name:a.name,sort_order:a.tier});
    if(dErr) return {error:dErr};
    const memberRows=a.members.map(uid=>({id:divId+"-"+uid,division_id:divId,league_id:currentLeague.id,user_id:uid,is_bot:false}));
    const {error:mErr}=await sb.from("duellen_division_members").insert(memberRows);
    if(mErr) return {error:mErr};
    const schedule=generateDoubleRoundRobinSchedule(a.members);
    const fixtures=[];
    schedule.forEach((pairs,ridx)=>{
      const roundNum=startRound+ridx;
      pairs.forEach(([h,b],pidx)=>{
        fixtures.push({
          id:`${divId}-r${roundNum}-${pidx}`,league_id:currentLeague.id,round_num:roundNum,
          home_user_id:h==="BOT"?null:h,away_user_id:b==="BOT"?null:b,
          home_is_bot:h==="BOT",away_is_bot:b==="BOT",division_id:divId,season_num:nextSeason
        });
      });
    });
    const {error:fErr}=await sb.from("duellen_fixtures").insert(fixtures);
    if(fErr) return {error:fErr};
  }
  const {error:cfgErr}=await sb.from("duellen_config").upsert({league_id:currentLeague.id,status:"active",season_num:nextSeason,total_rounds:2*(DUELLEN_DIV_SIZE-1)});
  if(cfgErr) return {error:cfgErr};
  return {error:null,divisions:assignments.length,season:nextSeason};
}
// Räknar ut resultatet av en enskild duell (live, baserat på Tippa-poäng den omgången)
function duellenMatchResult(fx){
  const rd=rounds[String(fx.round_num)];
  if(!rd||!rd.results_published) return null;
  const homeUser=fx.home_is_bot?null:users.find(u=>u.id===fx.home_user_id);
  const awayUser=fx.away_is_bot?null:users.find(u=>u.id===fx.away_user_id);
  const homePts=fx.home_is_bot?0:(homeUser?userTipRoundPts(homeUser,fx.round_num):0);
  const awayPts=fx.away_is_bot?0:(awayUser?userTipRoundPts(awayUser,fx.round_num):0);
  let homeRes,awayRes;
  if(homePts>awayPts){homeRes=3;awayRes=0;}
  else if(homePts<awayPts){homeRes=0;awayRes=3;}
  else {homeRes=1;awayRes=1;}
  return {homePts,awayPts,homeRes,awayRes,decided:true};
}
function duellenStandings(fixtures){
  const table={};
  const ensure=(id,isBot,namn)=>{
    const key=isBot?"BOT":id;
    if(!table[key]) table[key]={id:key,namn:namn||"Bot",isBot,played:0,w:0,d:0,l:0,pts:0,gd:0};
    return table[key];
  };
  fixtures.forEach(fx=>{
    const result=duellenMatchResult(fx);
    if(!result) return;
    const homeUser=fx.home_is_bot?null:users.find(u=>u.id===fx.home_user_id);
    const awayUser=fx.away_is_bot?null:users.find(u=>u.id===fx.away_user_id);
    const h=ensure(fx.home_user_id,fx.home_is_bot,homeUser?homeUser.namn:"Bot");
    const a=ensure(fx.away_user_id,fx.away_is_bot,awayUser?awayUser.namn:"Bot");
    h.played++; a.played++;
    h.gd+=(result.homePts-result.awayPts); a.gd+=(result.awayPts-result.homePts);
    if(result.homeRes===3){h.w++;a.l++;} else if(result.awayRes===3){a.w++;h.l++;} else {h.d++;a.d++;}
    h.pts+=result.homeRes; a.pts+=result.awayRes;
  });
  return Object.values(table).filter(r=>!r.isBot).sort((x,y)=>y.pts-x.pts||y.gd-x.gd||x.namn.localeCompare(y.namn,"sv"));
}

function matchfokusQuestions(hName,aName){
  return [
    {id:"goals",label:"Hur många mål blir det i matchen?",opts:[["0-1","0-1"],["2-3","2-3"],["4+","4+"]]},
    {id:"ht_leader",label:"Vilket lag leder i halvtid?",opts:[["H",hName||"Hemmalaget"],["X","Oavgjort"],["A",aName||"Bortalaget"]]},
    {id:"first_scorer",label:"Vilket lag gör första målet?",opts:[["H",hName||"Hemmalaget"],["A",aName||"Bortalaget"],["N","Inget mål"]]},
    {id:"winner",label:"Vilket lag vinner matchen?",opts:[["H",hName||"Hemmalaget"],["X","Oavgjort"],["A",aName||"Bortalaget"]]},
    {id:"goal_before10",label:"Blir det mål i matchen innan 9:59?",opts:[["J","Ja"],["N","Nej"]]},
    {id:"h1_goals",label:"Hur många mål blir det i första halvlek?",opts:[["0","0"],["1","1"],["2+","2+"]]},
    {id:"both_halves_goals",label:"Blir det mål i båda halvlekarna?",opts:[["J","Ja"],["N","Nej"]]},
    {id:"btts",label:"Gör båda lagen mål?",opts:[["J","Ja"],["N","Nej"]]},
    {id:"most_goals_half",label:"Vilken halvlek får flest mål?",opts:[["1","1:a halvlek"],["2","2:a halvlek"],["X","Lika"]]},
    {id:"btts_both_halves",label:"Gör båda lagen mål i båda halvlekarna?",opts:[["J","Ja"],["N","Nej"]]},
    {id:"margin2",label:"Vinner något av lagen med minst 2 mål?",opts:[["J","Ja"],["N","Nej"]]},
    {id:"red_card",label:"Blir det ett rött kort i matchen?",opts:[["J","Ja"],["N","Nej"]]},
    {id:"exact_score",label:"Exakt matchresultat",type:"score"}
  ];
}
function matchfokusFocusMatch(rd){
  if(!rd||rd.focus_h_id==null||rd.focus_a_id==null)return null;
  return (rd.matches||[]).find(m=>m.hId===rd.focus_h_id&&m.aId===rd.focus_a_id)||null;
}
function computeMatchfokusFacts(rd){
  if(!rd||!rd.focus_published)return null;
  const m=matchfokusFocusMatch(rd);
  if(!m)return null;
  const ftH=m.hMål||0, ftA=m.aMål||0;
  const htH=rd.focus_ht_h??0, htA=rd.focus_ht_a??0;
  const h2H=ftH-htH, h2A=ftA-htA;
  const totalGoals=ftH+ftA, h1Goals=htH+htA, h2Goals=h2H+h2A;
  return {
    goals: totalGoals<=1?"0-1":totalGoals<=3?"2-3":"4+",
    ht_leader: htH>htA?"H":htH<htA?"A":"X",
    first_scorer: rd.focus_first_scorer||"N",
    winner: ftH>ftA?"H":ftH<ftA?"A":"X",
    goal_before10: rd.focus_goal_before10?"J":"N",
    h1_goals: h1Goals===0?"0":h1Goals===1?"1":"2+",
    both_halves_goals: (h1Goals>0&&h2Goals>0)?"J":"N",
    btts: (ftH>0&&ftA>0)?"J":"N",
    most_goals_half: h1Goals>h2Goals?"1":h1Goals<h2Goals?"2":"X",
    btts_both_halves: (htH>0&&htA>0&&h2H>0&&h2A>0)?"J":"N",
    margin2: Math.abs(ftH-ftA)>=2?"J":"N",
    red_card: rd.focus_red_card?"J":"N",
    exact_score: `${ftH}-${ftA}`
  };
}
function calcMatchfokusPts(answers,facts){
  if(!answers||!facts)return 0;
  const qs=matchfokusQuestions("","");
  return qs.reduce((s,q)=>s+((answers[q.id]!==undefined&&answers[q.id]!==null&&String(answers[q.id])===String(facts[q.id]))?1:0),0);
}
function userMatchfokusRoundPts(userId,roundNum){
  const rd=rounds[String(roundNum)];
  const facts=computeMatchfokusFacts(rd);
  if(!facts)return 0;
  const tip=matchfokusAllTipsGlobal.find(t=>t.user_id===userId&&Number(t.round_num)===Number(roundNum));
  if(!tip)return 0;
  return calcMatchfokusPts(tip.answers||{},facts);
}

function plPts(player,rd){
  if(!rd)return 0;
  const m=rd.matches.find(x=>x.hId===player.teamId||x.aId===player.teamId);
  if(!m)return 0;
  const home=m.hId===player.teamId;
  const mg=home?m.hMål:m.aMål, og=home?m.aMål:m.hMål;
  let p=mg>og?5:(mg===og?2:0);
  if(og===0)p+=POS_PTS[player.pos].clean;
  const goals=(rd.goals&&rd.goals[player.id])||0;
  p+=goals*POS_PTS[player.pos].goal;
  return p;
}
function userRoundPts(u,r){
  if(!u)return 0;
  const rd=rounds[String(r)];
  if(!rd||!rd.results_published)return 0;
  const snapshotMap=rd.picks_snapshot||{};
  const hasAnySnapshot=Object.keys(snapshotMap).length>0;
  const snapshot=snapshotMap[u.id];
  // Om omgången har en ögonblicksbild (dvs publicerad på vanligt sätt) men just den här
  // spelaren saknas i den, fanns spelaren inte med då – ska inte få poäng för omgången.
  if(hasAnySnapshot&&!snapshot)return 0;
  if(rd.locked_at&&u.created_at&&new Date(rd.locked_at)<new Date(u.created_at))return 0;
  // Använd ögonblicksbilden om den finns, annars nuvarande lag (endast relevant för äldre
  // omgångar från innan ögonblicksbilder infördes, då picks_snapshot är helt tomt)
  const picks=snapshot?snapshot.picks:u.picks;
  const kapten=snapshot?snapshot.kapten:u.kapten;
  const activeChip=snapshot?snapshot.activeChip:null;
  const chipMeta=snapshot?snapshot.chipMeta:null;
  if(!picks)return 0;
  let tot=0;
  const allPicked=[...(picks.GK||[]),...(picks.DEF||[]),...(picks.MID||[]),...(picks.FW||[])];
  allPicked.forEach(pid=>{
    const pl=players.find(p=>p.id===pid);
    if(!pl)return;
    const pts=plPts(pl,rd);
    let mult=pid===kapten?2:1;
    if(activeChip==="kaptenboost"&&pid===kapten) mult=3;
    if(activeChip==="hallanollan"&&(pl.pos==="GK"||pl.pos==="DEF")){
      const m=rd.matches.find(x=>x.hId===pl.teamId||x.aId===pl.teamId);
      if(m){
        const home=m.hId===pl.teamId;
        const og=home?m.aMål:m.hMål;
        if(og===0) mult*=2;
      }
    }
    if(activeChip==="trippelbindeln"&&chipMeta&&chipMeta.boostedIds&&chipMeta.boostedIds.includes(pid)) mult*=2;
    tot+=pts*mult;
  });
  return tot;
}
function userTotPts(u){ return Object.keys(rounds).reduce((s,r)=>s+userRoundPts(u,Number(r)),0); }

// ── Ligatippen – poäng ────────────────────────────────────────────────────────────
function calcLigatippPts(userTip,actualStandings){
  if(!userTip||!actualStandings||!actualStandings.length)return 0;
  let pts=0;
  actualStandings.forEach((teamId,idx)=>{ if(userTip[idx]===teamId) pts+=3; });
  return pts;
}
function userLigatippTotalPts(userData){
  let tot=0;
  if(ligatippStandings[1]&&ligatippStandings[1].locked) tot+=calcLigatippPts(userData.half_tip||[],ligatippStandings[1].standings);
  if(ligatippStandings[2]&&ligatippStandings[2].locked) tot+=calcLigatippPts(userData.full_tip||[],ligatippStandings[2].standings);
  return tot;
}

window.saveLigatipp=async function(){
  if(blockIfTrialExpired())return;
  const statusEl=document.getElementById("ligatipp-status");
  if(statusEl)statusEl.textContent="Sparar…";
  try{
    const half=[...ligatippDraft.half];
    const full=[...ligatippDraft.full];
    const error=await upsertLigatipp(half,full);
    if(error){if(statusEl)statusEl.innerHTML='<span style="color:#c1272d">Fel: '+error.message+'</span>';return;}
    ligatipp=Object.assign({},ligatipp||{},{halfTip:half,fullTip:full});
    if(statusEl)statusEl.innerHTML='<span style="color:#1a1a1a;font-weight:500">✓ Tipset är sparat!</span>';
  }catch(e){
    if(statusEl)statusEl.innerHTML='<span style="color:#c1272d">Fel: '+e.message+'</span>';
  }
};
function tipMatchPts(pred,actualH,actualA){
  if(!pred)return 0;
  const ph=Number(pred.predH), pa=Number(pred.predA);
  if(ph===actualH && pa===actualA) return 10;
  let pts=0;
  if(ph===actualH) pts+=4;
  if(pa===actualA) pts+=4;
  if(pts===0){
    const actualSign = actualH>actualA?1:(actualH<actualA?-1:0);
    const predSign = ph>pa?1:(ph<pa?-1:0);
    if(actualSign===predSign) pts=2;
  }
  return pts;
}
function userTipRoundPts(u,r){
  const rd=rounds[String(r)];
  if(!rd||!rd.results_published||!rd.matches.length)return 0;
  if(rd.locked_at && u.created_at && new Date(rd.locked_at) < new Date(u.created_at)) return 0;
  const tipsForRound = (u.tips&&u.tips[String(r)])||[];
  let tot=0;
  rd.matches.forEach(m=>{
    const pred=tipsForRound.find(t=>t.hId===m.hId&&t.aId===m.aId);
    const pts=tipMatchPts(pred,m.hMål,m.aMål);
    tot+=pred&&pred.boost?pts*2:pts;
  });
  return tot;
}
function userTipTotalPts(u){ return Object.keys(rounds).reduce((s,r)=>s+userTipRoundPts(u,Number(r)),0); }
function sortedUsers(){return [...users].filter(u=>pickCount(u)>0).sort((a,b)=>userTotPts(b)-userTotPts(a));}

// Bygger Swish-betalningslänken. Om inget belopp är satt (fritt belopp) utelämnas
// &amt= helt, vilket gör att mottagaren själv fyller i beloppet i Swish-appen –
// exakt så Swish egna QR-generator för företag fungerar också.
function buildSwishUrl(swishNumber,amount,message){
  let url=`https://app.swish.nu/1/p/sw/?sw=${encodeURIComponent(swishNumber||"")}`;
  if(amount) url+=`&amt=${encodeURIComponent(amount)}`;
  url+=`&cur=SEK&msg=${encodeURIComponent(message||"")}`;
  return url;
}
function swishButtonLabel(amount){
  return amount ? `Swisha ${amount} kr` : "Swisha – valfritt belopp";
}
function toDatetimeLocal(iso){
  const d=new Date(iso);
  if(isNaN(d))return"";
  const pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function formatCountdown(deadlineIso){
  const diff=new Date(deadlineIso)-new Date();
  if(diff<=0)return"Spelstopp har passerat";
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000), m=Math.floor(diff%3600000/60000);
  if(d>0)return `⏰ Spelstopp om ${d}d ${h}h ${m}m`;
  if(h>0)return `⏰ Spelstopp om ${h}h ${m}m`;
  return `⏰ Spelstopp om ${m} min`;
}
function updateCountdownEls(){
  document.querySelectorAll("[data-countdown-deadline]").forEach(el=>{
    el.textContent=formatCountdown(el.dataset.countdownDeadline);
  });
}

window._entrySearchTimer=null;
window._doEntrySearch=function(){
  clearTimeout(window._entrySearchTimer);
  window._entrySearchTimer=setTimeout(async()=>{
    const q=(document.getElementById("entry-search")?.value||"").trim();
    const resultsEl=document.getElementById("entry-search-results");
    if(!resultsEl)return;
    if(!q||q.length<2){resultsEl.innerHTML="";return;}
    resultsEl.innerHTML='<div style="font-size:12px;color:var(--color-text-secondary);text-align:center;padding:8px">Söker…</div>';
    try{
      const {data,error}=await sb.from("fantasy_users").select("id,namn,league_id").ilike("namn","%"+q+"%").in("league_id",leagues.map(l=>l.id)).limit(20);
      if(error||!data||!data.length){
        resultsEl.innerHTML='<div style="font-size:13px;color:var(--color-text-secondary);text-align:center;padding:8px">Ingen match hittades.</div>';
        return;
      }
      resultsEl.innerHTML=data.map(u=>{
        const lg=leagues.find(l=>l.id===u.league_id);
        return `<button data-act="entry-pick-user" data-id="${u.id}" data-league-id="${u.league_id}" data-namn="${esc(u.namn)}" class="fg-card" style="display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;border:0.5px solid var(--color-border-tertiary);margin-bottom:8px">
          <div style="width:36px;height:36px;border-radius:50%;background:#c1272d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0">${esc(u.namn[0])}</div>
          <div style="flex:1"><div style="font-weight:500;font-size:14px">${esc(u.namn)}</div><div style="font-size:11px;color:var(--color-text-secondary)">${esc(lg?lg.name:"")}</div></div>
          <span style="color:var(--color-text-secondary)">›</span>
        </button>`;
      }).join("");
      attachHandlers();
    }catch(e){
      console.error(e);
      resultsEl.innerHTML='<div style="font-size:12px;color:#A32D2D;text-align:center;padding:8px">Något gick fel, försök igen.</div>';
    }
  },300);
};

function pickMissingText(){
  const missing = POSITIONS.filter(pos=>(pickState.picks[pos]||[]).length < POS_COUNT[pos]);
  if(missing.length) return "Saknas: "+missing.map(p=>{
    const have=(pickState.picks[p]||[]).length;
    return `${POS_LABEL[p]} (${have}/${POS_COUNT[p]})`;
  }).join(", ");
  if(!pickState.kapten) return "Saknas: välj en kapten (klicka ☆ på en av dina spelare)";
  return "";
}

function usedTeamIds(excludePid){
  let ids=[];
  POSITIONS.forEach(pos=>{ (pickState.picks[pos]||[]).forEach(pid=>{ if(pid!==excludePid)ids.push(pid); }); });
  return ids.map(pid=>{const p=players.find(x=>x.id===pid);return p?p.teamId:null;}).filter(x=>x!=null);
}

function renderPick(){
  const picks=pickState.picks, kap=pickState.kapten;
  const totalPicked = POSITIONS.reduce((s,pos)=>s+(picks[pos]||[]).length,0);
  const searchVal=document.getElementById("player-search")?document.getElementById("player-search").value.toLowerCase():"";
  const teamFilter=pickTeamFilter;
  const filtered=players.filter(p=>{
    if(p.pos!==pickPos) return false;
    if(searchVal && !p.namn.toLowerCase().includes(searchVal)) return false;
    if(teamFilter && String(p.teamId)!==teamFilter) return false;
    return true;
  });
  const usedTeams = (currentUser&&currentUser.activeChip==="frittlag") ? [] : usedTeamIds(null);

  const posTabs=POSITIONS.map(pos=>{
    const have=(picks[pos]||[]).length, need=POS_COUNT[pos];
    const full=have>=need;
    const active=pickPos===pos;
    const bg=full?POS_COLOR[pos].bg:"var(--color-background-primary)";
    const fc=full?POS_COLOR[pos].fc:"var(--color-text-secondary)";
    return `<button data-act="pos-tab" data-pos="${pos}" style="flex:1;padding:8px 2px;border-radius:6px;border:${active?`1.5px solid ${G_GREEN}`:"0.5px solid var(--color-border-secondary)"};background:${bg};color:${fc};font-size:11px;font-weight:500;cursor:pointer">${pos} ${have}/${need}</button>`;
  }).join("");

  const rows=filtered.map(p=>{
    const sel=(picks[p.pos]||[]).includes(p.id);
    const isCap=kap===p.id;
    const team=TEAMS.find(t=>t.id===p.teamId);
    const c=POS_COLOR[p.pos];
    const teamTaken = !sel && usedTeams.includes(p.teamId);
    const posFull = !sel && (picks[p.pos]||[]).length >= POS_COUNT[p.pos];
    const disabled = teamTaken || posFull;
    return `
    <div class="fg-card" style="margin-bottom:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;opacity:${disabled?0.45:1}">
      <div class="fg-posbadge" style="width:34px;height:34px;background:${c.bg};color:${c.fc};font-size:11px">${p.pos}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:${sel?500:400}">${esc(p.namn)}</div>
        <div style="font-size:12px;color:var(--color-text-secondary)">${esc(team?team.name:"")}${teamTaken?' · lag redan valt':''}</div>
      </div>
      ${sel?`<button data-act="toggle-cap" data-id="${p.id}" style="background:${isCap?G_GOLDL:"var(--color-background-secondary)"};border:0.5px solid ${isCap?G_GOLD:"#ccc"};color:${isCap?G_GOLD:"var(--color-text-secondary)"};border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;font-weight:500">${isCap?"★ Kapten":"☆"}</button>`:""}
      ${sel&&currentUser&&currentUser.activeChip==="trippelbindeln"&&p.pos!=="GK"?(()=>{
        const boosted=(pickState.chipMeta&&pickState.chipMeta.boostedIds||[]).includes(p.id);
        return `<button data-act="toggle-boost" data-id="${p.id}" data-pos="${p.pos}" style="background:${boosted?'#fff3d6':"var(--color-background-secondary)"};border:0.5px solid ${boosted?'#e6a817':"#ccc"};color:${boosted?'#e6a817':"var(--color-text-secondary)"};border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;font-weight:500">${boosted?"🚀 Boost":"🚀"}</button>`;
      })():""}
      <button data-act="pick-player" data-id="${p.id}" ${disabled?"disabled":""} style="width:32px;height:32px;border-radius:50%;background:${sel?G_GREENL:"var(--color-background-secondary)"};border:0.5px solid ${sel?G_GREEN:"#ccc"};color:${sel?G_GREEN:"var(--color-text-secondary)"};display:flex;align-items:center;justify-content:center;cursor:${disabled?"not-allowed":"pointer"};font-size:16px;flex-shrink:0">${sel?"✓":"+"}</button>
    </div>`;
  }).join("");

  const missing = pickMissingText();

  return `
  <div style="min-height:100vh;padding-bottom:90px">
    <div class="fg-top">
      <button data-act="back-to-main" style="background:none;border:none;color:#fff;cursor:pointer;font-size:20px;padding:0">←</button>
      <span style="font-weight:500;font-size:16px">Bygg ditt 4-3-3-lag</span>
    </div>
    <div style="padding:12px 16px 0">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="player-search" type="search" placeholder="🔍 Sök spelare..." oninput="window._playerSearchRender&&window._playerSearchRender()" style="flex:1;padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:13px;background:var(--color-background-secondary)"/>
        <select id="team-filter" onchange="window._playerSearchRender&&window._playerSearchRender()" style="padding:8px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:12px;background:var(--color-background-secondary);max-width:130px">
          <option value="" ${pickTeamFilter===""?"selected":""}>Alla lag</option>
          ${TEAMS.sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<option value="${t.id}" ${String(t.id)===String(pickTeamFilter)?"selected":""}>${esc(t.name)}</option>`).join("")}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div style="background:var(--color-background-secondary);border-radius:6px;padding:10px 8px;text-align:center">
          <div style="font-size:11px;color:var(--color-text-secondary)">Spelare valda</div>
          <div style="font-size:18px;font-weight:500">${totalPicked} / ${TOTAL_PICKS}</div>
        </div>
        <div style="background:${kap?G_GOLDL:"var(--color-background-secondary)"};border-radius:6px;padding:10px 8px;text-align:center">
          <div style="font-size:11px;color:${kap?G_GOLD:"var(--color-text-secondary)"}">Kapten</div>
          <div style="font-size:16px;font-weight:500;color:${kap?G_GOLD:"var(--color-text-primary)"}">${kap?esc((players.find(p=>p.id===kap)||{namn:""}).namn):"Ej vald"}</div>
        </div>
      </div>
      ${(()=>{
        const chipDefs=[
          {id:"hallanollan",ico:"🧤",label:"Hålla nollan-boost",desc:"x2 för försvarare + målvakt om laget håller nollan"},
          {id:"trippelbindeln",ico:"🚀",label:"Trippelbindeln",desc:"x2 för en DEF, en MID och en FW (välj i listan nedan)"},
          {id:"kaptenboost",ico:"👑",label:"Kaptenboost",desc:"Kaptenen ger x3 istället för x2"},
          {id:"frittlag",ico:"♾️",label:"Fritt lag från ett lag",desc:"Stapla obegränsat från samma klubb denna omgång"}
        ];
        const chipsUsed=currentUser.chipsUsed||[];
        const activeChip=currentUser.activeChip;
        const rows=chipDefs.map(c=>{
          const used=chipsUsed.includes(c.id);
          const active=activeChip===c.id;
          const otherActive=activeChip&&!active;
          const bg=active?'#fff3d6':used?'var(--color-background-secondary)':'var(--color-background-primary)';
          const border=active?'1.5px solid #e6a817':'0.5px solid var(--color-border-tertiary)';
          return `<div style="display:flex;align-items:center;gap:10px;padding:10px;background:${bg};border:${border};border-radius:8px;margin-bottom:6px;opacity:${used&&!active?0.5:1}">
            <span style="font-size:20px">${c.ico}</span>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${c.label}${active?' – Aktiv denna omgång':used?' – Använt':''}</div>
              <div style="font-size:11px;color:var(--color-text-secondary)">${c.desc}</div>
            </div>
            <button data-act="${active?'deactivate-chip':'activate-chip'}" data-chip="${c.id}" ${used&&!active?"disabled":otherActive?"disabled":""} style="background:${active?'#e6a817':'#1a1a1a'};color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:500;cursor:${used&&!active||otherActive?'not-allowed':'pointer'};white-space:nowrap;opacity:${used&&!active||otherActive?0.4:1}">${active?"Avbryt":used?"Använt":"Använd"}</button>
          </div>`;
        }).join("");
        return `<div class="fg-card" style="margin-bottom:10px">
          <div style="font-weight:500;margin-bottom:2px">🃏 Chip</div>
          <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:10px">Ett per omgång, ett per säsong – välj klokt</div>
          ${rows}
        </div>`;
      })()}
      ${(()=>{
        const frittlagActive=currentUser&&currentUser.activeChip==="frittlag";
        const usedTeamsForDisplay=frittlagActive?[]:usedTeamIds(null);
        const badges=TEAMS.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(t=>{
          const used=usedTeamsForDisplay.includes(t.id);
          return `<span style="padding:4px 10px;border-radius:14px;font-size:11px;font-weight:500;white-space:nowrap;background:${used?'#e8e8e8':S_GREENL};color:${used?'#999':S_GREEN};border:0.5px solid ${used?'#ddd':S_GREEN}">${used?"✓ ":""}${esc(t.name)}</span>`;
        }).join("");
        return `<div class="fg-card" style="margin-bottom:10px">
          <div style="font-weight:500;font-size:12px;margin-bottom:8px">🏟 Lag i ditt lag${frittlagActive?' <span style="color:var(--color-text-secondary);font-weight:400">(Fritt lag aktivt – ingen spärr just nu)</span>':""}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${badges}</div>
        </div>`;
      })()}
      <div style="display:flex;gap:4px;margin-bottom:10px">${posTabs}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px">⚠️ Max en spelare per lag totalt i hela laget</div>
      ${pickErr?`<div style="font-size:12px;color:#A32D2D;margin-bottom:8px;font-weight:500">${esc(pickErr)}</div>`:""}
      <div style="font-size:13px;font-weight:500;margin-bottom:6px">${POS_LABEL[pickPos]}</div>

    <div id="player-list" style="padding:0 16px">${rows || '<div style="font-size:13px;color:var(--color-text-secondary)">Inga spelare hittades.</div>'}</div>

      ${missing?`<div style="font-size:12px;color:#A32D2D;margin-bottom:8px;text-align:center;font-weight:500">${esc(missing)}</div>`:""}

      <button class="fg-btn" data-act="save-team">Spara mitt lag →</button>
    </div>
  </div>`;
}

  return `

function renderTippUserView(u,r){
  const rd=rounds[String(r)];
  const sortedTip=[...users].filter(u=>Object.keys(u.tips||{}).some(r=>(u.tips[r]||[]).length>0)).sort((a,b)=>userTipTotalPts(b)-userTipTotalPts(a));
  const rank=sortedTip.findIndex(x=>x.id===u.id)+1;
  const allRoundKeys=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const minR=allRoundKeys.length?allRoundKeys[0]:1, maxR=allRoundKeys.length?allRoundKeys[allRoundKeys.length-1]:1;
  const savedTips=(u.tips&&u.tips[String(r)])||[];
  const resultsShown=rd&&rd.results_published;
  const roundPts=userTipRoundPts(u,r);

  let rowsHtml="";
  if(!rd||!rd.matches.length){
    rowsHtml=`<div style="font-size:13px;color:var(--color-text-secondary);padding:8px 0">Inga matcher inlagda för denna omgång.</div>`;

    rowsHtml=rd.matches.map(m=>{
      const hTeam=TEAMS.find(t=>t.id===m.hId), aTeam=TEAMS.find(t=>t.id===m.aId);

      return `<div style="padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)">

function renderLigatippTab(){
  const locked=cfg.ligatippLocked;
  const draft=ligatippCheckpoint===1?ligatippDraft.half:ligatippDraft.full;
  const unplaced=TEAMS.filter(t=>!draft.includes(t.id));
  const totalR=cfg.totalRounds||26;
  const halvtidR=Math.ceil(totalR/2);
  const cpLabel=ligatippCheckpoint===1?`Halvtid – efter omgång ${halvtidR}`:`Slutställning – efter omgång ${totalR}`;
  const checkpointResult=ligatippStandings[ligatippCheckpoint];

  const cpTabs=[
    [1,`Halvtid (Omg ${halvtidR})`],
    [2,`Slutställning (Omg ${totalR})`]
  ].map(([cp,lbl])=>`<button data-act="ligatipp-tab" data-cp="${cp}" style="flex:1;padding:8px 4px;border-radius:6px;border:${ligatippCheckpoint===cp?`1.5px solid ${G_GREEN}`:"0.5px solid var(--color-border-secondary)"};background:${ligatippCheckpoint===cp?G_GREENL:"var(--color-background-primary)"};color:${ligatippCheckpoint===cp?G_GREEN:"var(--color-text-secondary)"};font-size:12px;font-weight:500;cursor:pointer">${lbl}</button>`).join("");

  // Ranked slots
  const slots=Array.from({length:TEAMS.length}).map((_,i)=>{
    const teamId=draft[i];
    const team=teamId!==undefined?TEAMS.find(t=>t.id===teamId):null;
    const actualTeamId=checkpointResult?checkpointResult.standings[i]:null;
    const correct=team&&actualTeamId&&team.id===actualTeamId;
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <div style="width:28px;height:28px;border-radius:50%;background:${correct?"#e8f5ee":team?G_GREENL:"var(--color-background-secondary)"};color:${correct?"#1a6b3c":team?G_GREEN:"var(--color-text-secondary)"};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0">${i+1}</div>
      ${team
        ? `<span style="flex:1;font-size:14px${correct?";font-weight:500;color:#1a6b3c":""}">${esc(team.name)}${correct?" ✓":""}</span>${locked?"":`<button data-act="ligatipp-remove" data-idx="${i}" style="background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:18px;padding:0 4px">×</button>`}`
        : `<span style="flex:1;font-size:13px;color:var(--color-text-secondary);font-style:italic">— välj lag nedan —</span>`}
    </div>`;
  }).join("");

  // Available teams
  const availableHtml=locked?"":unplaced.length
    ? `<div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">Klicka ett lag för att placera det på nästa lediga plats:</div>
       <div style="display:flex;flex-wrap:wrap;gap:6px">${unplaced.map(t=>`<button data-act="ligatipp-place" data-id="${t.id}" style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer">${esc(t.name)}</button>`).join("")}</div>`
    : `<div style="font-size:13px;color:${G_GREEN};font-weight:500">Alla ${TEAMS.length} lag är placerade! Glöm inte spara.</div>`;

  // Leaderboard
  const lb=[...allLeagueTips].sort((a,b)=>userLigatippTotalPts(b)-userLigatippTotalPts(a));
  const lbRows=lb.length ? lb.map((t,i)=>{
    const u=users.find(u=>u.id===t.user_id);
    const pts=userLigatippTotalPts(t);
    const isMe=currentUser&&t.user_id===currentUser.id;
    const medals=["🥇","🥈","🥉"];
    const tipArr=ligatippCheckpoint===1?t.half_tip:t.full_tip;
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?`background:${G_GREENL};border-radius:6px;padding-left:6px;padding-right:6px`:""}">
      <span style="width:22px;text-align:center;font-size:13px">${i<3?medals[i]:i+1}</span>
      <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(u?u.namn:"?")}${isMe?" (du)":""}</span>
      <span style="font-size:12px;color:var(--color-text-secondary)">${tipArr?tipArr.length+"/"+TEAMS.length:""}</span>
      <span style="font-weight:500">${pts} p</span>
    </div>`;
  }).join("") : `<div style="font-size:13px;color:var(--color-text-secondary)">Inga tips inlagda ännu.</div>`;

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:12px">📊 Tippa serien</div>
  ${renderSponsorBanner("ligatipp")}
  <div class="fg-card" style="padding:10px">
    ${locked?`<div style="background:#fce8e8;border-radius:6px;padding:8px 12px;font-size:13px;color:#c1272d;font-weight:500;margin-bottom:10px">🔒 Tippning är stängd – säsongen har börjat</div>`:""}
    <div style="display:flex;gap:6px;margin-bottom:12px">${cpTabs}</div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">${cpLabel}</div>
    ${slots}
    ${!locked?`<div style="margin-top:12px">${availableHtml}</div>`:""}
    <div id="ligatipp-status" style="font-size:13px;min-height:20px;margin-top:10px"></div>
    ${!locked?`<button class="fg-btn" style="margin-top:8px" onclick="window.saveLigatipp()">Spara mitt tips</button>`:""}
  </div>
  <div class="fg-card">
    <div style="font-weight:500;margin-bottom:8px">Poängregler</div>
    <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.6">
      Exakt rätt placering = <b>3 p</b> · Max ${TEAMS.length*3} p per tillfälle (${TEAMS.length} lag × 3p)<br>
      Poäng delas ut två gånger: efter omgång ${halvtidR} och efter omgång ${totalR}
    </div>
  </div>
  <div class="fg-card">
    <div style="font-weight:500;margin-bottom:8px">Tippa serienen – poängställning</div>
    ${lbRows}
  </div>
  ${renderPrivateLeagueSection("ligatipp")}`;
}

function renderPrivateLeagueSection(gameMode){
  const gameModeLabel=MODE_LABELS[gameMode]||gameMode;
  const myLeagues=allPrivateLeagues.filter(l=>(l.game_mode===gameMode||l.game_mode==="alla")&&l.approved&&l.private_league_members&&l.private_league_members.some(m=>m.user_id===currentUser.id));
  const pending=allPrivateLeagues.filter(l=>l.game_mode===gameMode&&!l.approved&&l.created_by===currentUser.id);

  // Get points function for this game mode
  const getPts=(u)=>privateLeagueGetPts(gameMode,u);

  // Standings for selected private league
  let standingsHtml="";
  if(privateLeagueView){
    const pl=allPrivateLeagues.find(l=>l.id===privateLeagueView);
    if(pl&&pl.private_league_members){
      const memberIds=pl.private_league_members.map(m=>m.user_id);
      const snapshot=pl.standings_snapshot||{};
      const memberUsers=users.filter(u=>memberIds.includes(u.id)).sort((a,b)=>getPts(b)-getPts(a));
      const medals=["🥇","🥈","🥉"];
      standingsHtml=`<div class="fg-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-weight:500">${esc(pl.name)}</div>
          <button data-act="pl-close" style="background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:13px">✕ Stäng</button>
        </div>
        <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:10px">${pl.game_mode==="alla"?"🏆 Alla spel – totalpoäng":"Inbjudningskod:"} <b style="color:#111;font-weight:800;font-size:14px;letter-spacing:2px">${pl.invite_code}</b> · Dela med vänner!</div>
        ${memberUsers.map((u,i)=>{
          const rank=i+1;
          const isMe=u.id===currentUser.id;
          const prevRank=snapshot[u.id];
          const trend=prevRank===undefined?"":rank<prevRank?`<span style="color:#16a34a;font-size:14px">▲</span>`:rank>prevRank?`<span style="color:#c1272d;font-size:14px">▼</span>`:`<span style="color:var(--color-text-secondary);font-size:14px">–</span>`;
          return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?"background:"+G_GREENL+";border-radius:6px;padding-left:6px;padding-right:6px":""}">
            <span style="width:22px;text-align:center">${rank<=3?medals[rank-1]:rank}</span>
            <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(u.namn)}${isMe?" (du)":""}</span>
            ${trend}
            <span style="font-weight:500">${getPts(u)} p</span>
          </div>`;
        }).join("")}
      </div>`;
    }
  }

  const ligaList=myLeagues.map(pl=>`
    <button data-act="pl-view" data-id="${pl.id}" style="display:flex;align-items:center;gap:10px;width:100%;background:${privateLeagueView===pl.id?G_GREENL:"var(--color-background-secondary)"};border:1px solid ${privateLeagueView===pl.id?G_GREEN:"var(--color-border-secondary)"};border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;margin-bottom:6px">
      <span style="font-size:18px">👥</span>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500">${esc(pl.name)}</div>
        <div style="font-size:11px;color:var(--color-text-secondary)">${(pl.private_league_members||[]).length} deltagare · Kod: <b style="color:#111;font-weight:800">${pl.invite_code}</b></div>
      </div>
      <span style="color:var(--color-text-secondary)">›</span>
    </button>`).join("");

  const pendingHtml=pending.map(pl=>`
    <div style="background:#fffbeb;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px">
      ⏳ <b>${esc(pl.name)}</b> väntar på godkännande av admin
    </div>`).join("");

  return `<div class="fg-card" style="margin-top:10px">
    <div style="font-weight:500;margin-bottom:10px">👥 Mina privata ligor – ${gameModeLabel}</div>
    ${standingsHtml}
    ${ligaList}
    ${pendingHtml}
    <div style="display:flex;gap:8px;margin-top:8px">
      <button data-act="pl-create" data-mode="${gameMode}" class="fg-outbtn" style="flex:1;padding:8px">+ Skapa liga</button>
      <button data-act="pl-join-open" class="fg-outbtn" style="flex:1;padding:8px">Gå med med kod</button>
    </div>
    <div id="pl-join-area-${gameMode}"></div>
  </div>`;
}

function renderMatchfokusTab(){
  const rd=rounds[String(cfg.omg)];
  const m=matchfokusFocusMatch(rd);
  const locked=rd&&rd.locked;
  const hTeam=m?TEAMS.find(t=>t.id===m.hId):null;
  const aTeam=m?TEAMS.find(t=>t.id===m.aId):null;
  const hName=hTeam?hTeam.name:"Hemmalaget", aName=aTeam?aTeam.name:"Bortalaget";
  const facts=computeMatchfokusFacts(rd);
  const qs=matchfokusQuestions(hName,aName);
  const savedAnswers=matchfokusMyTips[cfg.omg]||{};

  let body="";
  if(!m){
    body=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">Admin har inte valt ut Matchexperten för omgång ${cfg.omg} än. Kom tillbaka senare!</div></div>`;
  } else if(facts){
    // Publicerat – visa facit + dina svar + poäng
    const tip=matchfokusAllTipsGlobal.find(t=>t.user_id===currentUser.id&&Number(t.round_num)===Number(cfg.omg));
    const myAnswers=tip?tip.answers||{}:{};
    const myPts=calcMatchfokusPts(myAnswers,facts);
    const rows=qs.map(q=>{
      const mine=myAnswers[q.id];
      const correct=facts[q.id];
      const ok=mine!==undefined&&String(mine)===String(correct);
      const label=v=>q.type==="score"?v:(q.opts.find(([val])=>val===v)||[,v])[1];
      return `<div style="padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:3px">${esc(q.label)}</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13px">
          <span>Ditt svar: <b>${mine!==undefined?esc(label(mine)):"–"}</b></span>
          <span style="color:var(--color-text-secondary)">Rätt: <b>${esc(label(correct))}</b></span>
          <span style="margin-left:auto;font-weight:700;color:${ok?'#1a7a3d':'#A32D2D'}">${ok?'✓ +1p':'✗'}</span>
        </div>
      </div>`;
    }).join("");
    body=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">Facit – ${esc(hName)} vs ${esc(aName)}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">Slutresultat ${m.hMål}-${m.aMål} (halvtid ${rd.focus_ht_h??0}-${rd.focus_ht_a??0})</div>
      <div style="font-size:20px;font-weight:700;color:#1a7a3d;margin-bottom:10px">${myPts} / ${qs.length} rätt</div>
      ${rows}
    </div>`;
  } else if(locked){
    body=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">🔒 Omgången är låst</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">Dina tips för ${esc(hName)} vs ${esc(aName)} är sparade. Facit och poäng visas här så fort admin publicerat matchfakta.</div>
    </div>`;
  } else {
    const pillRow=q=>{
      const current=matchfokusDraft[q.id]!==undefined?matchfokusDraft[q.id]:savedAnswers[q.id];
      if(q.type==="score"){
        const cur=(current||"-").split("-");
        return `<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px">
          <input class="fg-input" id="mf-score-h" type="number" min="0" max="20" value="${cur[0]!==undefined&&cur[0]!==""?cur[0]:''}" style="width:56px;text-align:center;padding:6px 4px"/>
          <span style="color:var(--color-text-secondary)">–</span>
          <input class="fg-input" id="mf-score-a" type="number" min="0" max="20" value="${cur[1]!==undefined?cur[1]:''}" style="width:56px;text-align:center;padding:6px 4px"/>
        </div>`;
      }
      return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        ${q.opts.map(([val,lbl])=>`<button data-act="mf-answer" data-qid="${q.id}" data-val="${val}" style="flex:1;min-width:70px;padding:9px 6px;border-radius:8px;border:1.5px solid ${current===val?G_GREEN:'var(--color-border-secondary)'};background:${current===val?G_GREENL:'var(--color-background-primary)'};color:${current===val?G_GREEN:'var(--color-text-primary)'};font-weight:${current===val?600:400};font-size:13px;cursor:pointer">${esc(lbl)}</button>`).join("")}
      </div>`;
    };
    const questionsHtml=qs.map((q,i)=>`<div style="padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <div style="font-size:13px;font-weight:500">${i+1}. ${esc(q.label)}</div>
      ${pillRow(q)}
    </div>`).join("");
    body=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:2px">⚽ Matchexperten</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${esc(hName)} vs ${esc(aName)}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">Svara på alla 13 frågor. Spara innan omgången startar!</div>
      ${questionsHtml}
      <div id="mf-status" style="font-size:13px;margin-top:10px;min-height:20px"></div>
      <button class="fg-btn" style="margin-top:8px" onclick="window.saveMatchfokus()">Spara mina tips</button>
    </div>`;
  }

  const lb=[...users].filter(u=>matchfokusAllTipsGlobal.some(t=>t.user_id===u.id)).sort((a,b)=>userMatchfokusTotalPts(b.id)-userMatchfokusTotalPts(a.id));
  const lbRows=lb.length?lb.map((u,i)=>{
    const pts=userMatchfokusTotalPts(u.id);
    const isMe=currentUser&&u.id===currentUser.id;
    const medals=["🥇","🥈","🥉"];
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?'background:'+G_GREENL+';border-radius:6px;padding-left:6px;padding-right:6px':''}">
      <span style="width:22px;text-align:center;font-size:13px">${i<3?medals[i]:i+1}</span>
      <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(u.namn)}${isMe?" (du)":""}</span>
      <span style="font-weight:500">${pts} p</span>
    </div>`;
  }).join(""):`<div style="font-size:13px;color:var(--color-text-secondary)">Inga tips inlagda ännu.</div>`;

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:12px">⚽ Matchexperten – Omgång ${cfg.omg}</div>
  ${renderSponsorBanner("matchfokus")}
  ${body}
  <div class="fg-card">
    <div style="font-weight:500;margin-bottom:8px">🏆 Ligatabell – Matchexperten</div>
    ${lbRows}
  </div>
  ${renderPrivateLeagueSection("matchfokus")}`;
}

function renderDuellenMarathonRows(divisionName){
  const relevantDivs=duellenAllDivisions.filter(d=>d.name===divisionName);
  const relevantIds=relevantDivs.map(d=>d.id);
  const relevantFixtures=duellenFixtures.filter(fx=>relevantIds.includes(fx.division_id));
  const standings=duellenStandings(relevantFixtures);
  if(!standings.length) return '<div style="font-size:13px;color:var(--color-text-secondary)">Ingen historik än.</div>';
  return standings.slice(0,15).map((r,i)=>{
    const isMe=r.id===currentUser.id;
    return `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;${isMe?`background:${G_GREENL};border-radius:6px;padding-left:6px`:""}">

      <span style="flex:1">${esc(r.namn)}</span>
      <span style="width:26px;text-align:center;color:var(--color-text-secondary)">${r.played}</span>
      <span style="width:30px;text-align:center;font-weight:700">${r.pts}p</span>
    </div>`;
  }).join("");
}

window.saveInvesterare=async function(available){
  if(blockIfTrialExpired())return;
  const statusEl=document.getElementById("investerare-status");
  const rd=rounds[String(cfg.omg)];
  if(!rd||!rd.matches){ if(statusEl) statusEl.textContent="Inga matcher."; return; }
  const teamIds=[];
  rd.matches.forEach(m=>{ teamIds.push(m.hId,m.aId); });
  const investments=teamIds.map(teamId=>{
    const el=document.querySelector(`[data-act="investerare-amount"][data-team="${teamId}"]`);
    const val=el?Number(el.value)||0:0;
    return {teamId,amount:val};
  }).filter(i=>i.amount>0);
  const total=investments.reduce((s,i)=>s+i.amount,0);
  if(total>available+0.01){
    if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">Du har bara ${available.toFixed(0)} kr tillgängligt – du försöker investera ${total.toFixed(0)} kr.</span>`;
    return;
  }
  if(statusEl) statusEl.textContent="Sparar…";
  try{
    const error=await saveInvesterareRound(cfg.omg,investments);
    if(error){ if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Fel: '+error.message+'</span>'; return; }
    investerareAllTipsGlobal=investerareAllTipsGlobal.filter(t=>!(t.user_id===currentUser.id&&Number(t.round_num)===Number(cfg.omg)));
    investments.forEach(i=>{
      investerareAllTipsGlobal.push({user_id:currentUser.id,round_num:cfg.omg,team_id:i.teamId,amount:i.amount});
    });
    investerareDraft={};
    if(statusEl) statusEl.innerHTML='<span style="color:#1a6b3c;font-weight:500">✓ Investeringar sparade!</span>';
  }catch(e){
    if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Fel: '+e.message+'</span>';
  }
};

  const mySignup=ltsSignups.find(s=>s.user_id===currentUser.id);
  const needsTiebreak=isSignedUp&&mySignup&&(mySignup.tiebreak_guess===null||mySignup.tiebreak_guess===undefined)&&!state.eliminated;
  if(!isSignedUp){
    card=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">Du var inte anmäld när tävlingen startade.</div></div>`;
  } else if(needsTiebreak){
    card=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">🎯 Sista steget innan du gör ditt första val</div>
      <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px">Gissa totalt antal mål som görs under hela tävlingen (omgång ${startRound}–${maxRound}). Används bara som utslag om flera klarar sig hela vägen – då vinner den som gissat närmast.</div>
      <input class="fg-input" id="lts-tiebreak" type="number" min="0" placeholder="t.ex. 90" style="margin-bottom:10px"/>
      <div id="lts-tiebreak-status" style="font-size:13px;text-align:center;min-height:18px;margin-bottom:6px"></div>
      <button class="fg-btn" onclick="window.saveLtsTiebreakClick()">Spara gissning</button>
    </div>`;
  } else if(state.eliminated){
    card=`<div class="fg-card" style="text-align:center">
      <div style="font-size:32px;margin-bottom:4px">💀</div>
      <div style="font-weight:600;font-size:15px;color:#A32D2D">Utslagen efter omgång ${state.eliminatedAtRound}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">Du klarade dig ${state.history.filter(h=>h.result==="safe").length} omgångar.</div>
    </div>`;
  } else if(!inRange){
    card=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">Tävlingen är inte igång för omgång ${cfg.omg} (spelas omgång ${startRound}–${maxRound}).</div></div>`;
  } else if(!rd||!rd.matches||!rd.matches.length){
    card=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">Inga matcher inlagda för omgång ${cfg.omg} än.</div></div>`;
  } else if(alreadyPicked||locked){
    const teamId=alreadyPicked?Number(alreadyPicked.team_id):null;
    const team=teamId?TEAMS.find(t=>t.id===teamId):null;
    card=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">🔒 Omgång ${cfg.omg}</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">${team?`Ditt val: <b style="color:var(--color-text-primary)">${esc(team.name)}</b>`:"Du valde inget lag denna omgång – räknas som en förlust."}</div>
    </div>`;
  } else {
    const usedTeams=state.usedTeams;
    const roundTeamIds=[...new Set(rd.matches.flatMap(m=>[m.hId,m.aId]))];
    const options=roundTeamIds.filter(tid=>!usedTeams.has(tid)).map(tid=>{
      const t=TEAMS.find(x=>x.id===tid);
      return `<option value="${tid}" ${ltsDraftTeam===tid?"selected":""}>${esc(t?t.name:"")}</option>`;
    }).join("");
    card=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:2px">💀 Omgång ${cfg.omg} – välj ett lag</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">Laget måste vinna eller spela oavgjort för att du ska gå vidare. Redan använda lag kan inte väljas igen.</div>
      <select id="lts-team-select" style="width:100%;padding:10px;border-radius:8px;border:0.5px solid var(--color-border-secondary);font-size:14px;margin-bottom:10px;background:var(--color-background-primary);color:var(--color-text-primary)">
        <option value="">Välj lag…</option>
        ${options}
      </select>
      <div id="lts-status" style="font-size:13px;text-align:center;margin-bottom:6px;min-height:18px"></div>
      <button class="fg-btn" onclick="window.saveLts()">Spara mitt val</button>
    </div>`;
  }

  const historyRows=state.history.filter(h=>!h.pending).map(h=>{
    const team=h.teamId?TEAMS.find(t=>t.id===h.teamId):null;
    const ico=h.result==="safe"?"✅":h.result==="loss"?"❌":"⚠️";
    return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0">
      <span>${ico}</span><span style="flex:1">Omgång ${h.round}: ${team?esc(team.name):"Inget val"}</span>
    </div>`;
  }).join("");

  const allStates=ltsSignups.map(s=>{
    const u=users.find(x=>x.id===s.user_id);
    const st=ltsComputeState(s.user_id);
    return {u,s,st,roundsSurvived:st.history.filter(h=>h.result==="safe").length};
  }).filter(x=>x.u);
  allStates.sort((a,b)=>{
    if(a.st.eliminated!==b.st.eliminated) return a.st.eliminated?1:-1;
    if(a.st.lives!==b.st.lives) return b.st.lives-a.st.lives;
    return b.roundsSurvived-a.roundsSurvived;
  });
  const stillAlive=allStates.filter(x=>!x.st.eliminated);
  const totalGoals=ltsTotalGoalsSoFar();
  const medals=["🥇","🥈","🥉"];
  const lbRows=allStates.map((x,i)=>{
    const isMe=x.u.id===currentUser.id;
    const curCap=ltsLifeCap(cfg.omg-startRound+1,ltsConfig.max_rounds||TEAMS.length);
    const lives="❤️".repeat(Math.max(0,x.st.lives))+"🖤".repeat(Math.max(0,curCap-x.st.lives));
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?`background:${G_GREENL};border-radius:6px;padding-left:8px`:''};${x.st.eliminated?'opacity:0.5':''}">
      <span style="width:22px;text-align:center;font-size:13px">${!x.st.eliminated&&i<3?medals[i]:(x.st.eliminated?"💀":i+1)}</span>
      <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(x.u.namn)}${isMe?' (du)':''}</span>
      <span style="font-size:13px">${lives}</span>
    </div>`;
  }).join("");

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:4px">💀 Last Team Standing</div>
  ${renderSponsorBanner("lts")}
  <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:14px">${stillAlive.length} kvar av ${allStates.length} · Omgång ${cfg.omg} (spelas ${startRound}–${maxRound}) · Totalt ${totalGoals} mål gjorda hittills</div>
  ${isSignedUp?`<div class="fg-card" style="text-align:center;padding:12px">
    <div style="font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px">Dina liv</div>
    <div style="font-size:24px;margin:4px 0">${"❤️".repeat(Math.max(0,state.lives))}${"🖤".repeat(Math.max(0,ltsLifeCap(cfg.omg-startRound+1,ltsConfig.max_rounds||TEAMS.length)-state.lives))}</div>
    <div style="font-size:11px;color:var(--color-text-secondary)">Max just nu: ${ltsLifeCap(cfg.omg-startRound+1,ltsConfig.max_rounds||TEAMS.length)} liv${ltsLifeCap(cfg.omg-startRound+1,ltsConfig.max_rounds||TEAMS.length)<3?" (taket sänks ju längre tävlingen pågår)":""}</div>
  </div>`:""}
  ${card}
  ${historyRows?`<div class="fg-card"><div style="font-weight:500;margin-bottom:6px">Din historik</div>${historyRows}</div>`:""}
  <div class="fg-card">
    <div style="font-weight:500;margin-bottom:8px">🏆 Läget just nu</div>
    ${lbRows||'<div style="font-size:13px;color:var(--color-text-secondary)">Ingen anmäld.</div>'}
  </div>
  ${renderPrivateLeagueSection("lts")}`;
}
window.saveLtsTiebreakClick=async function(){

    if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Ange en giltig gissning (0 eller fler).</span>';

};
