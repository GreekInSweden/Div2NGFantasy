function renderPrivateLeagueSection(gameMode){
  const gameModeLabel=modeLabel(gameMode);
  const myLeagues=allPrivateLeagues.filter(l=>(l.game_mode===gameMode||l.game_mode==="alla")&&l.approved&&l.private_league_members&&l.private_league_members.some(m=>m.user_id===currentUser.id));
  const pending=allPrivateLeagues.filter(l=>l.game_mode===gameMode&&!l.approved&&l.created_by===currentUser.id);

  // Get points function for this game mode
  const getPts=(u)=>privateLeagueGetPts(gameMode,u);

  // Standings for selected private league
  let standingsHtml="";
  if(privateLeagueView){
    const pl=allPrivateLeagues.find(l=>l.id===privateLeagueView);
    if(pl&&pl.private_league_members){
      const memberIds=pl.private_league_members.map(m=>m.user_id);
      const snapshot=pl.standings_snapshot||{};
      const memberUsers=users.filter(u=>memberIds.includes(u.id)).sort((a,b)=>getPts(b)-getPts(a));
      const medals=["🥇","🥈","🥉"];
      standingsHtml=`<div class="fg-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-weight:500">${esc(pl.name)}</div>

        </div>
        <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:10px">${pl.game_mode==="alla"?esc(t("privateLeague.allGamesTotal")):esc(t("privateLeague.inviteCode"))} <b style="color:#111;font-weight:800;font-size:14px;letter-spacing:2px">${pl.invite_code}</b> ${esc(t("privateLeague.shareWithFriends"))}</div>
        ${memberUsers.map((u,i)=>{
          const rank=i+1;
          const isMe=u.id===currentUser.id;
          const prevRank=snapshot[u.id];
          const trend=prevRank===undefined?"":rank<prevRank?`<span style="color:#16a34a;font-size:14px">▲</span>`:rank>prevRank?`<span style="color:#c1272d;font-size:14px">▼</span>`:`<span style="color:var(--color-text-secondary);font-size:14px">–</span>`;
          return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?"background:"+G_GREENL+";border-radius:6px;padding-left:6px;padding-right:6px":""}">
            <span style="width:22px;text-align:center">${rank<=3?medals[rank-1]:rank}</span>

function renderMatchfokusTab(){
  const rd=rounds[String(cfg.omg)];
  const m=matchfokusFocusMatch(rd);
  const locked=isRoundLocked(rd);
  const hTeam=m?TEAMS.find(t=>t.id===m.hId):null;
  const aTeam=m?TEAMS.find(t=>t.id===m.aId):null;
  const hName=hTeam?hTeam.name:t("matchfokus.homeTeamFallback"), aName=aTeam?aTeam.name:t("matchfokus.awayTeamFallback");
  const facts=computeMatchfokusFacts(rd);
  const qs=matchfokusQuestions(hName,aName);
  const savedAnswers=matchfokusMyTips[cfg.omg]||{};

  let body="";
  if(!m){
    body=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("matchfokus.notChosenYet",{n:cfg.omg}))}</div></div>`;
  } else if(facts){
    // Publicerat – visa facit + dina svar + poäng
    const tip=matchfokusAllTipsGlobal.find(t=>t.user_id===currentUser.id&&Number(t.round_num)===Number(cfg.omg));
    const myAnswers=tip?tip.answers||{}:{};
    const myPts=calcMatchfokusPts(myAnswers,facts);
    const rows=qs.map(q=>{
      const mine=myAnswers[q.id];
      const correct=facts[q.id];
      const ok=mine!==undefined&&String(mine)===String(correct);
      const label=v=>q.type==="score"?v:(q.opts.find(([val])=>val===v)||[,v])[1];
      return `<div style="padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:3px">${esc(q.label)}</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13px">
          <span>${esc(t("matchfokus.yourAnswer"))} <b>${mine!==undefined?esc(label(mine)):"–"}</b></span>
          <span style="color:var(--color-text-secondary)">${esc(t("matchfokus.correctAnswer"))} <b>${esc(label(correct))}</b></span>
          <span style="margin-left:auto;font-weight:700;color:${ok?'#1a7a3d':'#A32D2D'}">${ok?esc(t("matchfokus.correctPointMark")):esc(t("matchfokus.wrongMark"))}</span>
        </div>
      </div>`;
    }).join("");
    body=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">${esc(t("matchfokus.answerKeyTitle",{h:hName,a:aName}))}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">${esc(t("matchfokus.finalResultLabel",{hg:m.hMål,ag:m.aMål,hth:rd.focus_ht_h??0,hta:rd.focus_ht_a??0}))}</div>
      <div style="font-size:20px;font-weight:700;color:#1a7a3d;margin-bottom:10px">${esc(t("matchfokus.correctCount",{pts:myPts,total:qs.length}))}</div>
      ${rows}
    </div>`;
  } else if(locked){
    body=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">${esc(t("matchfokus.roundLocked"))}</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("matchfokus.lockedNotice",{h:hName,a:aName}))}</div>
    </div>`;
  } else {
    const pillRow=q=>{
      const current=matchfokusDraft[q.id]!==undefined?matchfokusDraft[q.id]:savedAnswers[q.id];
      if(q.type==="score"){
        const cur=(current||"-").split("-");
        return `<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px">
          <input class="fg-input" id="mf-score-h" type="number" min="0" max="20" value="${cur[0]!==undefined&&cur[0]!==""?cur[0]:''}" style="width:56px;text-align:center;padding:6px 4px"/>
          <span style="color:var(--color-text-secondary)">–</span>
          <input class="fg-input" id="mf-score-a" type="number" min="0" max="20" value="${cur[1]!==undefined?cur[1]:''}" style="width:56px;text-align:center;padding:6px 4px"/>
        </div>`;
      }
      return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        ${q.opts.map(([val,lbl])=>`<button data-act="mf-answer" data-qid="${q.id}" data-val="${val}" style="flex:1;min-width:70px;padding:9px 6px;border-radius:8px;border:1.5px solid ${current===val?G_GREEN:'var(--color-border-secondary)'};background:${current===val?G_GREENL:'var(--color-background-primary)'};color:${current===val?G_GREEN:'var(--color-text-primary)'};font-weight:${current===val?600:400};font-size:13px;cursor:pointer">${esc(lbl)}</button>`).join("")}
      </div>`;
    };
    const questionsHtml=qs.map((q,i)=>`<div style="padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
      <div style="font-size:13px;font-weight:500">${i+1}. ${esc(q.label)}</div>
      ${pillRow(q)}
    </div>`).join("");
    body=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:2px">${esc(t("matchfokus.title"))}</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${esc(hName)} vs ${esc(aName)}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">${esc(t("matchfokus.answerAllQuestions"))}</div>
      ${questionsHtml}
      <div id="mf-status" style="font-size:13px;margin-top:10px;min-height:20px"></div>
      <button class="fg-btn" style="margin-top:8px" onclick="window.saveMatchfokus()">${esc(t("matchfokus.saveMyTips"))}</button>
    </div>`;
  }

  const lb=[...users].filter(u=>matchfokusAllTipsGlobal.some(t=>t.user_id===u.id)).sort((a,b)=>userMatchfokusTotalPts(b.id)-userMatchfokusTotalPts(a.id));
  const lbRows=lb.length?lb.map((u,i)=>{

    const isMe=currentUser&&u.id===currentUser.id;
    const medals=["🥇","🥈","🥉"];
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?'background:'+G_GREENL+';border-radius:6px;padding-left:6px;padding-right:6px':''}">
      <span style="width:22px;text-align:center;font-size:13px">${i<3?medals[i]:i+1}</span>
      <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(u.namn)}${isMe?esc(t("tipp.you")):""}</span>
      <span style="font-weight:500">${pts} p</span>
    </div>`;
  }).join(""):`<div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("tipp.noTipsYet"))}</div>`;

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:12px">${esc(t("matchfokus.roundTitle",{n:cfg.omg}))}</div>
  ${renderSponsorBanner("matchfokus")}
  ${body}
  <div class="fg-card">
    <div style="font-weight:500;margin-bottom:8px">${esc(t("matchfokus.leaderboardTitle"))}</div>
    ${lbRows}
  </div>
  ${renderPrivateLeagueSection("matchfokus")}`;
}

function renderDuellenTab(){

  if(duellenConfig.status!=="active"){

      <div style="font-weight:500;margin-bottom:6px">${esc(t("duellen.signupOpen"))}</div>

      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:6px">${esc(t("common.round",{n:cfg.omg}))} · ${isHome?esc(t("common.home")):esc(t("common.away"))}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px">
        <div style="text-align:center;flex:1"><div style="font-weight:500;font-size:14px">${esc(currentUser.namn)}</div>${result?`<div style="font-size:22px;font-weight:700">${isHome?result.homePts:result.awayPts}</div>`:""}</div>

        <div style="text-align:center;flex:1"><div style="font-weight:500;font-size:14px">${esc(oppName)}</div>${result?`<div style="font-size:22px;font-weight:700">${isHome?result.awayPts:result.homePts}</div>`:""}</div>

        ${result?(((isHome?result.homeRes:result.awayRes)===3)?esc(t("duellen.win")):((isHome?result.homeRes:result.awayRes)===1?esc(t("duellen.draw")):esc(t("duellen.loss")))):esc(t("tipp.waitingForResult"))}
      </div>

    <div style="font-weight:500;margin-bottom:8px">${esc(t("duellen.table"))}</div>

function renderDuellenDivisionView(){
  const season=duellenViewSeason||duellenConfig.season_num||1;
  const seasonList=duellenSeasonList();
  const seasonPicker=seasonList.length>1?`<select data-act="duellen-pick-season" style="width:100%;padding:9px 10px;border-radius:8px;border:0.5px solid var(--color-border-secondary);font-size:13px;margin-bottom:8px;background:var(--color-background-primary);color:var(--color-text-primary);font-weight:600">
    ${seasonList.map(s=>`<option value="${s}" ${s===season?"selected":""}>${esc(t("common.season",{season:s}))}${s===(duellenConfig.season_num||1)&&duellenConfig.status==="active"?esc(t("duellen.ongoing")):""}</option>`).join("")}
  </select>`:"";
  const isCurrentSeason=season===(duellenConfig.season_num||1)&&duellenConfig.status==="active";

  const myMembership=duellenDivisionMembers.find(m=>m.user_id===currentUser.id);
  const myDivision=myMembership?duellenDivisions.find(d=>d.id===myMembership.division_id):null;
  const viewDivisionId=duellenViewDivisionId||(myDivision?myDivision.id:(duellenDivisions[0]&&duellenDivisions[0].id));
  const viewDivision=duellenDivisions.find(d=>d.id===viewDivisionId);
  const isMyDivision=myDivision&&viewDivision&&myDivision.id===viewDivision.id;

  if(!viewDivision){
    // Säsong 1 har inga divisioner (fritt seriespel) – visa slutställningen istället för felmeddelande
    if(season===1){
      const s1Fixtures=duellenFixtures.filter(fx=>!fx.division_id && (fx.season_num||1)===1);
      const standings=duellenStandings(s1Fixtures);
      const tableRows=standings.map((r,i)=>{
        const isMe=r.id===currentUser.id;
        return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;${isMe?`background:${G_GREENL};border-radius:6px;padding-left:6px`:""}">

  const n=standings.length;

  let matchCard="";

  }

    if(!isTopTier && i<2) return "up";

    return null;
  };
  const tableRows=standings.map((r,i)=>{
    const isMe=r.id===currentUser.id;
    const zone=isCurrentSeason?zoneFor(i):null;

    return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;${isMe?`background:${G_GREENL};border-radius:6px;padding-left:6px`:""}">

      <span style="width:24px;text-align:center;color:var(--color-text-secondary)">${r.played}</span>
      <span style="width:20px;text-align:center;color:${G_GREEN}">${r.w}</span>
      <span style="width:20px;text-align:center;color:${G_GOLD}">${r.d}</span>
      <span style="width:20px;text-align:center;color:#A32D2D">${r.l}</span>
      <span style="width:28px;text-align:center;font-weight:700">${r.pts}</span>

  const zoneLegend=isCurrentSeason?`<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--color-text-secondary);margin-top:8px">
    ${!isTopTier?`<span>${esc(t("duellen.promotionZone"))}</span>`:""}
    ${viewDivision.tier===4?`<span>${esc(t("duellen.luckyZone"))}</span>`:""}
    ${!isBottomTier?`<span>${esc(t("duellen.relegationZone"))}</span>`:""}
  </div>`:`<div style="font-size:11px;color:var(--color-text-secondary);margin-top:8px">${esc(t("duellen.seasonEndedNotice"))}</div>`;

  const scheduleBtn=`<button class="fg-outbtn" data-act="duellen-toggle-schedule" style="width:100%;margin-top:10px">${duellenShowSchedule?esc(t("duellen.hideSchedule")):esc(t("duellen.showSchedule"))}</button>`;

  let scheduleHtml="";
  if(duellenShowSchedule){
    const roundsMap={};
    divFixtures.forEach(fx=>{ (roundsMap[fx.round_num]=roundsMap[fx.round_num]||[]).push(fx); });

      <div style="font-weight:500;margin-bottom:8px">${esc(t("duellen.scheduleTitle",{division:esc(viewDivision.name)}))}</div>

        const isCur=rn===cfg.omg&&isCurrentSeason;

          <div style="font-size:11px;font-weight:600;color:${isCur?G_GREEN:'var(--color-text-secondary)'};margin-bottom:3px">${esc(t("common.round",{n:rn}))}${isCur?esc(t("duellen.currentRoundSuffix")):""}</div>

            const h=fx.home_is_bot?"Bot":(users.find(u=>u.id===fx.home_user_id)?.namn||"?");

            const res=duellenMatchResult(fx);
            const involves=fx.home_user_id===currentUser.id||fx.away_user_id===currentUser.id;
            return `<div style="display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;${involves?`background:${G_GREENL};border-radius:4px;padding-left:4px`:""}">

              <span style="min-width:44px;text-align:center;font-weight:600">${res?res.homePts+"–"+res.awayPts:"–"}</span>
              <span style="flex:1">${esc(a)}</span>

          }).join("")}
        </div>`;
      }).join("")}
    </div>`;
  }

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:4px">${esc(t("duellen.title"))} – ${esc(t("common.season",{season}))}${isCurrentSeason?"":esc(t("duellen.seasonEnded"))}</div>
  ${renderSponsorBanner("duellen")}
  <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:12px">${esc(viewDivision.name)}${isCurrentSeason?" · "+esc(t("common.round",{n:cfg.omg})):""}</div>
  ${seasonPicker}
  ${divisionPicker}
  ${matchCard}
  <div class="fg-card">
    <div style="font-weight:500;margin-bottom:8px">${isCurrentSeason?esc(t("duellen.table")):esc(t("duellen.finalStandings"))} – ${esc(viewDivision.name)}</div>

    ${renderDuellenMarathonRows(viewDivision.name)}
  </div>
  ${renderPrivateLeagueSection("duellen")}`;
}
function renderDuellenMarathonRows(divisionName){
  const relevantDivs=duellenAllDivisions.filter(d=>d.name===divisionName);
  const relevantIds=relevantDivs.map(d=>d.id);
  const relevantFixtures=duellenFixtures.filter(fx=>relevantIds.includes(fx.division_id));
  const standings=duellenStandings(relevantFixtures);
  if(!standings.length) return `<div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("duellen.noHistoryYet"))}</div>`;
  return standings.slice(0,15).map((r,i)=>{
    const isMe=r.id===currentUser.id;
    return `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;${isMe?`background:${G_GREENL};border-radius:6px;padding-left:6px`:""}">
      <span style="width:20px;text-align:center;color:var(--color-text-secondary)">${i+1}</span>
      <span style="flex:1">${esc(r.namn)}</span>
      <span style="width:26px;text-align:center;color:var(--color-text-secondary)">${r.played}</span>
      <span style="width:30px;text-align:center;font-weight:700">${r.pts}p</span>
    </div>`;
  }).join("");
}

window.saveInvesterare=async function(available){
  if(blockIfTrialExpired())return;
  const statusEl=document.getElementById("investerare-status");
  const rd=rounds[String(cfg.omg)];
  if(!rd||!rd.matches){ if(statusEl) statusEl.textContent=t("investerare.noMatchesShort"); return; }
  const teamIds=[];
  rd.matches.forEach(m=>{ teamIds.push(m.hId,m.aId); });
  const investments=teamIds.map(teamId=>{
    const el=document.querySelector(`[data-act="investerare-amount"][data-team="${teamId}"]`);
    const val=el?Number(el.value)||0:0;
    return {teamId,amount:val};
  }).filter(i=>i.amount>0);
  const total=investments.reduce((s,i)=>s+i.amount,0);
  if(total>available+0.01){
    if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("investerare.notEnoughAvailable",{available:available.toFixed(0),total:total.toFixed(0)}))}</span>`;
    return;
  }
  if(statusEl) statusEl.textContent=t("investerare.saving");
  try{
    const error=await saveInvesterareRound(cfg.omg,investments);
    if(error){ if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("investerare.errorPrefix"))}${esc(error.message)}</span>`; return; }
    investerareAllTipsGlobal=investerareAllTipsGlobal.filter(t=>!(t.user_id===currentUser.id&&Number(t.round_num)===Number(cfg.omg)));
    investments.forEach(i=>{
      investerareAllTipsGlobal.push({user_id:currentUser.id,round_num:cfg.omg,team_id:i.teamId,amount:i.amount});
    });
    investerareDraft={};
    if(statusEl) statusEl.innerHTML=`<span style="color:#1a6b3c;font-weight:500">${esc(t("investerare.savedSuccess"))}</span>`;
  }catch(e){
    if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("investerare.errorPrefix"))}${esc(e.message)}</span>`;
  }
};

  const inRange=cfg.omg>=startRound&&cfg.omg<=maxRound;
  const rd=rounds[String(cfg.omg)];
  const alreadyPicked=ltsAllPicksGlobal.find(p=>p.user_id===currentUser.id&&Number(p.round_num)===cfg.omg);
  const locked=isRoundLocked(rd);

  let card;
  const mySignup=ltsSignups.find(s=>s.user_id===currentUser.id);
  const needsTiebreak=isSignedUp&&mySignup&&(mySignup.tiebreak_guess===null||mySignup.tiebreak_guess===undefined)&&!state.eliminated;
  if(!isSignedUp){
    card=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("lts.notSignedUpMsg"))}</div></div>`;
  } else if(needsTiebreak){
    card=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">${esc(t("lts.tiebreakTitle"))}</div>
      <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px">${esc(t("lts.tiebreakDesc",{start:startRound,max:maxRound}))}</div>
      <input class="fg-input" id="lts-tiebreak" type="number" min="0" placeholder="${esc(t("lts.tiebreakPlaceholder"))}" style="margin-bottom:10px"/>
      <div id="lts-tiebreak-status" style="font-size:13px;text-align:center;min-height:18px;margin-bottom:6px"></div>
      <button class="fg-btn" onclick="window.saveLtsTiebreakClick()">${esc(t("lts.saveGuess"))}</button>
    </div>`;
  } else if(state.eliminated){
    card=`<div class="fg-card" style="text-align:center">
      <div style="font-size:32px;margin-bottom:4px">💀</div>
      <div style="font-weight:600;font-size:15px;color:#A32D2D">${esc(t("lts.eliminatedAfterRound",{n:state.eliminatedAtRound}))}</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">${esc(t("lts.survivedRounds",{n:state.history.filter(h=>h.result==="safe").length}))}</div>
    </div>`;
  } else if(!inRange){
    card=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("lts.notActiveForRound",{n:cfg.omg,start:startRound,max:maxRound}))}</div></div>`;
  } else if(!rd||!rd.matches||!rd.matches.length){
    card=`<div class="fg-card"><div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("lts.noMatches",{n:cfg.omg}))}</div></div>`;
  } else if(alreadyPicked||locked){
    const teamId=alreadyPicked?Number(alreadyPicked.team_id):null;
    const team=teamId?TEAMS.find(t=>t.id===teamId):null;
    card=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:4px">${esc(t("lts.roundLocked",{n:cfg.omg}))}</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">${team?`${esc(t("lts.yourChoice"))} <b style="color:var(--color-text-primary)">${esc(team.name)}</b>`:esc(t("lts.noChoiceMade"))}</div>
    </div>`;
  } else {
    const usedTeams=state.usedTeams;
    const roundTeamIds=[...new Set(rd.matches.flatMap(m=>[m.hId,m.aId]))];
    const options=roundTeamIds.filter(tid=>!usedTeams.has(tid)).map(tid=>{
      const t=TEAMS.find(x=>x.id===tid);
      return `<option value="${tid}" ${ltsDraftTeam===tid?"selected":""}>${esc(t?t.name:"")}</option>`;
    }).join("");
    card=`<div class="fg-card">
      <div style="font-weight:500;margin-bottom:2px">${esc(t("lts.chooseTeamTitle",{n:cfg.omg}))}</div>

      </select>

      <button class="fg-btn" onclick="window.saveLts()">${esc(t("lts.saveMyChoice"))}</button>
    </div>`;
  }

  const historyRows=state.history.filter(h=>!h.pending).map(h=>{
    const team=h.teamId?TEAMS.find(t=>t.id===h.teamId):null;
    const ico=h.result==="safe"?"✅":h.result==="loss"?"❌":"⚠️";

    </div>`;
  }).join("");

  const allStates=ltsSignups.map(s=>{
    const u=users.find(x=>x.id===s.user_id);
    const st=ltsComputeState(s.user_id);
    return {u,s,st,roundsSurvived:st.history.filter(h=>h.result==="safe").length};
  }).filter(x=>x.u);
  allStates.sort((a,b)=>{
    if(a.st.eliminated!==b.st.eliminated) return a.st.eliminated?1:-1;
    if(a.st.lives!==b.st.lives) return b.st.lives-a.st.lives;
    return b.roundsSurvived-a.roundsSurvived;
  });
  const stillAlive=allStates.filter(x=>!x.st.eliminated);

    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?`background:${G_GREENL};border-radius:6px;padding-left:8px`:''};${x.st.eliminated?'opacity:0.5':''}">
      <span style="width:22px;text-align:center;font-size:13px">${!x.st.eliminated&&i<3?medals[i]:(x.st.eliminated?"💀":i+1)}</span>
      <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(x.u.namn)}${isMe?esc(t("tipp.you")):''}</span>

  }).join("");

  return `

  </div>

window.saveAnytime=async function(){
  if(blockIfTrialExpired())return;
  const statusEl=document.getElementById("anytime-status");
  const picks={DEF:[],MID:[],FW:[]};
  let missing=0;
  document.querySelectorAll('select[data-pos]').forEach(sel=>{
    const pos=sel.dataset.pos, slot=Number(sel.dataset.slot);
    const val=sel.value?sel.value:null;
    if(!val) missing++;
    picks[pos][slot]=val;
  });
  if(missing>0){
    if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("anytime.fillAllSlots"))}</span>`;
    return;
  }
  const allIds=[...picks.DEF,...picks.MID,...picks.FW];
  if(new Set(allIds).size!==allIds.length){
    if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("anytime.samePlayerTwice"))}</span>`;
    return;
  }
  if(statusEl) statusEl.textContent=t("investerare.saving");
  try{
    const error=await saveAnytimeTip(cfg.omg,picks);
    if(error){ if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("investerare.errorPrefix"))}${esc(error.message)}</span>`; return; }
    anytimeMyTips={...anytimeMyTips,[cfg.omg]:picks};
    const idx=anytimeAllTipsGlobal.findIndex(t=>t.user_id===currentUser.id&&Number(t.round_num)===Number(cfg.omg));
    const row={user_id:currentUser.id,round_num:cfg.omg,picks};
    if(idx>=0) anytimeAllTipsGlobal[idx]=row; else anytimeAllTipsGlobal=[...anytimeAllTipsGlobal,row];
    anytimeDraft={...picks};
    if(statusEl) statusEl.innerHTML=`<span style="color:#1a6b3c;font-weight:500">${esc(t("anytime.choicesSaved"))}</span>`;
  }catch(e){
    if(statusEl) statusEl.innerHTML=`<span style="color:#A32D2D">${esc(t("investerare.errorPrefix"))}${esc(e.message)}</span>`;
  }
};
function renderQuizTab(){
  const rnd=cfg.omg;
  const qs=quizQuestions.filter(q=>q.round_num===rnd); // bara denna omgångs frågor
  const answers=quizMyAnswers;
  const answeredAll=qs.length>0&&qs.every(q=>answers[q.id]);
  const timeLeft=qs.length>0?getQuizTimeLeft(rnd):300;
  const timedOut=timeLeft<=0;
  const done=answeredAll||timedOut;
  const pts=calcQuizPts(qs,answers);
  const allAnswers=window._quizAllAnswers||[];
  const allQs=quizQuestions;

  // Start timer if quiz is open and not done
  if(qs.length>0&&!done){
    startQuizTimer(rnd);
  } else {
    stopQuizTimer();
  }

  if(!qs.length) return `
    <div style="font-weight:500;font-size:16px;margin-bottom:12px">🧠 ${esc(currentLeague.name)} Quiz</div>
    <div class="fg-card" style="text-align:center;padding:30px 16px">
      <div style="font-size:40px;margin-bottom:12px">🧠</div>
      <div style="font-weight:500;margin-bottom:8px">${esc(t("quiz.noQuestionsThisRound"))}</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("quiz.adminAddsQuestions"))}</div>
    </div>`;

  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const timerColor=timeLeft<=30?"#c1272d":timeLeft<=60?"#e65100":"var(--color-text-primary)";

  const questionCards=qs.map((q,i)=>{
    const myAns=answers[q.id];
    const locked=!!myAns||done;
    const isCorrect=myAns===q.correct;

    const altBtn=(val,label)=>{
      const chosen=myAns===val;
      const correct=done&&q.correct===val;
      const wrong=done&&chosen&&!isCorrect&&val===myAns;
      let bg="var(--color-background-secondary)";
      let border="var(--color-border-secondary)";
      let col="var(--color-text-primary)";
      if(correct){bg="#e8f5ee";border="#1a6b3c";col="#1a6b3c";}
      else if(wrong){bg="#fce8e8";border="#c1272d";col="#c1272d";}
      else if(chosen&&!done){bg=G_GREENL;border=G_GREEN;col=G_GREEN;}
      return `<button data-act="quiz-answer" data-qid="${q.id}" data-ans="${val}" data-rnd="${rnd}" ${locked?"disabled":""} style="flex:1;padding:10px 6px;border-radius:8px;border:1.5px solid ${border};background:${bg};color:${col};font-size:13px;font-weight:500;cursor:${locked?"default":"pointer"};transition:.15s">
        <div style="font-weight:700;font-size:11px;margin-bottom:2px">${val}</div>
        <div style="font-size:12px">${esc(label)}</div>
      </button>`;
    };

    const statusBadge=myAns?(isCorrect?`<span style="color:#1a6b3c;font-size:12px;font-weight:500">${esc(t("quiz.correctPoint"))}</span>`:`<span style="color:#c1272d;font-size:12px;font-weight:500">${esc(t("quiz.wrongAnswer",{correct:q.correct}))}</span>`):(done?`<span style="color:var(--color-text-secondary);font-size:12px">${esc(t("quiz.notAnswered"))}</span>`:"");

    return `<div class="fg-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div style="font-size:11px;color:var(--color-text-secondary)">${esc(t("quiz.questionOf",{i:i+1,total:qs.length}))}</div>
        ${statusBadge}
      </div>
      <div style="font-size:15px;font-weight:500;margin-bottom:14px;line-height:1.4">${esc(q.question)}</div>
      <div style="display:flex;gap:8px">
        ${altBtn("1",q.alt1)}
        ${altBtn("X",q.altx)}
        ${altBtn("2",q.alt2)}
      </div>
    </div>`;
  }).join("");

  // Topplista
  const medals=["🥇","🥈","🥉"];
  const quizSorted=[...users].filter(u=>allAnswers.some(a=>a.user_id===u.id)).sort((a,b)=>userQuizTotalPts(b.id,allAnswers,allQs)-userQuizTotalPts(a.id,allAnswers,allQs));
  const quizLeaderboard=`<div class="fg-card">
    <div style="font-weight:500;margin-bottom:10px">${esc(t("quiz.leaderboardTitle",{league:esc(currentLeague.name)}))}</div>
    ${quizSorted.map((u,i)=>{
      const p=userQuizTotalPts(u.id,allAnswers,allQs);
      const isMe=u.id===currentUser.id;
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);${isMe?"background:"+G_GREENL+";border-radius:6px;padding-left:6px;padding-right:6px":""}">
        <span style="width:22px;text-align:center">${i<3?medals[i]:i+1}</span>
        <span style="flex:1;font-size:14px;font-weight:${isMe?500:400}">${esc(u.namn)}${isMe?esc(t("tipp.you")):""}</span>
        <span style="font-weight:500">${p} p</span>
      </div>`;
    }).join("")}
  </div>`;

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:4px">${esc(t("quiz.roundTitle",{league:esc(currentLeague.name),n:rnd}))}</div>
  ${renderSponsorBanner("quiz")}
  ${!qs.length?`<div class="fg-card" style="text-align:center;padding:24px"><div style="font-size:36px;margin-bottom:8px">🧠</div><div style="font-weight:500">${esc(t("quiz.noQuestionsThisRound"))}</div></div>`:""}
  ${qs.length&&!done?`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:10px;padding:10px 16px;margin-bottom:12px">
    <div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("quiz.timeLeft"))}</div>
    <div id="quiz-timer" style="font-size:28px;font-weight:700;font-family:monospace;color:${timeLeft<=30?"#c1272d":timeLeft<=60?"#e65100":"var(--color-text-primary)"}">${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,"0")}</div>
    <div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("quiz.answeredCount",{answered:Object.keys(answers).length,total:qs.length}))}</div>
  </div>`:""}
  ${qs.length&&done?`<div class="fg-card" style="text-align:center;background:${pts===qs.length?"#e8f5ee":"var(--color-background-primary)"}">
    <div style="font-size:36px;margin-bottom:6px">${pts===qs.length?"🏆":pts>=3?"🎯":"📚"}</div>
    <div style="font-size:22px;font-weight:700;color:${G_GREEN}">${esc(t("quiz.correctCount",{pts,total:qs.length}))}</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-top:4px">${timedOut&&!answeredAll?esc(t("quiz.timeUp")):esc(t("quiz.quizDone"))}</div>
  </div>`:""}
  ${questionCards}
  ${quizLeaderboard}
  ${renderPrivateLeagueSection("quiz")}`;
}

function renderStreakTab(){
  const rd=rounds[String(cfg.omg)];
  const matches=rd?.matches||[];
  const locked=rd?.locked||false;
  const published=rd?.results_published||false;
  const myTip=streakMyTips.find(t=>t.round_num===cfg.omg);
  const publishedRounds=Object.keys(rounds).filter(r=>rounds[r].results_published).map(Number);
  const {current,best}=calcUserStreak(streakAllTips,currentUser.id,publishedRounds);

  // Streak-status
  const streakBar=`<div class="fg-card" style="display:flex;gap:0;padding:0;overflow:hidden">
    <div style="flex:1;padding:14px;text-align:center;border-right:0.5px solid var(--color-border-tertiary)">
      <div style="font-size:28px;font-weight:700;color:#e65100">${current}🔥</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">${esc(t("streak.activeStreak"))}</div>
    </div>
    <div style="flex:1;padding:14px;text-align:center">
      <div style="font-size:28px;font-weight:700;color:${G_GREEN}">${best}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">${esc(t("streak.bestStreak"))}</div>
    </div>
  </div>`;

  // Visa resultatet om publicerat
  if(published&&myTip){
    const picks=myTip.picks||{};
    const picksHtml=Object.entries(picks).map(([mIdx,sign])=>{
      const m=matches[Number(mIdx)];
      if(!m)return"";
      const h=TEAMS.find(t=>t.id===m.hId),a=TEAMS.find(t=>t.id===m.aId);
      const hg=rd.goals?.[m.id]?.h??m.hMål;const ag=rd.goals?.[m.id]?.a??m.aMål;
      const actual=hg>ag?"1":hg<ag?"2":"X";
      const correct=sign===actual;
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <span style="font-size:18px">${correct?"✅":"❌"}</span>
        <div style="flex:1;font-size:13px">${esc(h?.name||"")} – ${esc(a?.name||"")}</div>
        <span style="font-weight:500">${sign}</span>
        <span style="font-size:12px;color:var(--color-text-secondary)">(${actual})</span>
      </div>`;
    }).join("");
    return `${streakBar}
    <div class="fg-card">
      <div style="font-weight:500;margin-bottom:8px">${esc(t("streak.roundTip",{n:cfg.omg}))}</div>
      ${picksHtml}
      <div style="padding-top:8px;font-weight:600;color:${myTip.correct?G_GREEN:"#c1272d"}">
        ${myTip.correct?esc(t("streak.allCorrectContinues")):esc(t("streak.streakReset"))}
      </div>
    </div>
    ${renderPrivateLeagueSection("streak")}`;
  }

  // Välj matcher
  if(myTip&&!published&&!streakEditing){
    const picks=myTip.picks||{};
    const picksHtml=Object.entries(picks).map(([mIdx,sign])=>{
      const m=matches[Number(mIdx)];
      const h=TEAMS.find(t=>t.id===m?.hId),a=TEAMS.find(t=>t.id===m?.aId);
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px">
        <div style="flex:1">${esc(h?.name||"")} – ${esc(a?.name||"")}</div>
        <span style="font-weight:600;background:#1a1a1a;color:#fff;border-radius:4px;padding:2px 8px">${sign}</span>
      </div>`}).join("");
    return `${streakBar}
    <div class="fg-card" style="background:${S_GREENL};border:1px solid ${S_GREEN}">
      <div style="font-weight:500;margin-bottom:8px;color:${S_GREEN}">${esc(t("streak.tipSubmitted",{n:cfg.omg}))}</div>
      ${picksHtml}
      ${!locked?`<button data-act="streak-edit" style="margin-top:12px;background:none;border:0.5px solid ${S_GREEN};color:${S_GREEN};border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;width:100%">${esc(t("streak.editMyTip"))}</button>`:""}
    </div>
    ${renderPrivateLeagueSection("streak")}`;
  }

  if(locked&&!myTip){
    return `${streakBar}
    <div class="fg-card" style="text-align:center;padding:24px">
      <div style="font-size:32px;margin-bottom:8px">🔒</div>
      <div style="font-weight:500">${esc(t("streak.predictionsClosed"))}</div>
      <div style="font-size:13px;color:var(--color-text-secondary);margin-top:4px">${esc(t("streak.streakResetsIfNoTip"))}</div>
    </div>`;
  }

  if(!matches.length){
    return `${streakBar}
    <div class="fg-card" style="text-align:center;padding:24px">
      <div style="font-size:32px">📅</div>
      <div style="font-weight:500;margin-top:8px">${esc(t("streak.noMatchesYet",{n:cfg.omg}))}</div>
      <div style="font-size:11px;color:#999;margin:8px 0;font-family:monospace">
        cfg.omg=${cfg.omg} · rounds=${Object.keys(rounds).join(",")} · rd=${rd?esc(t("streak.debugExists")):esc(t("streak.debugMissing"))}
      </div>
      <button data-act="streak-reload" style="background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px">${esc(t("streak.reloadMatches"))}</button>
    </div>`;
  }

  // Väljargränssnittet
  const draft=streakDraft;
  const selected=Object.keys(draft).length;
  const matchCards=matches.map((m,i)=>{
    const h=TEAMS.find(t=>t.id===m.hId),a=TEAMS.find(t=>t.id===m.aId);
    const picked=draft[i]!==undefined;
    const signs=["1","X","2"];
    return `<div class="fg-card" style="margin-bottom:8px;border:${picked?`1.5px solid ${G_GREEN}`:"0.5px solid var(--color-border-tertiary)"}">
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;text-align:center">${esc(h?.name||"")} – ${esc(a?.name||"")}</div>
      <div style="display:flex;gap:6px">
        ${signs.map(s=>`<button data-act="streak-pick" data-idx="${i}" data-sign="${s}"
          style="flex:1;padding:8px;border-radius:6px;border:1.5px solid ${draft[i]===s?G_GREEN:"var(--color-border-secondary)"};
          background:${draft[i]===s?G_GREENL:"var(--color-background-primary)"};
          color:${draft[i]===s?G_GREEN:"var(--color-text-secondary)"};
          font-weight:${draft[i]===s?700:400};cursor:pointer;font-size:14px">${s}</button>`).join("")}
      </div>
    </div>`;
  }).join("");

  return `${streakBar}
  <div style="font-weight:500;font-size:15px;margin-bottom:4px">${esc(t("streak.title",{n:cfg.omg}))}</div>
  <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:12px">${t("streak.description")}</div>
  ${matchCards}
  <button class="fg-btn" data-act="submit-streak" ${selected<3?"disabled":""} style="margin-top:4px;${selected<3?"opacity:0.5":""}">
    ${selected<3?esc(t(3-selected===1?"streak.chooseMoreMatchesSingular":"streak.chooseMoreMatchesPlural",{n:3-selected})):esc(t("streak.submitTip"))}
  </button>`;
}

function renderStatistikTab(){
  const u=currentUser;
  const lockedRounds=Object.keys(rounds).filter(r=>rounds[r].results_published).map(Number).sort((a,b)=>a-b);
  const season="2027"; // kan utökas framöver

  // Quiz-statistik
  const allQsForStats=quizQuestions; // redan laddade om quiz-läget besökts
  const allAnswersForStats=window._quizAllAnswers||[];
  const myQuizAnswers=allAnswersForStats.filter(a=>a.user_id===u.id);
  const quizTotal=userQuizTotalPts(u.id,allAnswersForStats,allQsForStats);
  const quizRoundPts=lockedRounds.map(r=>userQuizRoundPts(u.id,r,allAnswersForStats,allQsForStats));
  const quizBest=quizRoundPts.length?Math.max(...quizRoundPts):0;
  const quizBestRnd=lockedRounds[quizRoundPts.indexOf(quizBest)];
  const quizAvg=lockedRounds.length?(quizTotal/lockedRounds.length).toFixed(1):0;

  // ── Per spelform ──────────────────────────────────────────────────────────
  const fantasyPts=lockedRounds.map(r=>userRoundPts(u,r));
  const fantasyTotal=fantasyPts.reduce((s,p)=>s+p,0);
  const fantasyBest=lockedRounds.length?Math.max(...fantasyPts):0;
  const fantasyBestRnd=lockedRounds[fantasyPts.indexOf(fantasyBest)];
  const fantasyAvg=lockedRounds.length?(fantasyTotal/lockedRounds.length).toFixed(1):0;
  const fantasyRank=[...users].sort((a,b)=>userTotPts(b)-userTotPts(a)).findIndex(x=>x.id===u.id)+1;

  const tippPts=lockedRounds.map(r=>userTipRoundPts(u,r));
  const tippTotal=tippPts.reduce((s,p)=>s+p,0);
  const tippBest=lockedRounds.length?Math.max(...tippPts):0;
  const tippBestRnd=lockedRounds[tippPts.indexOf(tippBest)];
  const tippRank=[...users].sort((a,b)=>userTipTotalPts(b)-userTipTotalPts(a)).findIndex(x=>x.id===u.id)+1;

  const snabbPts=lockedRounds.map(r=>userSnabbastRoundPts(u.id,r));
  const snabbTotal=snabbPts.reduce((s,p)=>s+p,0);
  const snabbBest=lockedRounds.length?Math.max(...snabbPts):0;
  const snabbRank=[...users].sort((a,b)=>userSnabbastTotalPts(b.id)-userSnabbastTotalPts(a.id)).findIndex(x=>x.id===u.id)+1;

  const malPts=lockedRounds.map(r=>userMåljaktenRoundPts(u.id,r));
  const malTotal=malPts.reduce((s,p)=>s+p,0);

function getTeamForRound(u,r){
  const rd=rounds[String(r)];
  const snapshot=rd&&rd.picks_snapshot&&rd.picks_snapshot[u.id];
  return {
    picks: snapshot?snapshot.picks:u.picks,
    kapten: snapshot?snapshot.kapten:u.kapten
  };
}
function renderTeamPitchView(u,r){
  const rd=rounds[String(r)];
  const {picks,kapten}=getTeamForRound(u,r);
  const rankAll=[...users].sort((a,b)=>userTotPts(b)-userTotPts(a));
  const rank=rankAll.findIndex(x=>x.id===u.id)+1;
  const roundPts=userRoundPts(u,r);
  const resultsShown=rd&&rd.results_published;
  const allRoundKeys=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const minR=allRoundKeys.length?allRoundKeys[0]:1, maxR=allRoundKeys.length?allRoundKeys[allRoundKeys.length-1]:1;

  const posRow=(pos)=>{
    const ids=(picks&&picks[pos])||[];

        const team=TEAMS.find(t=>t.id===pl.teamId);
        return `<div style="width:108px;text-align:center">
          <div style="background:#fff;border-radius:9px;padding:10px 6px;box-shadow:0 1px 4px rgba(0,0,0,0.25);position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center">

        </div>`;
      }).join("")}
    </div>`;
  };

  const hasTeam = picks && ((picks.GK||[]).length+(picks.DEF||[]).length+(picks.MID||[]).length+(picks.FW||[]).length)>0;

  const pitchHtml = `
    <div style="background:linear-gradient(180deg,#2d7a3e,#1e5c2c);border-radius:14px;padding:28px 14px 18px;position:relative;overflow:hidden">
      <div style="position:absolute;inset:12px;border:1.5px solid rgba(255,255,255,0.25);border-radius:8px;pointer-events:none"></div>
      <div style="position:absolute;left:50%;top:12px;bottom:12px;width:1px;background:rgba(255,255,255,0.15);pointer-events:none"></div>

        ${posRow("MID")}
        ${posRow("DEF")}
        ${posRow("GK")}
      </div>
    </div>`;

  return `

    <button data-act="team-view-round" data-dir="-1" ${r<=minR?"disabled":""} style="border:0.5px solid var(--color-border-secondary);background:none;border-radius:6px;width:32px;height:32px;cursor:pointer;opacity:${r<=minR?0.3:1}">‹</button>
    <div style="text-align:center">
      <div style="font-weight:500;font-size:14px">${esc(t("common.round",{n:r}))}</div>

  </div>
  ${hasTeam?pitchHtml:`<div class="fg-card" style="text-align:center;padding:2rem;font-size:13px;color:var(--color-text-secondary)">${esc(t("pitchView.noTeamChosen"))}</div>`}

function renderOmgTab(){
  const keys=Object.keys(rounds).map(Number).sort((a,b)=>a-b);

  // Grid – samma stil som admin men med användarinfo
  const gridBtns=Array.from({length:cfg.totalRounds||26},(_,i)=>i+1).map(n=>{
    const rd=rounds[String(n)];
    const isActive=openRounds.has(n);

    // Kolla om användaren tippar på denna omgång
    const hasTipp = currentUser && currentUser.tips && currentUser.tips[String(n)] && currentUser.tips[String(n)].length>0;
    const hasSnabbast = snabbastMyTips && snabbastMyTips[n] && snabbastMyTips[n].length>0;
    const hasMåljakten = måljaktenMyTips && måljaktenMyTips[n] && måljaktenMyTips[n].length>0;
    const hasAnyTip = hasTipp||hasSnabbast||hasMåljakten;

    let bg,col,border;
    if(!rd){
      bg="var(--color-background-secondary)"; col="var(--color-text-secondary)"; border="transparent";
    } else if(rd.results_published){
      bg=S_AMBERL; col=S_AMBER; border=S_AMBER;
    } else if(isRoundLocked(rd)){
      bg="#fce8e8"; col="#c1272d"; border="#c1272d";
    } else {
      bg=hasAnyTip?"#fff3e0":"var(--color-background-primary)";
      col=hasAnyTip?"#e65100":"var(--color-text-secondary)";
      border=isActive?"#1a1a1a":(hasAnyTip?"#e65100":"var(--color-border-secondary)");
    }

    return `<button data-act="toggle-round" data-r="${n}" style="aspect-ratio:1;border-radius:8px;border:1.5px solid ${border};background:${bg};color:${col};font-size:13px;font-weight:${isActive?700:500};cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center">
      ${n}
      ${hasAnyTip&&!rd?.results_published?`<span style="position:absolute;top:2px;right:3px;font-size:7px;color:#e65100">✓</span>`:""}
    </button>`;
  }).join("");

  // Förklaring
  const legend=`<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:10px">
    <span style="color:${S_GREEN}">${esc(t("omg.legendResultsReady"))}</span>
    <span style="color:#c1272d">${esc(t("omg.legendClosed"))}</span>
    <span style="color:#e65100">${esc(t("omg.legendTipMade"))}</span>
    <span style="color:var(--color-text-secondary)">${esc(t("omg.legendNotEntered"))}</span>
  </div>`;

  // Detaljvy per öppen omgång
  const details=keys.filter(r=>openRounds.has(r)).map(r=>{
    const rd=rounds[String(r)];
    const matchRows=(rd.matches||[]).map(m=>{
      const h=TEAMS.find(t=>t.id===m.hId),a=TEAMS.find(t=>t.id===m.aId);
      return `<div style="display:flex;gap:6px;padding:6px 0;font-size:13px;border-bottom:0.5px solid var(--color-border-tertiary)">
        <span style="flex:1;text-align:right">${esc(h?h.name:"")}</span>
        <span style="background:var(--color-background-secondary);border-radius:4px;padding:2px 8px;font-weight:500;min-width:44px;text-align:center">${rd.results_published?m.hMål+"–"+m.aMål:"vs"}</span>
        <span style="flex:1">${esc(a?a.name:"")}</span>
      </div>`;
    }).join("");

    const ptsRows=rd.results_published?[...users].sort((a,b)=>userRoundPts(b,r)-userRoundPts(a,r)).map(u=>{
      const pts=userRoundPts(u,r);
      const isMe=u.id===currentUser.id;
      return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;${isMe?"font-weight:500":""}">
        <span>${esc(u.namn)}${isMe?esc(t("tipp.you")):""}</span><span>${pts} p</span>
      </div>`;
    }).join(""):"";

    return `<div class="fg-card" style="margin-top:10px">
      <div style="font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between">
        <span>${esc(t("common.round",{n:r}))}</span>
        ${rd.results_published?`<span style="font-size:12px;color:${S_AMBER}">${esc(t("omg.resultsReady"))}</span>`:isRoundLocked(rd)?`<span style="font-size:12px;color:#c1272d">${esc(t("omg.closed"))}</span>`:`<span style="font-size:12px;color:${S_GREEN}">${esc(t("omg.open"))}</span>`}
      </div>
      ${matchRows||`<div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("omg.matchesNotEntered"))}</div>`}
      ${rd.results_published?`<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--color-border-tertiary)">
        <div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px">${esc(t("omg.fantasyPointsLabel"))}</div>${ptsRows}
      </div>`:""}
    </div>`;
  }).join("");

  if(!keys.length) return `
    <div style="font-weight:500;font-size:16px;margin-bottom:12px">${esc(t("omg.title"))}</div>
    <div class="fg-card" style="text-align:center;color:var(--color-text-secondary);font-size:13px">${esc(t("omg.noRoundsYet"))}</div>`;

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:12px">${esc(t("omg.title"))}</div>
  <div class="fg-card">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${gridBtns}</div>
    ${legend}
  </div>
  ${details}`;
}

function adminDefaultRound(){
  // Hitta första öppna (ej låsta) omgången, annars senaste inlagda
  const keys=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const firstOpen=keys.find(r=>!rounds[String(r)].locked);
  if(firstOpen) return String(firstOpen);
  if(keys.length) return String(keys[keys.length-1]);
  return String(cfg.omg);
}

function defaultBulkRows(rndKey){
  const existing = rounds[rndKey];
  if(existing && existing.matches.length){
    return existing.matches.map(m=>({hId:m.hId,aId:m.aId,hMål:m.hMål,aMål:m.aMål}));
  }
  const rows=[];
  for(let i=0;i<TEAMS.length;i+=2){
    if(TEAMS[i+1]) rows.push({hId:TEAMS[i].id,aId:TEAMS[i+1].id,hMål:0,aMål:0});
  }
  return rows;
}

      const cutoff=aktivitetPeriod==="today"?new Date(now).setHours(0,0,0,0):now.getTime()-periodMs;
      const sessionsInPeriod=todaySessions.filter(s=>new Date(s.session_start).getTime()>=cutoff);

      const visitsInPeriod=todayModeVisits.filter(v=>sessionIdsInPeriod.has(v.session_id));

    curRD.matches.forEach(m=>{teamsInRound.add(m.hId);teamsInRound.add(m.aId);});

    // Alla spelare, sorterade: spelare med mål > 0 först, sedan lag som spelar, sen resten

// Tolkar en inklistrad spelarlista på ett av två format:
//
// A) Strukturerat, en spelare per rad: "Namn;Position;Lag" (semikolon, komma eller
//    tab som avgränsare – funkar även klistrat direkt från Excel/Sheets).
//
// B) "Rörig" webblista – t.ex. kopierad rakt av från en klubbs spelartrupp-sida,
//    där varje spelare ligger på flera separata rader (namn, ev. tröjnummer,
//    ev. nationalitet, ålder) och grupperas under rubriker som "Målvakter",
//    "Försvarare" osv. Detta format saknar helt lag-info (hela listan är ju en
//    och samma klubb) – lag väljs istället en gång för alla i granskningsvyn.
//
// Appen avgör automatiskt vilket format det är: hittas semikolon/tab i texten
// tolkas den som (A), annars som (B).
// Tolkar en inklistrad laglista till bara lagnamnen – klarar både en ren lista
// (ett lagnamn per rad) och en hel tabell klistrad från en webbsida med
// rangordning och statistik-kolumner, t.ex.:
//   1.	Arsenal	0	0	0	0	0-0	0
//   2.	Aston Villa	0	0	0	0	0-0	0
// Om raderna innehåller tabbar plockas det första fältet som innehåller minst
// en bokstav (dvs varken rangordningssiffran eller poäng/resultat-kolumnerna).
// Utan tabbar tas hela raden, med en eventuell ledande rangordningssiffra
// ("1.", "1)", "1 ") bortstädad.
function parseTeamNamesText(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const linkPattern=/^\[(.+?)\]\(.*\)$/;
  if(lines.some(l=>linkPattern.test(l))){
    return lines.filter(l=>linkPattern.test(l)).map(l=>l.match(linkPattern)[1].trim()).filter(Boolean);
  }
  const hasTabs=lines.some(l=>l.includes("\t"));
  let result;
  if(hasTabs){
    result=lines.map(line=>{
      const fields=line.split("\t").map(f=>f.trim());
      const nameField=fields.find(f=>/[A-Za-zÀ-ÖØ-öø-ÿÅÄÖåäö]/.test(f));
      return nameField||fields[0]||"";
    }).filter(Boolean);
  } else {
    result=lines.map(line=>line.replace(/^\d+[.)]?\s+/,"").trim()).filter(Boolean);
  }
  // Om allt klistrades in på en enda rad separerat med komma/semikolon, dela upp det
  if(result.length===1&&/[,;]/.test(result[0])){
    result=result[0].split(/[,;]/).map(s=>s.trim()).filter(s=>s.length>0);
  }
  return result;
}
// Säkerhetsnät som körs EFTER vilken underparser som helst (strukturerad,
// block, bullet-länk eller kort-format) – städar bort skräp som läckt
// igenom (landskoder, etiketter typ "Birth date", rena siffror, kända
// nationaliteter) och slår ihop namn-fragment ("Manuel"/"Neuer") med den
// fullständiga formen ("Manuel Neuer") om den dyker upp inom några rader
// på samma position. Detta fångar dubblett-/fragmentproblem även om
// formatdetekteringen skulle välja fel underparser för en okänd sajts
// struktur (t.ex. om texten saknar markdown-länkar helt och faller igenom
// till den enklaste block-parsern).
function isJunkPlayerName(namn){
  const n=(namn||"").trim();
  if(!n)return true;
  if(/^\d+$/.test(n))return true; // rent tröjnummer
  if(/^[a-zA-ZÀ-ÿ]{2}$/.test(n))return true; // tvåbokstavs-landskod, t.ex. "de"
  const norm=n.toLowerCase();
  if(["birth date","country","appearances","goal","goals","height","weight","preferred foot","market value","position"].includes(norm))return true;
  if(isNationalityText(n))return true;
  return false;
}
function coalesceNameFragments(rows){
  const cleaned=rows.filter(r=>!isJunkPlayerName(r.namn));
  const normNoSpace=s=>s.replace(/\s+/g,"").toLowerCase();
  const drop=new Array(cleaned.length).fill(false);
  for(let i=0;i<cleaned.length;i++){
    if(drop[i])continue;
    for(let j=i+1;j<Math.min(i+4,cleaned.length);j++){
      if(drop[j])continue;
      if(cleaned[j].pos!==cleaned[i].pos)continue;
      const ni=normNoSpace(cleaned[i].namn), nj=normNoSpace(cleaned[j].namn);
      if(ni===nj){ drop[j]=true; continue; } // exakt dubblett
      if(nj.includes(ni)&&nj.length>ni.length){ drop[i]=true; break; } // i är ett fragment av j (j är fylligare)
      if(ni.includes(nj)&&ni.length>nj.length){ drop[j]=true; } // j är ett fragment av i
    }
  }
  return cleaned.filter((_,idx)=>!drop[idx]);
}
// Tolkar "tabell-format" som fotmob.com – varje spelare är uppdelad i flera
// rader (troligen från en HTML-tabell där varje cell blir en egen rad vid
// kopiering): NAMN, ev. en skaderad-beskrivning ("Sträckning baksida lår -
// Mitten av augusti 2026"), POSITIONSKOD(ER) (svenska förkortningar som
// "MV"/"MB, VM"/"DM, AM, M, HY", eller helt utstavat "Målvakt"/"Mittfältare"
// för spelare med bara en position), LAND, och till sist tröjnummer/ålder/
// längd/övergångsvärde tabbseparerat på en rad. Vi använder positionsraden
// som ankare och letar namnet bakåt – hoppar över en ev. skaderad-rad genom
// att känna igen att den innehåller " - " (mellanslag-bindestreck-mellanslag,
// vanligt i skadebeskrivningar, ovanligt i spelarnamn). Tränare ("Tränare"
// som position) matchar inget känt positionsord och utesluts därför
// automatiskt utan särskild specialhantering.
const POSITION_CODE_MAP={mv:"GK",mb:"DEF",vb:"DEF",hb:"DEF",dm:"MID",m:"MID",am:"MID",vm:"MID",hm:"MID",vy:"FW",hy:"FW",a:"FW"};
const POSITION_WORD_MAP={"målvakt":"GK","försvarare":"DEF","mittfältare":"MID","anfallare":"FW"};
function isPositionTableLine(line){
  const c=line.trim();
  if(!c)return false;
  if(POSITION_WORD_MAP[c.toLowerCase()])return true;
  const codes=c.split(",").map(s=>s.trim().toLowerCase());
  return codes.length>0&&codes.every(code=>POSITION_CODE_MAP[code]);
}
function mapPositionTableLine(line){
  const c=line.trim().toLowerCase();
  if(POSITION_WORD_MAP[c])return POSITION_WORD_MAP[c];
  const codes=c.split(",").map(s=>s.trim());
  return POSITION_CODE_MAP[codes[0]]||null; // första koden = huvudposition
}
function parsePlayersTableFormat(lines){
  const headerJunk=new Set(["översikt","tabell","matcher","trupp","spelarstatistik","lagstatistik","övergångar","historik","nyheter","spelare","position","land","tröja","ålder","längd","övergångsvärde"]);
  const out=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line||headerJunk.has(line.toLowerCase()))continue;
    if(!isPositionTableLine(line))continue; // vi utgår ifrån positionsraden
    const pos=mapPositionTableLine(line);
    if(!pos)continue; // t.ex. "Tränare" – utesluts automatiskt
    let j=i-1;
    while(j>=0&&(!lines[j].trim()||headerJunk.has(lines[j].trim().toLowerCase())))j--;
    if(j<0)continue;
    let nameLine=lines[j].trim();
    if(nameLine.includes(" - ")){ // skaderad-beskrivning – gå ytterligare en rad bakåt
      j--;
      while(j>=0&&!lines[j].trim())j--;
      if(j<0)continue;
      nameLine=lines[j].trim();
    }
    if(!nameLine||isPositionTableLine(nameLine))continue; // säkerhetskoll
    out.push({namn:nameLine,pos,posMatched:true,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false});
  }
  return out;
}
// Tolkar Transfermarkt-format – varje spelare inleds med NAMNET UPPREPAT
// TVÅ GÅNGER, tabbseparerat, på samma rad ("Josep Martínez\tJosep Martínez"),
// följt av en egen positionsrad med fullt utskriven position på engelska
// ("Goalkeeper","Centre-Back","Defensive Midfield","Central Midfield",
// "Attacking Midfield","Left/Right Midfield","Centre-Forward","Left/Right
// Winger","Second Striker"). Resten (ålder, nationalitet – ibland på TVÅ
// rader vid dubbelt medborgarskap, kontraktsdatum, marknadsvärde,
// tröjnummer, ev. utlåningsklubb) hoppas över automatiskt eftersom vi bara
// letar efter nästa namn-dubblett-rad som nästa ankare, utan att behöva
// känna till exakt hur många brus-rader som ligger emellan. Samma
// positionsvokabulär används genomgående på hela transfermarkt.com, oavsett
// liga, så denna parser bör funka för fler ligor än bara Serie A.
const TM_POSITION_MAP={
  goalkeeper:"GK",
  "centre-back":"DEF","center-back":"DEF","left-back":"DEF","right-back":"DEF","sweeper":"DEF",
  "defensive midfield":"MID","central midfield":"MID","right midfield":"MID","left midfield":"MID","attacking midfield":"MID",
  "left winger":"FW","right winger":"FW","centre-forward":"FW","center-forward":"FW","second striker":"FW"
};
// Separatorn mellan de dubblerade namnen kan vara antingen en tabb ELLER
// flera mellanslag i rad – beroende på webbläsare/OS vid kopiering ger
// tabellceller olika whitespace. Vi splittar på båda för säkerhets skull.
const TM_NAME_SPLIT=/\t+|\s{2,}/;
function isTransfermarktNameLine(line){
  const parts=line.split(TM_NAME_SPLIT).map(p=>p.trim()).filter(p=>p.length>0);
  return parts.length===2&&parts[0]===parts[1]&&parts[0].length>0;
}
function parsePlayersTransfermarktFormat(lines){
  const out=[];
  let i=0;
  while(i<lines.length){
    if(isTransfermarktNameLine(lines[i])){
      const namn=lines[i].split(TM_NAME_SPLIT).map(p=>p.trim()).filter(Boolean)[0];
      let j=i+1;
      while(j<lines.length&&!lines[j].trim())j++;
      const posLine=j<lines.length?lines[j].trim().toLowerCase():"";
      const pos=TM_POSITION_MAP[posLine];
      if(pos)out.push({namn,pos,posMatched:true,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false});
      i=j+1; // fortsätt efter positionsraden – bruset fram till nästa namn-dubblett hoppas över automatiskt
    } else {
      i++;
    }
  }
  return out;
}
function parsePlayersImportText(text){
  const normalizeStr=s=>s.toLowerCase().replace(/\s+/g," ").trim();
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const bulletLinkPattern=/^[*-]?\s*\[(.+?)\]\(.*\)$/;
  // Transfermarkt-format: varje spelare inleds med NAMNET UPPREPAT TVÅ GÅNGER,
  // tabbseparerat, på en och samma rad ("Josep Martínez\tJosep Martínez") –
  // ett mycket distinkt ankare. Kollas FÖRST eftersom både tabbtecknet (som
  // annars ger hasDelimiters) och positionsordförrådet (som delvis
  // överlappar med kort-formatets engelska positionsord, t.ex.
  // "Centre-Back"/"Centre-Forward") annars riskerar att styra om det till fel
  // parser.
  const tmNameLineCount=lines.filter(l=>isTransfermarktNameLine(l)).length;
  const hasTransfermarktFormat=tmNameLineCount>2;
  // Kort-format (t.ex. slgr.gr): varje SPELARE har sin egen positionsrad
  // ("GOALKEEPER"/"DEFENDER" osv – antingen som ren text direkt under namnet,
  // eller inbäddad i en länk), till skillnad från bundesliga.com-formatet där
  // samma positionsord istället är en RUBRIK som gäller för en hel grupp
  // spelare. Vi räknar hur många gånger ett positionsord förekommer – få
  // gånger (≤6) tyder på gruppdrubriker, många gånger (>6) tyder på att
  // varje spelare har sin egen positionsrad.
  const posWordPattern=/^(goalkeeper|goalkeepers|keeper|defender|defenders|centre-back|center-back|centre back|center back|right-back|left-back|right back|left back|wing-back|wingback|sweeper|full-back|fullback|full back|midfielder|midfielders|central midfielder|centre midfielder|center midfielder|defensive midfielder|attacking midfielder|left midfielder|right midfielder|holding midfielder|forward|forwards|striker|strikers|centre-forward|center-forward|centre forward|center forward|winger|left winger|right winger|attacker)$/i;
  const positionWordCount=lines.filter(l=>{
    const m=l.match(bulletLinkPattern);

  }).length;

  // / POSITIONSKOD(ER) / LAND / tröjnummer-ålder-längd-värde (tabbseparerat på
  // en rad). Positionerna anges som svenska koder ("MV","MB","AM","A" osv,
  // ibland flera kommaseparerade) eller stavas ut i sin helhet för spelare med
  // bara en position ("Målvakt","Mittfältare"...). Måste kollas FÖRE
  // hasDelimiters, annars kapas den bara av tabbtecknen i sifferraden och
  // hamnar fel i det generella strukturerade formatet.
  const positionTableLineCount=lines.filter(l=>isPositionTableLine(l)).length;
  const hasPositionTableFormat=positionTableLineCount>3;
  const hasBulletLinks=lines.some(l=>bulletLinkPattern.test(l));
  const hasDelimiters=lines.some(l=>l.includes(";")||l.includes("\t"));

  console.warn("🔍 IMPORT-DEBUG v3 – rader:",lines.length,"tmNameLineCount:",tmNameLineCount,"positionWordCount:",positionWordCount,"positionTableLineCount:",positionTableLineCount,"hasTransfermarktFormat:",hasTransfermarktFormat,"hasPositionCards:",hasPositionCards,"hasPositionTableFormat:",hasPositionTableFormat,"hasBulletLinks:",hasBulletLinks,"hasDelimiters:",hasDelimiters,"→ VALD PARSER:",chosenParser);
  lines.slice(0,6).forEach((l,i)=>console.warn(`  rad ${i}:`,JSON.stringify(l)));
  const rawRowsPre = hasTransfermarktFormat ? parsePlayersTransfermarktFormat(lines)
    : hasPositionCards ? parsePlayersCardFormat(lines)
    : hasPositionTableFormat ? parsePlayersTableFormat(lines)
    : hasBulletLinks ? parsePlayersBulletLinkFormat(lines)
    : hasDelimiters ? parsePlayersStructuredFormat(lines)
    : parsePlayersBlockFormat(lines);
  console.warn("🔍 IMPORT-DEBUG v3 → rader från",chosenParser+":",rawRowsPre.length,rawRowsPre.slice(0,10).map(r=>r.namn));
  // Säkerhetsnät oavsett vilken underparser som användes: städa bort skräp
  // (landskoder, etiketter typ "Birth date", rena siffror, kända
  // nationaliteter) och slå ihop namn-fragment ("Manuel"/"Neuer") med den
  // fullständiga formen ("Manuel Neuer") om den dyker upp i närheten på
  // samma position. Fångar dubblett-/fragmentproblem även om detekteringen
  // ovan skulle välja fel underparser för en okänd sajts format.
  const rawRows=coalesceNameFragments(rawRowsPre);
  console.warn("🔍 IMPORT-DEBUG v3 → rader EFTER städning/hopslagning:",rawRows.length,rawRows.slice(0,10).map(r=>r.namn));
  const seenInBatch=new Set();
  return rawRows.map(r=>{
    const key=normalizeStr(r.namn);
    const dupInBatch=seenInBatch.has(key);
    seenInBatch.add(key);
    const dupExisting=players.some(p=>normalizeStr(p.namn)===key);

  });
