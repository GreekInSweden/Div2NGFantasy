// SHA-256 hashing via Web Crypto API (inbyggt i alla moderna webbläsare)
async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Hasha PIN med user-id som salt (unikt per användare) – jämförs sedan server-side via RPC
async function hashPin(pin,userId){ return sha256(pin+"|"+userId); }

}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=window.atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

window.saveTips = async function(){
  if(blockIfTrialExpired())return;
  const statusEl = document.getElementById("tipp-status");
  if(statusEl) statusEl.textContent = "Sparar…";
  try {
    const rd = rounds[String(userSelectedRound||cfg.omg)];
    if(!rd || !rd.matches.length){ if(statusEl) statusEl.textContent="Inga matcher att tippa på."; return; }
    const savedTips=(currentUser.tips&&currentUser.tips[String(userSelectedRound||cfg.omg)])||[];
    const savedBoostMatch=savedTips.find(t=>t.boost);
    const boostKey=tipDraft._boost!==undefined?tipDraft._boost:(savedBoostMatch?savedBoostMatch.hId+"-"+savedBoostMatch.aId:null);
    if(!boostKey){
      if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">⚡ Välj en boost-match innan du sparar – klicka blixten bredvid en av matcherna.</span>';
      return;
    }
    const tipsArr = rd.matches.map(m => {
      const hEl = document.querySelector('[data-hid="'+m.hId+'"][data-aid="'+m.aId+'"][data-side="h"]');
      const aEl = document.querySelector('[data-hid="'+m.hId+'"][data-aid="'+m.aId+'"][data-side="a"]');
      const key=m.hId+"-"+m.aId;
      return { hId:m.hId, aId:m.aId, predH: hEl?Number(hEl.value)||0:0, predA: aEl?Number(aEl.value)||0:0, boost: key===boostKey };
    });
    const allTips = Object.assign({}, currentUser.tips || {});
    allTips[String(userSelectedRound||cfg.omg)] = tipsArr;
    const { error } = await sb.from("fantasy_users").update({ tips: allTips }).eq("id", currentUser.id);
    if(error){
      if(statusEl) statusEl.innerHTML = '<span style="color:#A32D2D">Fel: '+error.message+'</span>';
      return;
    }
    currentUser = Object.assign({}, currentUser, { tips: allTips });
    users = users.map(u => u.id === currentUser.id ? Object.assign({}, u, { tips: allTips }) : u);
    tipDraft._boost=undefined;
    if(statusEl) statusEl.innerHTML = '<span style="color:#1a6b3c;font-weight:500">✓ Tips sparade! ⚡ Boost på vald match.</span>';
  } catch(e){
    if(statusEl) statusEl.innerHTML = '<span style="color:#A32D2D">JS-fel: '+e.message+'</span>';
  }
};

// Föreslår nästa säsongsetikett utifrån den nuvarande. Klarar både rena årtal
// ("2027" -> "2028") och delade säsonger ("2026/27" eller "2026/2027" -> "2027/28"/"2027/2028").
// Känns formatet inte igen returneras nuvarande etikett oförändrad, så admin kan redigera manuellt.
function suggestNextSeasonLabel(current){
  const s=String(current??"").trim();
  let m=s.match(/^(\d{4})\s*\/\s*(\d{2}|\d{4})$/);
  if(m){
    const y1=Number(m[1])+1;
    const shortForm=m[2].length===2;
    const y2=shortForm?String((y1+1)%100).padStart(2,"0"):String(y1+1);
    return `${y1}/${y2}`;
  }
  m=s.match(/^(\d{4})$/);
  if(m) return String(Number(m[1])+1);
  return s;
}
// Säker sorteringsnyckel för säsongsetiketter som kan vara fri text (t.ex. "2026/27") –

// Provperioden räknas nu GLOBALT (via det delade Väg A-kontot) i antal DAGAR
// sedan personens allra första registrering, oavsett vilken serie – inte per
// serie längre, så man kan inte längre "förnya" provperioden genom att gå med
// i en ny serie. Saknas trialStartedAt (t.ex. inget delat konto ännu, eller
// spelaren registrerades innan den här funktionen fanns) är de undantagna.
function isTrialExpired(user){
  if(!cfg.trialEnabled) return false;

async function toggleRoundLock(rnd,locked){
  const cur=rounds[rnd]||{matches:[],goals:{},locked:false,picks_snapshot:{},results_published:false};
  const locked_at=locked?new Date().toISOString():null;
  const picks_snapshot=locked
    ? users.reduce((acc,u)=>{acc[u.id]={picks:u.picks,kapten:u.kapten,activeChip:u.activeChip||null,chipMeta:u.chipMeta||null};return acc;},{})
    : (cur.picks_snapshot||{});
  const {error}=await sb.from("rounds").upsert({round_num:Number(rnd),matches:cur.matches||[],goals:cur.goals||{},locked,locked_at,snabbast_result:cur.snabbast_result||[],picks_snapshot,results_published:cur.results_published||false,league_id:currentLeague.id});
  if(error)console.error(error);
  // Om omgången precis låstes: förbruka chippet för alla som hade ett aktivt.
  // "Fritt lag"-chippet återställer dessutom laget till hur det såg ut innan
  // chippet aktiverades – helt automatiskt, oavsett vad som pillats med däremellan.
  if(locked){
    // ── Fantasy-byten ──────────────────────────────────────────────────────
    // Räknar hur många spelare varje användare bytt ut sedan sin senaste
    // sparade baseline (laget de gick in i den här omgången med), och
    // uppdaterar antalet sparade byten inför NÄSTA omgång: förbrukade byten
    // dras av, +1 för omgången som gick, max 5 sparade totalt. Spelare med
    // Fritt lag-chippet aktivt undantas helt (chippet upphäver byte-gränsen
    // för just den omgången, och deras lag återställs ändå direkt efter).
    for(const u of users){
      if(u.activeChip==="frittlag") continue;
      if(u.transferBaselinePicks){
        const oldIds=new Set(POSITIONS.flatMap(pos=>(u.transferBaselinePicks[pos]||[])));
        const newIds=new Set(POSITIONS.flatMap(pos=>(u.picks[pos]||[])));
        const usedTransfers=[...oldIds].filter(id=>!newIds.has(id)).length;
        const currentBanked=u.freeTransfers==null?1:u.freeTransfers;
        const newBanked=Math.min(5,Math.max(0,currentBanked-usedTransfers)+1);
        try{ await sb.from("fantasy_users").update({free_transfers:newBanked}).eq("id",u.id); }catch(e){console.error("Kunde inte uppdatera byten för",u.namn,e);}
      }
    }
    const usersWithChip=users.filter(u=>u.activeChip);
    for(const u of usersWithChip){
      const newChipsUsed=[...(u.chipsUsed||[]),u.activeChip];
      const updateFields={active_chip:null,chip_meta:null,chip_pre_snapshot:null,chips_used:newChipsUsed};
      if(u.activeChip==="frittlag"&&u.chipPreSnapshot){
        updateFields.picks=u.chipPreSnapshot.picks;
        updateFields.kapten=u.chipPreSnapshot.kapten;
      }
      try{
        await sb.from("fantasy_users").update(updateFields).eq("id",u.id);
      }catch(e){console.error("Kunde inte förbruka chip för",u.namn,e);}
    }
    // Uppdatera alla användares baseline till deras lag som det ser ut just nu
    // (efter ev. chip-återställning ovan) – det här blir jämförelsepunkten
    // för byten under NÄSTA omgång.
    try{
      const freshUsers=(usersWithChip.length)?await fetchUsers():users;
      for(const u of freshUsers){
        try{ await sb.from("fantasy_users").update({transfer_baseline_picks:u.picks}).eq("id",u.id); }catch(e){console.error("Kunde inte uppdatera baseline för",u.namn,e);}
      }
      users=await fetchUsers();
      if(currentUser){ currentUser=users.find(x=>x.id===currentUser.id)||currentUser; }
    }catch(e){console.error(e);}
  }
  return {locked_at,picks_snapshot};
}

// Poäng för en given omgång: varje rangordnad startande spelare får sina
// vanliga Fantasy-poäng (samma plPts-motor) × platsmultiplikatorn för sin
// rangordning. Bänkade spelare (inte med i ranked_ids) ger 0.
function calcRankFantasyRoundPts(userId,roundNum){
  const rd=rounds[String(roundNum)];
  if(!rd||!rd.results_published) return 0;
  const tip=rankFantasyAllTipsGlobal.find(t=>t.user_id===userId&&Number(t.round_num)===Number(roundNum));
  if(!tip||!tip.ranked_ids||!tip.ranked_ids.length) return 0;
  let tot=0;
  tip.ranked_ids.forEach((pid,i)=>{
    const pl=players.find(p=>p.id===pid);
    if(!pl) return;
    const pts=plPts(pl,rd);
    tot+=pts*rankFantasyMultiplier(i+1);
  });
  return Math.round(tot*10)/10;
}
function userRankFantasyTotalPts(userId){
  return Object.keys(rounds).reduce((s,r)=>s+calcRankFantasyRoundPts(userId,Number(r)),0);
}

function calcMåljaktenTeamPts(teamId,rd){
  if(!rd||!rd.matches)return{pts:0,goals:0,isHome:null};
  const m=rd.matches.find(m=>Number(m.hId)===Number(teamId)||Number(m.aId)===Number(teamId));
  if(!m)return{pts:0,goals:0,isHome:null};
  const isHome=Number(m.hId)===Number(teamId);
  const goals=isHome?Number(m.hMål||0):Number(m.aMål||0);
  const pts=goals*(isHome?2:3)+(goals>=3?5:0);
  return{pts,goals,isHome};
}
function userMåljaktenRoundPts(userId,roundNum){
  const rd=rounds[String(roundNum)];
  if(!rd||!rd.results_published)return 0;
  const tip=måljaktenAllTipsGlobal.find(t=>t.user_id===userId&&Number(t.round_num)===Number(roundNum));
  if(!tip)return 0;
  return (tip.picks||[]).reduce((s,teamId)=>s+calcMåljaktenTeamPts(teamId,rd).pts,0);
}
function userMåljaktenTotalPts(userId){
  return Object.keys(rounds).reduce((s,r)=>s+userMåljaktenRoundPts(userId,Number(r)),0);
}

async function distributeQuizQuestions(totalRounds=26){
  // Hämta alla frågor i banken (round_num = null)
  const bank=await fetchQuizBank();
  if(!bank.length)return{error:{message:"Inga frågor i banken."},distributed:0};
  // Blanda slumpmässigt
  const shuffled=[...bank].sort(()=>Math.random()-0.5);
  let distributed=0;
  for(let round=1;round<=totalRounds;round++){
    const slice=shuffled.slice((round-1)*5,round*5);
    if(!slice.length)break;
    for(const q of slice){
      await sb.from("quiz_questions").update({round_num:round}).eq("id",q.id);
      distributed++;
    }
  }
  return{error:null,distributed};
}

// Timer – sparas i localStorage så det håller vid sidladdning
function quizTimerKey(roundNum){ return `quiz_start_${currentLeague.id}_${roundNum}_${currentUser.id}`; }
function getQuizTimeLeft(roundNum){
  const s=localStorage.getItem(quizTimerKey(roundNum));
  if(!s)return 300;
  return Math.max(0,300-Math.floor((Date.now()-parseInt(s))/1000));
}
function startQuizTimer(roundNum){
  if(!localStorage.getItem(quizTimerKey(roundNum))){
    localStorage.setItem(quizTimerKey(roundNum),Date.now().toString());
  }
  if(quizTimerInterval)clearInterval(quizTimerInterval);
  quizTimerInterval=setInterval(()=>{
    const left=getQuizTimeLeft(roundNum);
    const el=document.getElementById("quiz-timer");
    if(el){
      const m=Math.floor(left/60),s=left%60;
      el.textContent=`${m}:${s.toString().padStart(2,"0")}`;
      el.style.color=left<=30?"#c1272d":left<=60?"#e65100":"var(--color-text-primary)";
    }
    if(left<=0){ clearInterval(quizTimerInterval); render(); }
  },1000);
}
function stopQuizTimer(){ if(quizTimerInterval){clearInterval(quizTimerInterval);quizTimerInterval=null;} }

function calcUserStreak(allTips,userId,publishedRounds){
  const myTips=allTips.filter(t=>t.user_id===userId).sort((a,b)=>a.round_num-b.round_num);
  const roundsSorted=[...publishedRounds].sort((a,b)=>a-b);
  let current=0,best=0,streak=0;
  for(const r of roundsSorted){
    const tip=myTips.find(t=>t.round_num===r);
    if(tip?.correct===true){streak++;best=Math.max(best,streak);}
    else{streak=0;}
  }
  current=streak;
  return{current,best};
}

async function autoCloseStaleTickets(tickets){
  const WEEK_MS=7*24*60*60*1000;
  const now=Date.now();
  const staleIds=tickets.filter(t=>
    t.status!=="closed" &&
    t.last_sender==="admin" &&
    (now-new Date(t.updated_at).getTime())>WEEK_MS
  ).map(t=>t.id);
  if(!staleIds.length) return tickets;
  try{

// Gemensam poängväljare för privata ligor – används både här och i spelarvyn,
// så att alla 14 spelformer stöds konsekvent på ett och samma ställe.
function privateLeagueGetPts(gm,u){
  if(gm==="fantasy")return userTotPts(u);
  if(gm==="tipp")return userTipTotalPts(u);
  if(gm==="snabbast")return userSnabbastTotalPts(u.id);
  if(gm==="måljakten")return userMåljaktenTotalPts(u.id);
  if(gm==="ligatipp")return userLigatippTotalPts(allLeagueTips.find(t=>t.user_id===u.id)||{});
  if(gm==="quiz")return userQuizTotalPts(u.id,window._quizAllAnswers||[],quizQuestions);
  if(gm==="streak"){
    const pubRounds=Object.keys(rounds).map(Number).filter(r=>rounds[String(r)].results_published);
    return calcUserStreak(streakAllTips,u.id,pubRounds).best;
  }
  if(gm==="matchfokus")return userMatchfokusTotalPts(u.id);
  if(gm==="duellen")return duellenStandings(duellenFixtures).find(r=>r.id===u.id)?.pts||0;
  if(gm==="malregn")return userMalregnTotalPts(u.id);
  if(gm==="jubel")return userJubelTotalPts(u.id);
  if(gm==="investerare")return Math.round(investerareCurrentBalance(u.id));
  if(gm==="lts")return userLtsRoundsSurvived(u.id);
  if(gm==="anytime")return userAnytimeTotalPts(u.id);
  if(gm==="alla")return userTotPts(u)+userTipTotalPts(u)+userSnabbastTotalPts(u.id)+userMåljaktenTotalPts(u.id);
  return 0;
}

  const modesInUse=new Set(allPrivateLeagues.filter(pl=>pl.approved).map(pl=>pl.game_mode));

  }catch(e){console.error("updatePrivateLeagueSnapshots preload error:",e);}
  for(const pl of allPrivateLeagues){

async function pingPresence(force){
  if(!currentUser||!currentLeague) return;
  if(document.visibilityState!=="visible"){
    logPresenceDebug("skipped_hidden",{force,visibilityState:document.visibilityState});
    return;
  }
  const now=Date.now();
  if(!force && now-lastPresencePingAt<15000) return; // spärr: max var 15:e sekund vid aktivitet
  lastPresencePingAt=now;
  try{
    if(!presenceSessionId){
      presenceSessionId=currentUser.id+"-"+Date.now();
      const {error}=await sb.from("user_sessions").insert({id:presenceSessionId,user_id:currentUser.id,league_id:currentLeague.id,session_start:new Date().toISOString(),last_seen:new Date().toISOString()});

    } else {

// Slår ihop user_sessions med presence_pings så att last_seen blir korrekt
// (den gamla UPDATE-baserade last_seen litar vi inte längre på).
function mergeSessionsWithPings(sessions,pings){
  const maxPingBySession={};
  pings.forEach(p=>{
    const t=new Date(p.ts).getTime();
    if(!maxPingBySession[p.session_id]||t>maxPingBySession[p.session_id]) maxPingBySession[p.session_id]=t;
  });
  return sessions.map(s=>{
    const startMs=new Date(s.session_start).getTime();
    const oldLastSeenMs=new Date(s.last_seen).getTime();
    const pingMs=maxPingBySession[s.id];
    const bestMs=Math.max(startMs,oldLastSeenMs,pingMs||0);
    return {...s,last_seen:new Date(bestMs).toISOString()};
  });
}

// Räknar fram en spelares liv/utslagning live, omgång för omgång.
// Gränserna är proportionella mot totala antalet omgångar (ungefär 36%/36%/28%,
// samma fördelning som ursprungligen designades för en 14-lagsserie), så känslan
// blir densamma oavsett om serien har 14, 20 eller något annat antal lag.
function ltsLifeCap(compRound,totalRounds){
  const total=totalRounds||14;
  const cutoff1=Math.round(total*(5/14));
  const cutoff2=Math.round(total*(10/14));
  if(compRound<=cutoff1) return 3;
  if(compRound<=cutoff2) return 2;
  return 1;
}
function ltsComputeState(userId){
  const startRound=ltsConfig.start_round;
  if(!startRound) return {lives:3,eliminated:false,eliminatedAtRound:null,usedTeams:new Set(),history:[]};
  let rawLives=3, lives=3, eliminated=false, eliminatedAtRound=null;
  const usedTeams=new Set();
  const maxRound=startRound+(ltsConfig.max_rounds||TEAMS.length)-1;
  const roundKeys=Object.keys(rounds).map(Number).sort((a,b)=>a-b).filter(r=>r>=startRound&&r<=maxRound);
  const history=[];
  for(const r of roundKeys){
    if(eliminated) break;
    const compRound=r-startRound+1;
    const cap=ltsLifeCap(compRound,ltsConfig.max_rounds||TEAMS.length);
    const rd=rounds[String(r)];
    const pick=ltsAllPicksGlobal.find(p=>p.user_id===userId&&Number(p.round_num)===r);
    if(!rd||!rd.results_published){
      lives=Math.min(rawLives,cap);
      history.push({round:r,teamId:pick?Number(pick.team_id):null,pending:true,cap});
      break;
    }
    if(!pick){
      rawLives--;
      lives=Math.min(rawLives,cap);
      history.push({round:r,teamId:null,result:"no-pick",livesAfter:lives,cap});
      if(lives<=0){eliminated=true;eliminatedAtRound=r;}
      continue;
    }
    const teamId=Number(pick.team_id);
    const m=rd.matches.find(x=>x.hId===teamId||x.aId===teamId);
    if(!m){ lives=Math.min(rawLives,cap); history.push({round:r,teamId,result:"no-match",cap}); continue; }
    const isHome=m.hId===teamId;
    const gf=isHome?m.hMål:m.aMål, ga=isHome?m.aMål:m.hMål;
    const survived=gf>=ga;
    usedTeams.add(teamId);
    if(!survived) rawLives--;
    lives=Math.min(rawLives,cap);
    history.push({round:r,teamId,result:survived?"safe":"loss",livesAfter:lives,cap});
    if(lives<=0){eliminated=true;eliminatedAtRound=r;}
  }
  return {lives,eliminated,eliminatedAtRound,usedTeams,history};
}
function ltsTotalGoalsSoFar(){
  const startRound=ltsConfig.start_round;
  if(!startRound) return 0;
  const maxRound=startRound+(ltsConfig.max_rounds||TEAMS.length)-1;
  let total=0;
  Object.keys(rounds).map(Number).filter(r=>r>=startRound&&r<=maxRound).forEach(r=>{

const INVESTERARE_START=1000;
function investerareTeamPct(teamId,m){
  const isHome=m.hId===teamId;
  const gf=isHome?m.hMål:m.aMål, ga=isHome?m.aMål:m.hMål;
  let pct=0;
  if(gf>ga) pct+=10; else if(gf===ga) pct+=2; else pct-=8;
  if(ga===0) pct+=2;
  if(gf>3) pct+=3;
  if(gf>ga && (gf-ga)>=3) pct+=3;
  return pct;
}

// Räknar fram en spelares portfölj-historik omgång för omgång (körs live, inget sparas mellanvägen)
function investerareComputeState(userId,uptoRound){
  let balance=INVESTERARE_START;
  const history=[];
  const roundKeys=Object.keys(rounds).map(Number).sort((a,b)=>a-b).filter(r=>r<=uptoRound);
  for(const r of roundKeys){
    const rd=rounds[String(r)];
    const invs=investerareAllTipsGlobal.filter(t=>t.user_id===userId&&Number(t.round_num)===r);
    const totalInvested=invs.reduce((s,i)=>s+Number(i.amount),0);
    const uninvested=Math.max(0,balance-totalInvested);
    if(!rd||!rd.results_published){
      history.push({round:r,balanceStart:balance,invested:totalInvested,uninvested,pending:true,details:invs.map(i=>({teamId:Number(i.team_id),amount:Number(i.amount)})),balanceEnd:balance});
      break;
    }
    let balanceEnd=uninvested;
    const details=invs.map(inv=>{
      const teamId=Number(inv.team_id);
      const m=rd.matches.find(x=>x.hId===teamId||x.aId===teamId);
      if(!m){ balanceEnd+=Number(inv.amount); return {teamId,amount:Number(inv.amount),pct:0,newAmount:Number(inv.amount)}; }
      const pct=investerareTeamPct(teamId,m);
      const newAmount=Number(inv.amount)*(1+pct/100);
      balanceEnd+=newAmount;
      return {teamId,amount:Number(inv.amount),pct,newAmount};
    });
    history.push({round:r,balanceStart:balance,invested:totalInvested,uninvested,details,balanceEnd,pending:false});
    balance=balanceEnd;
  }
  return {balance,history};
}
function investerareCurrentBalance(userId){
  const maxRound=Math.max(0,...Object.keys(rounds).map(Number));
  return investerareComputeState(userId,maxRound).balance;
}

// Round-robin ("cirkelmetoden") – garanterar att ingen möter samma person två gånger.
// Jämnt antal krävs; udda antal fylls ut med en bot ("BOT").
function generateRoundRobinSchedule(participantIds){
  let ids=[...participantIds];
  // Blanda slumpmässigt innan schemat byggs, så det inte alltid blir samma ordning
  for(let i=ids.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [ids[i],ids[j]]=[ids[j],ids[i]];
  }
  if(ids.length%2!==0) ids.push("BOT");
  const n=ids.length;
  if(n<2) return [];
  const fixed=ids[0];
  let rest=ids.slice(1);
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const rotated=[fixed,...rest];
    const pairs=[];
    for(let i=0;i<n/2;i++){
      let a=rotated[i], b=rotated[n-1-i];
      // Växla hemma/borta mellan omgångar för lite balans
      if(r%2===1){ const t=a; a=b; b=t; }
      pairs.push([a,b]);
    }
    rounds.push(pairs);
    rest.unshift(rest.pop());
  }
  return rounds; // array av omgångar, varje omgång = array av [homeId,awayId]
}

// Avancerar Duellen till nästa säsong. Säsong 1→2: rak indelning efter poäng.
// Säsong 2+: upp-/nedflyttning mellan divisioner (Div2→Div1: topp 2 + 4 "lucky treor").
async function advanceDuellenSeason(){
  const curSeason=duellenConfig.season_num||1;
  const nextSeason=curSeason+1;
  const existingRoundNums=duellenFixtures.map(fx=>fx.round_num);
  const startRound=(existingRoundNums.length?Math.max(...existingRoundNums):0)+1;
  let assignments=[]; // {tier,name,members:[userId,...]}

  if(!duellenDivisions.length){
    // Säsong 1 (fritt seriespel) → dela in rakt efter slutplacering
    const curFixtures=duellenFixtures.filter(fx=>(fx.season_num||1)===curSeason && !fx.division_id);
    const standings=duellenStandings(curFixtures);
    if(standings.length<2) return {error:{message:"För få spelare med resultat för att dela in i divisioner."}};
    let idx=0;
    outer1:
    for(const tierDef of DUELLEN_TIERS){
      for(const name of tierDef.names){
        if(idx>=standings.length) break outer1;
        assignments.push({tier:tierDef.tier,name,members:standings.slice(idx,idx+DUELLEN_DIV_SIZE).map(s=>s.id)});
        idx+=DUELLEN_DIV_SIZE;
      }
    }
    if(idx<standings.length) assignments.push({tier:4,name:"Div2 Extra",members:standings.slice(idx).map(s=>s.id)});
  } else {
    // Säsong 2+: räkna ut varje divisions slutställning, flytta upp/ner
    const perDivStandings={}; // divisionId -> sorted standings
    duellenDivisions.forEach(div=>{
      const divFixtures=duellenFixtures.filter(fx=>fx.division_id===div.id);
      perDivStandings[div.id]=duellenStandings(divFixtures);
    });
    const byTier={};
    duellenDivisions.forEach(div=>{ (byTier[div.tier]=byTier[div.tier]||[]).push(div); });

    // Bygg nya divisionslistor per tier, börjar tomma
    const pools={}; // tier -> array of userIds som ska in i den tiern nästa säsong
    DUELLEN_TIERS.forEach(t=>pools[t.tier]=[]);

    DUELLEN_TIERS.forEach((tierDef,tIdx)=>{
      const divs=byTier[tierDef.tier]||[];
      divs.forEach(div=>{
        const st=perDivStandings[div.id]||[];
        const isTop=tierDef.tier===DUELLEN_TIERS[0].tier;
        const isBottom=tIdx===DUELLEN_TIERS.length-1;
        const up=st.slice(0,isTop?0:2).map(s=>s.id);
        const stay=st.slice(isTop?0:2, isBottom?st.length:Math.max(st.length-2,0)).map(s=>s.id);
        const down=isBottom?[]:st.slice(Math.max(st.length-2,0)).map(s=>s.id);
        if(up.length) pools[DUELLEN_TIERS[tIdx-1].tier].push(...up);
        pools[tierDef.tier].push(...stay);
        if(down.length) pools[DUELLEN_TIERS[tIdx+1]?DUELLEN_TIERS[tIdx+1].tier:tierDef.tier].push(...down);
      });
      // Special: Div2(4)→Div1(3): "lucky treor" – bästa 3:orna över alla Div2-serier
      // fyller upp Div1 till 28 platser om det behövs
      if(tierDef.tier===4){
        const thirds=divs.map(div=>({div,third:(perDivStandings[div.id]||[])[2]})).filter(x=>x.third);
        thirds.sort((a,b)=>b.third.pts-a.third.pts||b.third.gd-a.third.gd);
        const luckyCount=Math.max(0, Math.min(4, thirds.length));
        thirds.slice(0,luckyCount).forEach(x=>{
          pools[3].push(x.third.id);
          // Ta bort denna spelare från "stay"-poolen för tier 4 (de flyttas upp istället)
          const i=pools[4].indexOf(x.third.id);
          if(i>=0) pools[4].splice(i,1);
        });
      }
    });

    // Bygg assignments: fyll varje tiers namngivna divisioner med max DUELLEN_DIV_SIZE spelare
    DUELLEN_TIERS.forEach(tierDef=>{
      const pool=[...new Set(pools[tierDef.tier]||[])];
      let idx=0;
      tierDef.names.forEach(name=>{
        if(idx>=pool.length) return;
        assignments.push({tier:tierDef.tier,name,members:pool.slice(idx,idx+DUELLEN_DIV_SIZE)});
        idx+=DUELLEN_DIV_SIZE;
      });
      if(idx<pool.length) assignments.push({tier:tierDef.tier,name:`Div${tierDef.tier} Extra`,members:pool.slice(idx)});
    });
    assignments=assignments.filter(a=>a.members.length>=2);
  }

  for(const a of assignments){
    const divId=`${currentLeague.id}-s${nextSeason}-${a.name.replace(/\s+/g,"_")}`;
    const {error:dErr}=await sb.from("duellen_divisions").insert({id:divId,league_id:currentLeague.id,season_num:nextSeason,tier:a.tier,name:a.name,sort_order:a.tier});
    if(dErr) return {error:dErr};
    const memberRows=a.members.map(uid=>({id:divId+"-"+uid,division_id:divId,league_id:currentLeague.id,user_id:uid,is_bot:false}));
    const {error:mErr}=await sb.from("duellen_division_members").insert(memberRows);
    if(mErr) return {error:mErr};
    const schedule=generateDoubleRoundRobinSchedule(a.members);
    const fixtures=[];
    schedule.forEach((pairs,ridx)=>{
      const roundNum=startRound+ridx;
      pairs.forEach(([h,b],pidx)=>{
        fixtures.push({
          id:`${divId}-r${roundNum}-${pidx}`,league_id:currentLeague.id,round_num:roundNum,
          home_user_id:h==="BOT"?null:h,away_user_id:b==="BOT"?null:b,
          home_is_bot:h==="BOT",away_is_bot:b==="BOT",division_id:divId,season_num:nextSeason
        });
      });
    });
    const {error:fErr}=await sb.from("duellen_fixtures").insert(fixtures);
    if(fErr) return {error:fErr};
  }
  const {error:cfgErr}=await sb.from("duellen_config").upsert({league_id:currentLeague.id,status:"active",season_num:nextSeason,total_rounds:2*(DUELLEN_DIV_SIZE-1)});
  if(cfgErr) return {error:cfgErr};
  return {error:null,divisions:assignments.length,season:nextSeason};
}
// Räknar ut resultatet av en enskild duell (live, baserat på Tippa-poäng den omgången)
function duellenMatchResult(fx){
  const rd=rounds[String(fx.round_num)];
  if(!rd||!rd.results_published) return null;
  const homeUser=fx.home_is_bot?null:users.find(u=>u.id===fx.home_user_id);
  const awayUser=fx.away_is_bot?null:users.find(u=>u.id===fx.away_user_id);
  const homePts=fx.home_is_bot?0:(homeUser?userTipRoundPts(homeUser,fx.round_num):0);
  const awayPts=fx.away_is_bot?0:(awayUser?userTipRoundPts(awayUser,fx.round_num):0);
  let homeRes,awayRes;
  if(homePts>awayPts){homeRes=3;awayRes=0;}
  else if(homePts<awayPts){homeRes=0;awayRes=3;}
  else {homeRes=1;awayRes=1;}
  return {homePts,awayPts,homeRes,awayRes,decided:true};
}
function duellenStandings(fixtures){
  const table={};
  const ensure=(id,isBot,namn)=>{
    const key=isBot?"BOT":id;
    if(!table[key]) table[key]={id:key,namn:namn||"Bot",isBot,played:0,w:0,d:0,l:0,pts:0,gd:0};
    return table[key];
  };
  fixtures.forEach(fx=>{
    const result=duellenMatchResult(fx);
    if(!result) return;
    const homeUser=fx.home_is_bot?null:users.find(u=>u.id===fx.home_user_id);
    const awayUser=fx.away_is_bot?null:users.find(u=>u.id===fx.away_user_id);
    const h=ensure(fx.home_user_id,fx.home_is_bot,homeUser?homeUser.namn:"Bot");
    const a=ensure(fx.away_user_id,fx.away_is_bot,awayUser?awayUser.namn:"Bot");
    h.played++; a.played++;
    h.gd+=(result.homePts-result.awayPts); a.gd+=(result.awayPts-result.homePts);
    if(result.homeRes===3){h.w++;a.l++;} else if(result.awayRes===3){a.w++;h.l++;} else {h.d++;a.d++;}
    h.pts+=result.homeRes; a.pts+=result.awayRes;
  });
  return Object.values(table).filter(r=>!r.isBot).sort((x,y)=>y.pts-x.pts||y.gd-x.gd||x.namn.localeCompare(y.namn,"sv"));
}

function matchfokusFocusMatch(rd){
  if(!rd||rd.focus_h_id==null||rd.focus_a_id==null)return null;
  return (rd.matches||[]).find(m=>m.hId===rd.focus_h_id&&m.aId===rd.focus_a_id)||null;
}
function computeMatchfokusFacts(rd){
  if(!rd||!rd.focus_published)return null;
  const m=matchfokusFocusMatch(rd);
  if(!m)return null;
  const ftH=m.hMål||0, ftA=m.aMål||0;
  const htH=rd.focus_ht_h??0, htA=rd.focus_ht_a??0;
  const h2H=ftH-htH, h2A=ftA-htA;
  const totalGoals=ftH+ftA, h1Goals=htH+htA, h2Goals=h2H+h2A;
  return {
    goals: totalGoals<=1?"0-1":totalGoals<=3?"2-3":"4+",
    ht_leader: htH>htA?"H":htH<htA?"A":"X",
    first_scorer: rd.focus_first_scorer||"N",
    winner: ftH>ftA?"H":ftH<ftA?"A":"X",
    goal_before10: rd.focus_goal_before10?"J":"N",
    h1_goals: h1Goals===0?"0":h1Goals===1?"1":"2+",
    both_halves_goals: (h1Goals>0&&h2Goals>0)?"J":"N",
    btts: (ftH>0&&ftA>0)?"J":"N",
    most_goals_half: h1Goals>h2Goals?"1":h1Goals<h2Goals?"2":"X",
    btts_both_halves: (htH>0&&htA>0&&h2H>0&&h2A>0)?"J":"N",
    margin2: Math.abs(ftH-ftA)>=2?"J":"N",
    red_card: rd.focus_red_card?"J":"N",
    exact_score: `${ftH}-${ftA}`
  };
}
function calcMatchfokusPts(answers,facts){
  if(!answers||!facts)return 0;
  const qs=matchfokusQuestions("","");
  return qs.reduce((s,q)=>s+((answers[q.id]!==undefined&&answers[q.id]!==null&&String(answers[q.id])===String(facts[q.id]))?1:0),0);
}
function userMatchfokusRoundPts(userId,roundNum){
  const rd=rounds[String(roundNum)];

  const tip=matchfokusAllTipsGlobal.find(t=>t.user_id===userId&&Number(t.round_num)===Number(roundNum));

}

function plPts(player,rd){
  if(!rd)return 0;
  const m=rd.matches.find(x=>x.hId===player.teamId||x.aId===player.teamId);
  if(!m)return 0;
  const home=m.hId===player.teamId;
  const mg=home?m.hMål:m.aMål, og=home?m.aMål:m.hMål;
  let p=mg>og?5:(mg===og?2:0);
  if(og===0)p+=POS_PTS[player.pos].clean;
  const goals=(rd.goals&&rd.goals[player.id])||0;
  p+=goals*POS_PTS[player.pos].goal;
  return p;
}
function userRoundPts(u,r){
  if(!u)return 0;
  const rd=rounds[String(r)];
  if(!rd||!rd.results_published)return 0;
  const snapshotMap=rd.picks_snapshot||{};
  const hasAnySnapshot=Object.keys(snapshotMap).length>0;
  const snapshot=snapshotMap[u.id];
  // Om omgången har en ögonblicksbild (dvs publicerad på vanligt sätt) men just den här
  // spelaren saknas i den, fanns spelaren inte med då – ska inte få poäng för omgången.
  if(hasAnySnapshot&&!snapshot)return 0;
  if(rd.locked_at&&u.created_at&&new Date(rd.locked_at)<new Date(u.created_at))return 0;
  // Använd ögonblicksbilden om den finns, annars nuvarande lag (endast relevant för äldre
  // omgångar från innan ögonblicksbilder infördes, då picks_snapshot är helt tomt)
  const picks=snapshot?snapshot.picks:u.picks;
  const kapten=snapshot?snapshot.kapten:u.kapten;
  const activeChip=snapshot?snapshot.activeChip:null;
  const chipMeta=snapshot?snapshot.chipMeta:null;
  if(!picks)return 0;
  let tot=0;
  const allPicked=[...(picks.GK||[]),...(picks.DEF||[]),...(picks.MID||[]),...(picks.FW||[])];
  allPicked.forEach(pid=>{
    const pl=players.find(p=>p.id===pid);
    if(!pl)return;
    const pts=plPts(pl,rd);
    let mult=pid===kapten?2:1;
    if(activeChip==="kaptenboost"&&pid===kapten) mult=3;
    if(activeChip==="hallanollan"&&(pl.pos==="GK"||pl.pos==="DEF")){
      const m=rd.matches.find(x=>x.hId===pl.teamId||x.aId===pl.teamId);
      if(m){
        const home=m.hId===pl.teamId;
        const og=home?m.aMål:m.hMål;
        if(og===0) mult*=2;
      }
    }
    if(activeChip==="trippelbindeln"&&chipMeta&&chipMeta.boostedIds&&chipMeta.boostedIds.includes(pid)) mult*=2;
    tot+=pts*mult;
  });
  return tot;
}
function userTotPts(u){ return Object.keys(rounds).reduce((s,r)=>s+userRoundPts(u,Number(r)),0); }

function tipMatchPts(pred,actualH,actualA){
  if(!pred)return 0;
  const ph=Number(pred.predH), pa=Number(pred.predA);
  if(ph===actualH && pa===actualA) return 10;
  let pts=0;
  if(ph===actualH) pts+=4;
  if(pa===actualA) pts+=4;
  if(pts===0){
    const actualSign = actualH>actualA?1:(actualH<actualA?-1:0);
    const predSign = ph>pa?1:(ph<pa?-1:0);
    if(actualSign===predSign) pts=2;
  }
  return pts;
}
function userTipRoundPts(u,r){
  const rd=rounds[String(r)];
  if(!rd||!rd.results_published||!rd.matches.length)return 0;
  if(rd.locked_at && u.created_at && new Date(rd.locked_at) < new Date(u.created_at)) return 0;
  const tipsForRound = (u.tips&&u.tips[String(r)])||[];
  let tot=0;
  rd.matches.forEach(m=>{
    const pred=tipsForRound.find(t=>t.hId===m.hId&&t.aId===m.aId);
    const pts=tipMatchPts(pred,m.hMål,m.aMål);
    tot+=pred&&pred.boost?pts*2:pts;
  });
  return tot;
}

    "privacy.title":"Integritet & villkor","privacy.subtitle":"{app} – gäller alla våra serier",
    "privacy.section1.title":"Vilka uppgifter vi sparar",
    "privacy.section1.body":"<b>Alltid:</b> det namn du väljer och din PIN-kod (aldrig i klartext – bara en säker, ensidig kryptering som gör att vi själva inte kan se din PIN).<br><br><b>Om du fyller i det:</b> mejladress (helt frivilligt – bara för att kunna nå dig, t.ex. om du vinner ett pris).<br><br><b>Automatiskt:</b> dina val och tips i de spelformer du deltar i, samt viss teknisk aktivitet (t.ex. när du senast var aktiv) för att admin ska kunna se att allt fungerar som det ska.",
    "privacy.section2.title":"Varför vi sparar det",
    "privacy.section2.body":"För att kunna driva spelet – räkna poäng, visa topplistor, låta dig logga in igen senare, och kontakta dig om du vinner något. Vi säljer aldrig dina uppgifter vidare och delar dem inte med tredje part för marknadsföring.",
    "privacy.section3.title":"Var datan lagras",
    "privacy.section3.body":"Vi använder <b>Supabase</b> (en molndatabas) för att lagra all information. De agerar som vårt personuppgiftsbiträde och har egna säkerhetsrutiner för detta.",
    "privacy.section4.title":"Betalningar",
    "privacy.section4.body":"Frivilligt stöd och eventuella avgifter hanteras via <b>Swish</b>, direkt mellan dig och oss. Vi lagrar aldrig kortuppgifter eller annan betalinformation i appen – bara om du markerats som betald eller inte.",
    "privacy.section5.title":"Dina rättigheter",
    "privacy.section5.body":"Du kan när som helst radera ditt konto och all tillhörande data själv, under Min profil → kontoinställningar. Vill du ha ut en kopia av din data, ändra något, eller har andra frågor om integritet – hör av dig via Kontakta oss (Inbox) i appen.",
    "privacy.section6.title":"Villkor för att spela",
    "privacy.section6.body":"Spelet är i första hand till för nöjes skull. Eventuella priser eller tävlingsmoment beskrivs separat av respektive serieadministratör och är inte en garanti. Vi förbehåller oss rätten att stänga av konton som missbrukar systemet (t.ex. flera konton för att kringgå regler, kränkande beteende mot andra spelare, eller försök att manipulera resultat).",

    "rules.header":"Regler & spelformer",
    "rules.intro":"{app} har flera spelformer. Du väljer själv vilka du vill delta i – varje spelform har sin egen ligatabell och poängräkning. Du kan också gå med i <b>privata ligor</b> och tävla mot kompisar.",
    "rules.fantasy.intro":"Sätt ihop ett drömlag med 11 spelare från {league} i formationen 4-3-3. <b>Max en spelare per lag</b> – du måste sprida dina val. Du utser även en <b>kapten</b> vars poäng räknas dubbelt. Laget kan bytas fritt fram till att omgångens tippning stänger.",

    "rules.fantasy.rowWin":"Laget vinner","rules.fantasy.rowDraw":"Laget oavgjort","rules.fantasy.rowLoss":"Laget förlorar",
    "rules.fantasy.bonusPerPositionLabel":"Bonuspoäng per position:",
    "rules.fantasy.tip":"💡 Exempel: Din försvarare vinner 2–0 och gör ett mål → 5p (vinst) + 4p (nollmatch) + 6p (mål) = <b>15p</b>. Som kapten: <b>30p</b>.",
    "rules.tipp.intro":"Gissa exakt resultat på varje match i omgången. Ju mer rätt du har, desto mer poäng. Tips stänger när omgångens tippning stängs av admin.",
    "rules.tipp.rowExact":"Exakt rätt resultat","rules.tipp.rowPartial":"Rätt antal mål för ena laget","rules.tipp.rowPartialVal":"4 p/lag",
    "rules.tipp.rowSign":"Rätt tecken (1/X/2) men fel mål",
    "rules.tipp.tip":"💡 Exempel: Matchen slutar 2–1, du tippar 2–1 → <b>10p</b>. Du tippar 2–0 → bara hemmalaget stämmer → <b>4p</b>. Du tippar 1–0 → rätt tecken → <b>2p</b>.",
    "rules.duellen.intro":"Möt en annan spelare <b>hemma och borta</b> över säsongen – som ett riktigt seriespel, fast mellan er som spelar {app}. Vem som vinner duellen avgörs automatiskt av vem som får flest poäng i <b>Tippa resultat</b> den omgången.",
    "rules.duellen.rowWin":"Du får fler poäng än motståndaren","rules.duellen.rowWinVal":"Vinst – 3p",
    "rules.duellen.rowDraw":"Ni får exakt lika många poäng","rules.duellen.rowDrawVal":"Oavgjort – 1p",
    "rules.duellen.rowLoss":"Motståndaren får fler poäng","rules.duellen.rowLossVal":"Förlust – 0p",
    "rules.duellen.rowBot":"Möter en bot","rules.duellen.rowBotVal":"Boten har alltid 0p – lätt vinst!",
    "rules.duellen.extra":"<b>Anmälan:</b> Frivillig, egen anmälan i Duellen-fliken. Ingen extra tippning behövs – dina Tippa resultat-poäng används automatiskt.<br><b>Schema:</b> Säsongen slumpas fram när admin startar den – du möter varje motståndare <b>högst en gång</b> under säsongen. Är ni ett udda antal fyller en bot ut schemat.<br><b>Tabell:</b> 3 poäng för vinst, 1 för oavgjort, 0 för förlust – precis som i riktig fotboll.",
    "rules.duellen.tip":"💡 Kommer inte du eller din motståndare in med tips en omgång räknas det som 0 poäng den matchen – glöm inte att tippa!",
    "rules.malregn.intro":"Hur många mål tror du blir det totalt i omgångens 7 matcher? Gissa ett exakt tal – ju bättre koll på formkurvor, desto större chans!",
    "rules.malregn.rowExact":"Exakt rätt antal mål","rules.malregn.rowWrong":"Fel gissning",
    "rules.malregn.extra":"<b>Deadline:</b> Samma spelstopp som resten av omgången.<br><b>Facit:</b> Räknas fram automatiskt så fort alla resultat är inlagda – summan av målen i omgångens matcher.",
    "rules.malregn.tip":"💡 Titta på tabellen – lag i toppen och botten brukar ge fler mål än jämna möten!",
    "rules.jubel.intro":"Enkelt och snabbt: för varje match, gissa om <b>båda lagen gör minst ett mål</b>. Svara Ja eller Nej på alla 7 matcher.",
    "rules.jubel.rowCorrect":"Rätt gissning","rules.jubel.rowCorrectVal":"1 p/match","rules.jubel.rowWrong":"Fel gissning",
    "rules.jubel.rowMax":"Max per omgång","rules.jubel.rowMaxVal":"7 p",
    "rules.jubel.extra":"<b>Deadline:</b> Samma spelstopp som resten av omgången.<br><b>Facit:</b> Räknas fram automatiskt så fort resultaten är inlagda – båda lagen gjorde minst ett mål = Ja, annars Nej.",
    "rules.jubel.tip":"💡 Snabbaste spelet att tippa – bara 7 klick, ingen exakt gissning behövs!",
    "rules.investerare.intro":"Du startar med <b>1000 kr</b>. Varje omgång placerar du valfri summa på valfria lag – du behöver inte investera allt, och du kan investera i båda lagen i samma match. Din portfölj fortsätter hela säsongen – vinster och förluster läggs på det du redan har.",
    "rules.investerare.rowWin":"Laget vinner","rules.investerare.rowDraw":"Oavgjort","rules.investerare.rowLoss":"Laget förlorar",
    "rules.investerare.rowCleanSheet":"Hållen nolla (0 insläppta mål)","rules.investerare.rowHighScore":"Laget gör över 3 mål (4+)",
    "rules.investerare.rowBigMargin":"Vinst med minst 3 måls marginal",
    "rules.investerare.extra":"<b>Staplas:</b> Flera bonusar kan gälla samtidigt – t.ex. vinst (+10%) + hållen nolla (+2%) + minst 3 måls marginal (+3%) = <b>+15%</b> på just den investeringen.<br><b>Deadline:</b> Samma spelstopp som resten av omgången.<br><b>Facit:</b> Räknas fram automatiskt utifrån matchresultaten så fort omgången är klar.",
    "rules.investerare.tip":"💡 Sprid riskerna över flera lag, eller satsa stort på ett lag du är säker på – helt upp till dig!",
    "rules.lts.intro":"Klassiskt utslagsspel: varje omgång väljer du <b>ett lag</b> som du tror inte förlorar. Vinst eller oavgjort och du går vidare – bara en <b>förlust</b> kostar dig ett liv.",
    "rules.lts.rowWinDraw":"Laget vinner eller spelar oavgjort","rules.lts.rowWinDrawVal":"Du går vidare",
    "rules.lts.rowLoss":"Laget förlorar","rules.lts.rowLossVal":"−1 liv",
    "rules.lts.rowZeroLives":"0 liv kvar","rules.lts.rowZeroLivesVal":"Utslagen",
    "rules.lts.rowMaxRounds":"Max antal omgångar","rules.lts.rowMaxRoundsVal":"Lika många som antal lag i serien",
    "rules.lts.livesDecreaseNote":"<b>Liven minskar ju längre tävlingen pågår</b> – så det alltid finns något att spela för på slutet:",
    "rules.lts.rowPhase1":"Omgång 1–{n}","rules.lts.rowPhase1Val":"Max 3 liv",
    "rules.lts.rowPhase2":"Omgång {start}–{end}","rules.lts.rowPhase2Val":"Max 2 liv",
    "rules.lts.rowPhase3":"Omgång {start} och framåt","rules.lts.rowPhase3Val":"Max 1 liv",
    "rules.lts.extra":"Har du färre liv kvar än taket (för att du redan förlorat) gäller förstås det verkliga, lägre antalet – taket kan bara sänka, aldrig ge dig extra liv.<br><br><b>Viktig regel:</b> Varje lag får bara användas <b>en gång</b> under hela tävlingen – när du valt ett lag kan du inte välja det igen.<br><b>Utslagsfråga:</b> Du gissar totalt antal mål som görs under hela tävlingen innan ditt första val – används som utslag om flera klarar sig hela vägen (närmast rätt vinner).<br><b>Deadline:</b> Samma spelstopp som resten av omgången. Väljer du inget lag räknas det som en förlust.",
    "rules.lts.tip":"💡 Spara dina bästa lag till senare omgångar – från omgång 11 räcker EN förlust för att slå ut dig, oavsett hur många liv du haft tidigare!",
    "rules.anytime.intro":"Välj <b>1 försvarare, 2 mittfältare och 2 anfallare</b> som du tror gör mål i omgången. Samma poängvikt som i Fantasy – ovanligare mål (från försvarare) ger mer.",
    "rules.anytime.rowDef":"Mål av din försvarare","rules.anytime.rowDefVal":"7 p/mål",
    "rules.anytime.rowMid":"Mål av din mittfältare","rules.anytime.rowMidVal":"5 p/mål",
    "rules.anytime.rowFw":"Mål av din anfallare","rules.anytime.rowFwVal":"5 p/mål",
    "rules.anytime.extra":"<b>Val:</b> Fem olika spelare, en per position enligt kraven ovan – ingen får väljas dubbelt.<br><b>Deadline:</b> Samma spelstopp som resten av omgången.<br><b>Facit:</b> Räknas fram från samma målstatistik som redan används för Fantasy – ingen ny inmatning krävs.",
    "rules.anytime.tip":"💡 Skyttekungen är säker men ger mindre – en chansning på en målsugen försvarare kan ge betydligt fler poäng!",
    "rules.snabbast.intro":"Välj <b>7 lag</b> som du tror gör de snabbaste målen under omgången. Poängen kräver rätt lag på exakt rätt plats – 7p om du gissar snabbaste laget på plats 1, 6p för plats 2, ner till 1p för plats 7. Fel plats ger inga poäng för det laget.",
    "rules.snabbast.extra":"<b>Oavgjord minut:</b> Det lag som har bäst tabellplacering går före.<br><b>Lag utan mål:</b> Placeras efter alla målgörande lag, rangordnade efter tabellplacering.",
    "rules.snabbast.tip":"💡 Max möjlig poäng per omgång: 7+6+5+4+3+2+1 = <b>28p</b> (om alla 7 dina val finns i facit).",
    "rules.maljakten.intro":"Välj <b>3 lag</b> inför varje omgång. Du får poäng för varje mål dina valda lag gör – med högre belöning för bortamål och bonus för riktigt målrika matcher.",
    "rules.maljakten.rowHome":"Hemmamål","rules.maljakten.rowHomeVal":"2 p/mål",
    "rules.maljakten.rowAway":"Bortamål","rules.maljakten.rowAwayVal":"3 p/mål",
    "rules.maljakten.rowBonus":"Laget gör 3+ mål","rules.maljakten.rowBonusVal":"+ 5 p bonus",
    "rules.maljakten.tip":"💡 Exempel: Ditt lag vinner borta 3–1 → 3×3p + 5p bonus = <b>14p</b>. Ditt lag vinner hemma 2–0 → 2×2p = <b>4p</b>.",
    "rules.ligatipp.intro":"Rangordna <b>alla {n} lag</b> inför säsongsstart – vem vinner, vem slutar sist? Poäng delas ut vid <b>två tillfällen</b>: efter omgång {half} (halvtid) och efter omgång {total} (slutet). För varje lag du placerar på exakt rätt plats får du 3p.",
    "rules.ligatipp.rowExact":"Exakt rätt placering",
    "rules.ligatipp.rowMaxCheckpoint":"Max poäng per checkpoint","rules.ligatipp.rowMaxCheckpointVal":"{max} p ({n}×3p)",
    "rules.ligatipp.rowMaxTotal":"Max totalt (båda checkpoints)",
    "rules.ligatipp.tip":"💡 Tippningen stänger innan säsongen startar – du kan inte ändra efteråt. Välj klokt!",
    "rules.privateLeagues.title":"Privata ligor",
    "rules.privateLeagues.intro":"Tävla mot kompisar, kollegor eller supportrar från ditt lag i en privat liga! Dina tips och poäng är desamma som i huvudligan – du behöver inte tippa om.",
    "rules.privateLeagues.extra":"<b>Gå med:</b> Klicka \"Gå med med kod\" i respektive spelform och ange koden du fått.<br><b>Skapa:</b> Klicka \"+ Skapa liga\" och skicka in en ansökan – admin godkänner och genererar en kod som du delar med dina vänner.<br><b>Placeringspilar:</b> ▲ grön pil = du klättrat, ▼ röd pil = du tappat, – = oförändrat.",
    "rules.privateLeagues.tip":"💡 En inbjudningskod gäller per spelform. Vill du tävla mot samma grupp i alla spel behöver du en kod per spelform.",
    "rules.quiz.intro":"Testa dina kunskaper om {league}! Varje omgång finns det <b>5 frågor</b> om seriens historia, lag och händelser. Du har <b>5 minuter</b> på dig att svara.",
    "rules.quiz.rowCorrect":"Rätt svar","rules.quiz.rowWrong":"Fel svar / ej besvarad",
    "rules.quiz.rowMax":"Max per omgång","rules.quiz.rowMaxTotal":"Max totalt ({n} omgångar)",
    "rules.quiz.extra":"<b>Format:</b> Tre alternativ – <b>1</b>, <b>X</b> eller <b>2</b> – med valfri text bakom.<br><b>Låsta svar:</b> Klickar du ett alternativ låses svaret permanent.<br><b>Timer:</b> Börjar när du öppnar quizen. Fortsätter även om du lämnar sidan.",

    "rules.maljakten.intro":"Choose <b>3 teams</b> before each round. You get points for every goal your chosen teams score – with a higher reward for away goals and a bonus for really high-scoring matches.",

    "privacy.title":"Απόρρητο & όροι","privacy.subtitle":"{app} – ισχύει για όλες τις σειρές μας",
    "privacy.section1.title":"Ποια στοιχεία αποθηκεύουμε",
    "privacy.section1.body":"<b>Πάντα:</b> το όνομα που επιλέγεις και τον κωδικό PIN σου (ποτέ σε απλό κείμενο – μόνο μια ασφαλής, μονόδρομη κρυπτογράφηση ώστε ούτε εμείς να μη βλέπουμε το PIN σου).<br><br><b>Αν το συμπληρώσεις:</b> διεύθυνση email (εντελώς προαιρετικό – μόνο για να μπορούμε να επικοινωνήσουμε μαζί σου, π.χ. αν κερδίσεις κάποιο βραβείο).<br><br><b>Αυτόματα:</b> οι επιλογές και οι προβλέψεις σου στους τρόπους παιχνιδιού στους οποίους συμμετέχεις, καθώς και κάποια τεχνική δραστηριότητα (π.χ. πότε ήσουν τελευταία φορά ενεργός) ώστε ο διαχειριστής να βλέπει ότι όλα λειτουργούν σωστά.",
    "privacy.section2.title":"Γιατί τα αποθηκεύουμε",
    "privacy.section2.body":"Για να λειτουργεί το παιχνίδι – υπολογισμός πόντων, εμφάνιση κατατάξεων, να μπορείς να συνδεθείς ξανά αργότερα, και να επικοινωνήσουμε μαζί σου αν κερδίσεις κάτι. Δεν πουλάμε ποτέ τα στοιχεία σου και δεν τα μοιραζόμαστε με τρίτους για διαφήμιση.",
    "privacy.section3.title":"Πού αποθηκεύονται τα δεδομένα",
    "privacy.section3.body":"Χρησιμοποιούμε το <b>Supabase</b> (μια βάση δεδομένων στο cloud) για να αποθηκεύουμε όλες τις πληροφορίες. Λειτουργούν ως ο επεξεργαστής δεδομένων μας και έχουν δικές τους διαδικασίες ασφαλείας για αυτό.",
    "privacy.section4.title":"Πληρωμές",
    "privacy.section4.body":"Η εθελοντική στήριξη και τυχόν χρεώσεις γίνονται μέσω <b>Swish</b>, απευθείας ανάμεσα σε εσένα και εμάς. Δεν αποθηκεύουμε ποτέ στοιχεία κάρτας ή άλλες πληροφορίες πληρωμής στην εφαρμογή – μόνο αν έχεις σημειωθεί ως πληρωμένος ή όχι.",
    "privacy.section5.title":"Τα δικαιώματά σου",
    "privacy.section5.body":"Μπορείς οποιαδήποτε στιγμή να διαγράψεις μόνος σου τον λογαριασμό σου και όλα τα σχετικά δεδομένα, από Το προφίλ μου → ρυθμίσεις λογαριασμού. Αν θέλεις αντίγραφο των δεδομένων σου, να αλλάξεις κάτι, ή έχεις άλλες ερωτήσεις για το απόρρητο – επικοινώνησε μέσω Επικοινωνία (Εισερχόμενα) στην εφαρμογή.",
    "privacy.section6.title":"Όροι συμμετοχής",
    "privacy.section6.body":"Το παιχνίδι είναι πρωτίστως για διασκέδαση. Τυχόν βραβεία ή στοιχεία διαγωνισμού περιγράφονται ξεχωριστά από τον εκάστοτε διαχειριστή σειράς και δεν αποτελούν εγγύηση. Διατηρούμε το δικαίωμα να αναστείλουμε λογαριασμούς που καταχρώνται το σύστημα (π.χ. πολλαπλοί λογαριασμοί για παράκαμψη κανόνων, προσβλητική συμπεριφορά προς άλλους παίκτες, ή προσπάθειες χειραγώγησης αποτελεσμάτων).",
    "privacy.lastUpdated":"Τελευταία ενημέρωση {date}",
    "paywall.title":"⏳ Η δοκιμαστική περίοδος έληξε",
    "paywall.body":"Έπαιξες δωρεάν για {days} ημέρες. Η δοκιμαστική περίοδος ισχύει σε όλες τις σειρές μας, όχι μόνο στο {league}. Μπορείς ακόμα να βλέπεις τα πάντα όπως πριν, αλλά για να κάνεις νέες επιλογές και προβλέψεις χρειάζεται να κάνεις Swish για να συνεχίσεις.",

    "rules.header":"Κανόνες & τρόποι παιχνιδιού",
    "rules.intro":"Το {app} έχει πολλούς τρόπους παιχνιδιού. Εσύ επιλέγεις σε ποιους θα συμμετάσχεις – κάθε τρόπος έχει τη δική του κατάταξη και βαθμολόγηση. Μπορείς επίσης να συμμετάσχεις σε <b>ιδιωτικές σειρές</b> και να διαγωνιστείς με φίλους.",
    "rules.fantasy.intro":"Φτιάξε μια ονειρική ομάδα με 11 παίκτες από το {league} στη διάταξη 4-3-3. <b>Μέγιστο ένας παίκτης ανά ομάδα</b> – πρέπει να μοιράσεις τις επιλογές σου. Ορίζεις επίσης έναν <b>αρχηγό</b> του οποίου οι πόντοι διπλασιάζονται. Η ομάδα μπορεί να αλλάξει ελεύθερα μέχρι να κλείσουν οι προβλέψεις του γύρου.",
    "rules.fantasy.pointsPerRoundLabel":"Πόντοι ανά γύρο:",
    "rules.fantasy.rowWin":"Η ομάδα κερδίζει","rules.fantasy.rowDraw":"Η ομάδα ισοπαλεί","rules.fantasy.rowLoss":"Η ομάδα χάνει",
    "rules.fantasy.bonusPerPositionLabel":"Μπόνους πόντοι ανά θέση:",
    "rules.fantasy.tip":"💡 Παράδειγμα: Ο αμυντικός σου κερδίζει 2–0 και σκοράρει ένα γκολ → 5β (νίκη) + 4β (καθαρό μηδέν) + 6β (γκολ) = <b>15β</b>. Ως αρχηγός: <b>30β</b>.",
    "rules.tipp.intro":"Μάντεψε το ακριβές αποτέλεσμα κάθε αγώνα του γύρου. Όσο πιο σωστός είσαι, τόσο περισσότερους πόντους παίρνεις. Οι προβλέψεις κλείνουν όταν κλείσουν οι προβλέψεις του γύρου από τον διαχειριστή.",
    "rules.tipp.rowExact":"Ακριβώς σωστό αποτέλεσμα","rules.tipp.rowPartial":"Σωστός αριθμός γκολ για τη μία ομάδα","rules.tipp.rowPartialVal":"4 β./ομάδα",
    "rules.tipp.rowSign":"Σωστή έκβαση (1/X/2) αλλά λάθος σκορ",
    "rules.tipp.tip":"💡 Παράδειγμα: Ο αγώνας λήγει 2–1, προβλέπεις 2–1 → <b>10β</b>. Προβλέπεις 2–0 → μόνο η γηπεδούχος ταιριάζει → <b>4β</b>. Προβλέπεις 1–0 → σωστή έκβαση → <b>2β</b>.",
    "rules.duellen.intro":"Αναμετρήσου με έναν άλλο παίκτη <b>εντός και εκτός</b> σε όλη τη σεζόν – σαν πραγματικό πρωτάθλημα, αλλά ανάμεσα σε όσους παίζουν {app}. Ο νικητής της μονομαχίας καθορίζεται αυτόματα από το ποιος παίρνει περισσότερους πόντους στο <b>Πρόβλεψε το Αποτέλεσμα</b> εκείνον τον γύρο.",
    "rules.duellen.rowWin":"Παίρνεις περισσότερους πόντους από τον αντίπαλο","rules.duellen.rowWinVal":"Νίκη – 3β",
    "rules.duellen.rowDraw":"Παίρνετε ακριβώς τους ίδιους πόντους","rules.duellen.rowDrawVal":"Ισοπαλία – 1β",
    "rules.duellen.rowLoss":"Ο αντίπαλος παίρνει περισσότερους πόντους","rules.duellen.rowLossVal":"Ήττα – 0β",
    "rules.duellen.rowBot":"Αντιμετωπίζεις bot","rules.duellen.rowBotVal":"Το bot έχει πάντα 0β – εύκολη νίκη!",
    "rules.duellen.extra":"<b>Εγγραφή:</b> Προαιρετική, εγγράφεσαι μόνος σου στην καρτέλα Μονομαχία. Δεν χρειάζονται επιπλέον προβλέψεις – οι πόντοι σου από το Πρόβλεψε το Αποτέλεσμα χρησιμοποιούνται αυτόματα.<br><b>Πρόγραμμα:</b> Η σεζόν κληρώνεται τυχαία όταν ο διαχειριστής την ξεκινήσει – αντιμετωπίζεις κάθε αντίπαλο <b>το πολύ μία φορά</b> στη σεζόν. Αν είστε μονός αριθμός, ένα bot συμπληρώνει το πρόγραμμα.<br><b>Πίνακας:</b> 3 πόντοι για νίκη, 1 για ισοπαλία, 0 για ήττα – ακριβώς όπως στο πραγματικό ποδόσφαιρο.",
    "rules.duellen.tip":"💡 Αν εσύ ή ο αντίπαλός σου δεν υποβάλετε προβλέψεις σε έναν γύρο, μετράει ως 0 πόντοι για εκείνον τον αγώνα – μην ξεχνάς να προβλέπεις!",
    "rules.malregn.intro":"Πόσα γκολ πιστεύεις ότι θα γίνουν συνολικά στους 7 αγώνες του γύρου; Μάντεψε έναν ακριβή αριθμό – όσο καλύτερα ξέρεις τη φόρμα, τόσο μεγαλύτερη η πιθανότητα!",
    "rules.malregn.rowExact":"Ακριβώς σωστός αριθμός γκολ","rules.malregn.rowWrong":"Λάθος πρόβλεψη",
    "rules.malregn.extra":"<b>Προθεσμία:</b> Ίδια προθεσμία με τον υπόλοιπο γύρο.<br><b>Αποτέλεσμα:</b> Υπολογίζεται αυτόματα μόλις εισαχθούν όλα τα αποτελέσματα – το άθροισμα των γκολ στους αγώνες του γύρου.",
    "rules.malregn.tip":"💡 Κοίτα την κατάταξη – οι ομάδες στην κορυφή και στον πάτο συνήθως δίνουν περισσότερα γκολ από ισόπαλες αναμετρήσεις!",
    "rules.jubel.intro":"Απλό και γρήγορο: για κάθε αγώνα, μάντεψε αν <b>και οι δύο ομάδες θα σκοράρουν τουλάχιστον ένα γκολ</b>. Απάντησε Ναι ή Όχι για όλους τους 7 αγώνες.",
    "rules.jubel.rowCorrect":"Σωστή πρόβλεψη","rules.jubel.rowCorrectVal":"1 β./αγώνα","rules.jubel.rowWrong":"Λάθος πρόβλεψη",
    "rules.jubel.rowMax":"Μέγιστο ανά γύρο","rules.jubel.rowMaxVal":"7 β.",
    "rules.jubel.extra":"<b>Προθεσμία:</b> Ίδια προθεσμία με τον υπόλοιπο γύρο.<br><b>Αποτέλεσμα:</b> Υπολογίζεται αυτόματα μόλις εισαχθούν τα αποτελέσματα – και οι δύο ομάδες σκόραραν τουλάχιστον ένα γκολ = Ναι, αλλιώς Όχι.",
    "rules.jubel.tip":"💡 Το πιο γρήγορο παιχνίδι για πρόβλεψη – μόνο 7 κλικ, δεν χρειάζεται ακριβής πρόβλεψη!",
    "rules.investerare.intro":"Ξεκινάς με <b>1000 kr</b>. Κάθε γύρο επενδύεις όποιο ποσό θέλεις σε όποιες ομάδες θέλεις – δεν χρειάζεται να επενδύσεις τα πάντα, και μπορείς να επενδύσεις και στις δύο ομάδες στον ίδιο αγώνα. Το χαρτοφυλάκιό σου συνεχίζεται όλη τη σεζόν – τα κέρδη και οι ζημιές προστίθενται σε αυτό που ήδη έχεις.",
    "rules.investerare.rowWin":"Η ομάδα κερδίζει","rules.investerare.rowDraw":"Ισοπαλία","rules.investerare.rowLoss":"Η ομάδα χάνει",
    "rules.investerare.rowCleanSheet":"Καθαρό μηδέν (0 γκολ δέχτηκε)","rules.investerare.rowHighScore":"Η ομάδα σκοράρει πάνω από 3 γκολ (4+)",
    "rules.investerare.rowBigMargin":"Νίκη με διαφορά τουλάχιστον 3 γκολ",
    "rules.investerare.extra":"<b>Σωρεύονται:</b> Πολλά μπόνους μπορούν να ισχύουν ταυτόχρονα – π.χ. νίκη (+10%) + καθαρό μηδέν (+2%) + διαφορά τουλάχιστον 3 γκολ (+3%) = <b>+15%</b> σε αυτή τη συγκεκριμένη επένδυση.<br><b>Προθεσμία:</b> Ίδια προθεσμία με τον υπόλοιπο γύρο.<br><b>Αποτέλεσμα:</b> Υπολογίζεται αυτόματα από τα αποτελέσματα των αγώνων μόλις ολοκληρωθεί ο γύρος.",
    "rules.investerare.tip":"💡 Διασκόρπισε τον κίνδυνο σε πολλές ομάδες, ή ποντάρισε δυνατά σε μία ομάδα που είσαι σίγουρος – εξαρτάται εντελώς από εσένα!",
    "rules.lts.intro":"Ένα κλασικό παιχνίδι αποκλεισμού: κάθε γύρο διαλέγεις <b>μία ομάδα</b> που πιστεύεις ότι δεν θα χάσει. Νίκη ή ισοπαλία και προχωράς – μόνο μια <b>ήττα</b> σου κοστίζει μια ζωή.",
    "rules.lts.rowWinDraw":"Η ομάδα κερδίζει ή ισοπαλεί","rules.lts.rowWinDrawVal":"Προχωράς",
    "rules.lts.rowLoss":"Η ομάδα χάνει","rules.lts.rowLossVal":"−1 ζωή",
    "rules.lts.rowZeroLives":"0 ζωές απομένουν","rules.lts.rowZeroLivesVal":"Αποκλεισμός",
    "rules.lts.rowMaxRounds":"Μέγιστος αριθμός γύρων","rules.lts.rowMaxRoundsVal":"Όσες και οι ομάδες στη σειρά",
    "rules.lts.livesDecreaseNote":"<b>Οι ζωές μειώνονται όσο προχωράει ο διαγωνισμός</b> – ώστε να υπάρχει πάντα κάτι να παίξεις στο τέλος:",
    "rules.lts.rowPhase1":"Γύρος 1–{n}","rules.lts.rowPhase1Val":"Μέγιστο 3 ζωές",
    "rules.lts.rowPhase2":"Γύρος {start}–{end}","rules.lts.rowPhase2Val":"Μέγιστο 2 ζωές",
    "rules.lts.rowPhase3":"Γύρος {start} και μετά","rules.lts.rowPhase3Val":"Μέγιστο 1 ζωή",
    "rules.lts.extra":"Αν έχεις λιγότερες ζωές από το όριο (επειδή έχεις ήδη χάσει), φυσικά ισχύει ο πραγματικός, μικρότερος αριθμός – το όριο μπορεί μόνο να μειώσει, ποτέ να σου δώσει επιπλέον ζωές.<br><br><b>Σημαντικός κανόνας:</b> Κάθε ομάδα μπορεί να χρησιμοποιηθεί μόνο <b>μία φορά</b> σε όλο τον διαγωνισμό – μόλις διαλέξεις μια ομάδα δεν μπορείς να την ξαναδιαλέξεις.<br><b>Ερώτηση ισοπαλίας:</b> Μαντεύεις τον συνολικό αριθμό γκολ που θα γίνουν σε όλο τον διαγωνισμό πριν την πρώτη σου επιλογή – χρησιμοποιείται ως κριτήριο αν επιβιώσουν πολλοί μέχρι το τέλος (η πιο κοντινή πρόβλεψη κερδίζει).<br><b>Προθεσμία:</b> Ίδια προθεσμία με τον υπόλοιπο γύρο. Αν δεν διαλέξεις ομάδα μετράει ως ήττα.",
    "rules.lts.tip":"💡 Φύλαξε τις καλύτερες ομάδες σου για αργότερα – από τον γύρο 11 και μετά, ΜΙΑ ήττα αρκεί για να αποκλειστείς, ανεξάρτητα από πόσες ζωές είχες πριν!",
    "rules.anytime.intro":"Διάλεξε <b>1 αμυντικό, 2 μέσους και 2 επιθετικούς</b> που πιστεύεις ότι θα σκοράρουν στον γύρο. Ίδια βαρύτητα πόντων όπως στο Fantasy – πιο σπάνια γκολ (από αμυντικούς) δίνουν περισσότερα.",
    "rules.anytime.rowDef":"Γκολ από τον αμυντικό σου","rules.anytime.rowDefVal":"7 β./γκολ",
    "rules.anytime.rowMid":"Γκολ από τον μέσο σου","rules.anytime.rowMidVal":"5 β./γκολ",
    "rules.anytime.rowFw":"Γκολ από τον επιθετικό σου","rules.anytime.rowFwVal":"5 β./γκολ",
    "rules.anytime.extra":"<b>Επιλογές:</b> Πέντε διαφορετικοί παίκτες, ένας ανά θέση σύμφωνα με τις παραπάνω απαιτήσεις – κανείς δεν μπορεί να επιλεγεί δύο φορές.<br><b>Προθεσμία:</b> Ίδια προθεσμία με τον υπόλοιπο γύρο.<br><b>Αποτέλεσμα:</b> Υπολογίζεται από τα ίδια στατιστικά γκολ που ήδη χρησιμοποιούνται για το Fantasy – δεν χρειάζεται νέα καταχώρηση.",
    "rules.anytime.tip":"💡 Ο Πρώτος Σκόρερ είναι ασφαλής επιλογή αλλά δίνει λιγότερα – ένα ρίσκο σε έναν αμυντικό που σκοράρει συχνά μπορεί να δώσει σημαντικά περισσότερους πόντους!",
    "rules.snabbast.intro":"Διάλεξε <b>7 ομάδες</b> που πιστεύεις ότι θα σκοράρουν τα πιο γρήγορα γκολ στον γύρο. Οι πόντοι απαιτούν τη σωστή ομάδα στην ακριβώς σωστή θέση – 7β αν μαντέψεις τη πιο γρήγορη ομάδα στη θέση 1, 6β για τη θέση 2, μέχρι 1β για τη θέση 7. Λάθος θέση δεν δίνει πόντους για εκείνη την ομάδα.",
    "rules.snabbast.extra":"<b>Ισόπαλο λεπτό:</b> Προηγείται η ομάδα με την καλύτερη θέση στη βαθμολογία.<br><b>Ομάδες χωρίς γκολ:</b> Τοποθετούνται μετά από όλες τις ομάδες που σκόραραν, ταξινομημένες με βάση τη θέση στη βαθμολογία.",
    "rules.snabbast.tip":"💡 Μέγιστοι δυνατοί πόντοι ανά γύρο: 7+6+5+4+3+2+1 = <b>28β</b> (αν όλες οι 7 επιλογές σου βρίσκονται στο αποτέλεσμα).",
    "rules.maljakten.intro":"Διάλεξε <b>3 ομάδες</b> πριν από κάθε γύρο. Παίρνεις πόντους για κάθε γκολ που σκοράρουν οι επιλεγμένες ομάδες σου – με μεγαλύτερη ανταμοιβή για γκολ εκτός έδρας και μπόνους για αγώνες με πολλά γκολ.",
    "rules.maljakten.rowHome":"Γκολ εντός έδρας","rules.maljakten.rowHomeVal":"2 β./γκολ",
    "rules.maljakten.rowAway":"Γκολ εκτός έδρας","rules.maljakten.rowAwayVal":"3 β./γκολ",
    "rules.maljakten.rowBonus":"Η ομάδα σκοράρει 3+ γκολ","rules.maljakten.rowBonusVal":"+ 5 β. μπόνους",
    "rules.maljakten.tip":"💡 Παράδειγμα: Η ομάδα σου κερδίζει εκτός έδρας 3–1 → 3×3β + 5β μπόνους = <b>14β</b>. Η ομάδα σου κερδίζει εντός έδρας 2–0 → 2×2β = <b>4β</b>.",
    "rules.ligatipp.intro":"Κατάταξε <b>όλες τις {n} ομάδες</b> πριν την έναρξη της σεζόν – ποιος κερδίζει, ποιος τελειώνει τελευταίος; Οι πόντοι μοιράζονται σε <b>δύο περιπτώσεις</b>: μετά τον γύρο {half} (στα μισά) και μετά τον γύρο {total} (στο τέλος). Για κάθε ομάδα που τοποθετείς στην ακριβώς σωστή θέση παίρνεις 3β.",
    "rules.ligatipp.rowExact":"Ακριβώς σωστή θέση",
    "rules.ligatipp.rowMaxCheckpoint":"Μέγιστοι πόντοι ανά έλεγχο","rules.ligatipp.rowMaxCheckpointVal":"{max} β. ({n}×3β)",
    "rules.ligatipp.rowMaxTotal":"Μέγιστο σύνολο (και οι δύο έλεγχοι)",
    "rules.ligatipp.tip":"💡 Οι προβλέψεις κλείνουν πριν ξεκινήσει η σεζόν – δεν μπορείς να αλλάξεις μετά. Διάλεξε σοφά!",

function t(key,vars){
  let str=(TRANSLATIONS[lang]&&TRANSLATIONS[lang][key]!=null)?TRANSLATIONS[lang][key]:TRANSLATIONS.sv[key];
  if(str==null)return key; // saknad nyckel i alla språk – syns tydligt i UI istället för att tystna
  if(vars)Object.keys(vars).forEach(k=>{str=str.replace(new RegExp("\\{"+k+"\\}","g"),vars[k]);});
  return str;
}
function setLang(newLang){
  lang=newLang;
  try{localStorage.setItem("div2ng_lang",newLang);}catch(e){}
  render();
}
// Vilka språk admin har gjort tillgängliga för den här serien. Svenska kan
// inte döljas (måste alltid finnas minst ett språk kvar) – engelska och
// grekiska är valfria att slå av/på i admin, precis som spelformerna.
function availableLangCodes(){
  const codes=["sv"];
  if(cfg.langEnEnabled) codes.push("en");
  if(cfg.langGrEnabled) codes.push("gr");
  return codes;
}
// Appens produktnamn beror på vilken domän man besöker – samma logik som sätter
// sidtiteln i huvud-scriptet, men den variabeln når inte hit (annan <script>-tagg).
function getAppName(){
  return window.location.hostname.includes("bonnboll") ? "Bonnboll Play" : "Div2NG Play";
}
// Bygger Swish-betalningslänken. Om inget belopp är satt (fritt belopp) utelämnas
// &amt= helt, vilket gör att mottagaren själv fyller i beloppet i Swish-appen –
// exakt så Swish egna QR-generator för företag fungerar också.
function buildSwishUrl(swishNumber,amount,message){
  let url=`https://app.swish.nu/1/p/sw/?sw=${encodeURIComponent(swishNumber||"")}`;
  if(amount) url+=`&amt=${encodeURIComponent(amount)}`;
  url+=`&cur=SEK&msg=${encodeURIComponent(message||"")}`;
  return url;
}
function swishButtonLabel(amount){
  return amount ? t("stod.swishButtonAmount",{amount}) : t("stod.swishButtonFree");
}
function buildPaypalUrl(handle,amount){
  if(!handle) return "";
  let url=`https://paypal.me/${encodeURIComponent(handle)}`;
  if(amount) url+=`/${encodeURIComponent(amount)}`;
  return url;
}
function paypalButtonLabel(amount){
  return amount ? t("stod.paypalButtonAmount",{amount}) : t("stod.paypalButtonFree");
}
// Svenska användare (lang==="sv") ser Swish, alla andra ser PayPal.me –
// Swish fungerar bara i Sverige så det är den rimliga defaulten per språk.
function supportMethod(){
  return lang==="sv" ? "swish" : "paypal";
}
function toDatetimeLocal(iso){
  const d=new Date(iso);
  if(isNaN(d))return"";
  const pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// En omgång räknas som låst antingen om admin manuellt låst den (rd.locked)
// ELLER om spelstopp-deadlinen (rd.lock_deadline) har passerat – oavsett om
// admin hunnit klicka "lås" eller inte. Detta är den enda källan till sanning
// för "är omgången låst?" och används genomgående istället för att bara
// kolla rd.locked direkt.
function isRoundLocked(rd){
  if(!rd) return false;
  if(rd.locked) return true;
  if(rd.lock_deadline && new Date(rd.lock_deadline)<=new Date()) return true;
  return false;
}
function formatCountdown(deadlineIso){
  const diff=new Date(deadlineIso)-new Date();
  if(diff<=0)return t("countdown.passed");
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000), m=Math.floor(diff%3600000/60000);
  if(d>0)return t("countdown.days",{d,h,m});
  if(h>0)return t("countdown.hours",{h,m});
  return t("countdown.minutes",{m});
}
function updateCountdownEls(){
  document.querySelectorAll("[data-countdown-deadline]").forEach(el=>{
    el.textContent=formatCountdown(el.dataset.countdownDeadline);
  });
}

function render(){
  // Säkerhetsspärr: om användarens sparade språkval har dolts av admin
  // (t.ex. engelska stängdes av) faller vi tillbaka till svenska istället
  // för att visa en trasig blandning av dolda översättningar.
  if(currentLeague && !availableLangCodes().includes(lang)){
    lang="sv";
    try{localStorage.setItem("div2ng_lang","sv");}catch(e){}
  }
  const root=document.getElementById("fg-root");
  if(screen==="leagues")root.innerHTML=renderLeagues();
  else if(screen==="home")root.innerHTML=renderHome();
  else if(screen==="reg")root.innerHTML=renderReg();
  else if(screen==="unassigned-reg")root.innerHTML=renderUnassignedReg();
  else if(screen==="unassigned")root.innerHTML=renderUnassignedHome();
  else if(screen==="mode")root.innerHTML=renderModeSelect();
  else if(screen==="pick"){root.innerHTML=renderPick();
    // Sök-hook: re-renderar bara spellistan utan att hoppa till toppen
    window._playerSearchRender=()=>{
      const list=document.getElementById("player-list");
      if(list){
        const searchVal=document.getElementById("player-search")?.value.toLowerCase()||"";
        pickTeamFilter=document.getElementById("team-filter")?.value||"";
        const teamFilter=pickTeamFilter;
        const usedTeams=(currentUser&&currentUser.activeChip==="frittlag")?[]:usedTeamIds(null);
        const filtered=players.filter(p=>{
          if(p.pos!==pickPos)return false;
          if(searchVal&&!p.namn.toLowerCase().includes(searchVal))return false;
          if(teamFilter&&String(p.teamId)!==teamFilter)return false;
          return true;
        });
        const picks=currentUser.picks||{GK:[],DEF:[],MID:[],FW:[]};
        const kap=currentUser.kapten;
        list.innerHTML=filtered.map(p=>{
          const sel=(picks[p.pos]||[]).includes(p.id);
          const isCap=kap===p.id;
          const team=TEAMS.find(t=>t.id===p.teamId);
          const c=POS_COLOR[p.pos];
          const teamTaken=!sel&&usedTeams.includes(p.teamId);

function renderLeagueGroups(list){
  if(!list.length) return `<div style="font-size:13px;color:var(--color-text-secondary);text-align:center">${esc(t("landing.noLeaguesMatch"))}</div>`;
  const groups={};
  const order=[];
  list.forEach(l=>{
    const m=l.name.match(/^Div\s*(\d+)/i);
    const key=m?`Div${m[1]}`:t("landing.otherSeriesGroup");
    if(!groups[key]){groups[key]=[];order.push(key);}
    groups[key].push(l);
  });
  order.sort((a,b)=>{
    const na=a.match(/^Div(\d+)$/), nb=b.match(/^Div(\d+)$/);
    if(na&&nb) return Number(na[1])-Number(nb[1]);
    if(na) return -1;
    if(nb) return 1;
    return a.localeCompare(b);
  });
  return order.map(key=>{
    const items=groups[key];
    const rows=items.map(l=>`
      <button class="fg-card" data-act="choose-league" data-id="${l.id}" style="display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;border:0.5px solid var(--color-border-tertiary);margin-bottom:8px">
        <div style="width:40px;height:40px;border-radius:10px;background:${G_GREENL};color:${G_GREEN};display:flex;align-items:center;justify-content:center;font-size:18px">🏆</div>
        <div style="flex:1"><div style="font-weight:500;font-size:15px">${esc(l.name)}</div></div>
        <span style="color:var(--color-text-secondary)">›</span>
      </button>`).join("");
    return `<details open style="margin-bottom:10px;text-align:left">
      <summary style="cursor:pointer;font-weight:600;font-size:13px;padding:6px 0;color:var(--color-text-primary)">${esc(key)} <span style="font-weight:400;color:var(--color-text-secondary)">(${items.length})</span></summary>
      <div style="margin-top:6px">${rows}</div>
    </details>`;
  }).join("");
}

window._doEntrySearch=function(){
  clearTimeout(window._entrySearchTimer);
  window._entrySearchTimer=setTimeout(async()=>{
    const q=(document.getElementById("entry-search")?.value||"").trim();
    const resultsEl=document.getElementById("entry-search-results");
    if(!resultsEl)return;
    if(!q||q.length<2){resultsEl.innerHTML="";return;}
    resultsEl.innerHTML=`<div style="font-size:12px;color:var(--color-text-secondary);text-align:center;padding:8px">${esc(t("entrySearch.searching"))}</div>`;
    try{
      const [assignedRes,unassignedRes]=await Promise.all([
        sb.from("fantasy_users").select("id,namn,league_id").ilike("namn","%"+q+"%").in("league_id",leagues.map(l=>l.id)).limit(20),
        sb.from("fantasy_users").select("id,namn,requested_league_name").ilike("namn","%"+q+"%").is("league_id",null).limit(10)
      ]);
      const assigned=assignedRes.data||[];
      const unassigned=unassignedRes.data||[];
      if(!assigned.length && !unassigned.length){
        resultsEl.innerHTML=`<div style="font-size:13px;color:var(--color-text-secondary);text-align:center;padding:8px">${esc(t("entrySearch.noMatch"))}</div>`;
        return;
      }
      const assignedHtml=assigned.map(u=>{
        const lg=leagues.find(l=>l.id===u.league_id);
        return `<button data-act="entry-pick-user" data-id="${u.id}" data-league-id="${u.league_id}" data-namn="${esc(u.namn)}" class="fg-card" style="display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;border:0.5px solid var(--color-border-tertiary);margin-bottom:8px">

          <span style="color:var(--color-text-secondary)">›</span>
        </button>`;
      }).join("");
      const unassignedHtml=unassigned.map(u=>`
        <button data-act="entry-pick-unassigned" data-id="${u.id}" data-namn="${esc(u.namn)}" class="fg-card" style="display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;border:0.5px solid var(--color-border-tertiary);margin-bottom:8px">

          <div style="flex:1"><div style="font-weight:500;font-size:14px">${esc(u.namn)}</div><div style="font-size:11px;color:var(--color-text-secondary)">${esc(t("entrySearch.waitingForLeague"))}</div></div>
          <span style="color:var(--color-text-secondary)">›</span>
        </button>`).join("");
      resultsEl.innerHTML=assignedHtml+unassignedHtml;
      attachHandlers();
    }catch(e){
      console.error(e);
      resultsEl.innerHTML=`<div style="font-size:12px;color:#A32D2D;text-align:center;padding:8px">${esc(t("entrySearch.error"))}</div>`;
    }
  },300);
};

function pickMissingText(){
  const missing = POSITIONS.filter(pos=>(pickState.picks[pos]||[]).length < POS_COUNT[pos]);
  if(missing.length) return t("pick.missingPrefix")+missing.map(p=>{
    const have=(pickState.picks[p]||[]).length;
    return `${posLabel(p)} (${have}/${POS_COUNT[p]})`;
  }).join(", ");
  if(!pickState.kapten) return t("pick.missingCaptain");
  return "";
}

function usedTeamIds(excludePid){
  let ids=[];
  POSITIONS.forEach(pos=>{ (pickState.picks[pos]||[]).forEach(pid=>{ if(pid!==excludePid)ids.push(pid); }); });
  return ids.map(pid=>{const p=players.find(x=>x.id===pid);return p?p.teamId:null;}).filter(x=>x!=null);
}

function renderPick(){
  const picks=pickState.picks, kap=pickState.kapten;

  const filtered=players.filter(p=>{
    if(p.pos!==pickPos) return false;
    if(searchVal && !p.namn.toLowerCase().includes(searchVal)) return false;
    if(teamFilter && String(p.teamId)!==teamFilter) return false;
    return true;

  const usedTeams = (currentUser&&currentUser.activeChip==="frittlag") ? [] : usedTeamIds(null);

  const posTabs=POSITIONS.map(pos=>{
    const have=(picks[pos]||[]).length, need=POS_COUNT[pos];
    const full=have>=need;

    const fc=full?POS_COLOR[pos].fc:"var(--color-text-secondary)";

      })():""}

    </div>`;
  }).join("");

  const missing = pickMissingText();

          const usedNow=[...oldIds].filter(id=>!newIds.has(id)).length;
          const available=currentUser.freeTransfers==null?1:currentUser.freeTransfers;
          const remaining=available-usedNow;
          const over=remaining<0;
          return `<div style="background:${over?"#fce8e8":G_GREENL};border-radius:6px;padding:10px 8px;text-align:center">

function rankFantasyMissingText(){
  const missing=POSITIONS.filter(pos=>(rankFantasyPickState.picks[pos]||[]).length<RANKFANTASY_SQUAD_SIZE[pos]);
  if(!missing.length) return "";
  return t("pick.missingPrefix")+missing.map(pos=>{
    const have=(rankFantasyPickState.picks[pos]||[]).length;
    return `${posLabel(pos)} (${have}/${RANKFANTASY_SQUAD_SIZE[pos]})`;
  }).join(", ");
}
function renderRankFantasyPick(){
  const picks=rankFantasyPickState.picks;
  const totalPicked=rankFantasyPickCount(picks);
  const mySquad=rankFantasySquads.find(s=>s.userId===currentUser.id);
  const searchVal=document.getElementById("rf-player-search")?document.getElementById("rf-player-search").value.toLowerCase():"";
  const teamFilter=rankFantasyTeamFilter||"";
  const filtered=players.filter(p=>{
    if(p.pos!==rankFantasyPickPos) return false;
    if(searchVal && !p.namn.toLowerCase().includes(searchVal)) return false;
    if(teamFilter && String(p.teamId)!==teamFilter) return false;
    return true;
  });
  // Max en spelare per LAG OCH POSITION – inte en spelare per lag totalt.
  // Med 14 lag och 14 platser skulle "en per lag totalt" tvinga fram exakt
  // en spelare från varje lag, vilket är för stelt. Här kollar vi bara om
  // laget redan har en spelare i just den position man tittar på nu.
  const usedTeamsInCurrentPos=(picks[rankFantasyPickPos]||[]).map(pid=>{const pl=players.find(p=>p.id===pid);return pl?pl.teamId:null;}).filter(Boolean);

  const posTabs=POSITIONS.map(pos=>{
    const have=(picks[pos]||[]).length, need=RANKFANTASY_SQUAD_SIZE[pos];
    const full=have>=need;
    const active=rankFantasyPickPos===pos;
    const bg=full?POS_COLOR[pos].bg:"var(--color-background-primary)";
    const fc=full?POS_COLOR[pos].fc:"var(--color-text-secondary)";
    return `<button data-act="rf-pos-tab" data-pos="${pos}" style="flex:1;padding:8px 2px;border-radius:6px;border:${active?`1.5px solid ${G_GREEN}`:"0.5px solid var(--color-border-secondary)"};background:${bg};color:${fc};font-size:11px;font-weight:500;cursor:pointer">${pos} ${have}/${need}</button>`;
  }).join("");

  const rows=filtered.map(p=>{
    const sel=(picks[p.pos]||[]).includes(p.id);
    const team=TEAMS.find(t=>t.id===p.teamId);
    const c=POS_COLOR[p.pos];
    const teamTaken=!sel&&usedTeamsInCurrentPos.includes(p.teamId);
    const posFull=!sel&&(picks[p.pos]||[]).length>=RANKFANTASY_SQUAD_SIZE[p.pos];
    const disabled=teamTaken||posFull;
    return `<div class="fg-card" style="margin-bottom:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;opacity:${disabled?0.45:1}">
      <div class="fg-posbadge" style="width:34px;height:34px;background:${c.bg};color:${c.fc};font-size:11px">${p.pos}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:${sel?500:400}">${esc(p.namn)}</div>
        <div style="font-size:12px;color:var(--color-text-secondary)">${esc(team?team.name:"")}${teamTaken?esc(t("rankfantasy.teamPositionTakenSuffix")):''}</div>
      </div>
      <button data-act="rf-pick-player" data-id="${p.id}" ${disabled?"disabled":""} style="width:32px;height:32px;border-radius:50%;background:${sel?G_GREENL:"var(--color-background-secondary)"};border:0.5px solid ${sel?G_GREEN:"#ccc"};color:${sel?G_GREEN:"var(--color-text-secondary)"};display:flex;align-items:center;justify-content:center;cursor:${disabled?"not-allowed":"pointer"};font-size:16px;flex-shrink:0">${sel?"✓":"+"}</button>
    </div>`;
  }).join("");

  const missing=rankFantasyMissingText();

  const transferCard=(mySquad&&mySquad.transferBaselinePicks)?(()=>{
    const oldIds=new Set(POSITIONS.flatMap(pos=>(mySquad.transferBaselinePicks[pos]||[])));
    const newIds=new Set(POSITIONS.flatMap(pos=>(picks[pos]||[])));
    const usedNow=[...oldIds].filter(id=>!newIds.has(id)).length;
    const available=mySquad.freeTransfers==null?1:mySquad.freeTransfers;
    const remaining=available-usedNow;
    const over=remaining<0;
    return `<div style="background:${over?"#fce8e8":G_GREENL};border-radius:6px;padding:10px 8px;text-align:center">
      <div style="font-size:11px;color:${over?"#A32D2D":G_GREEN}">${esc(t("pick.transfersLeftLabel"))}</div>
      <div style="font-size:18px;font-weight:500;color:${over?"#A32D2D":G_GREEN}">${remaining}</div>
    </div>`;
  })():"";

  // Lagöversikt – vilka lag har man plockat spelare ifrån, och på vilka positioner
  const teamGroups={};
  POSITIONS.forEach(pos=>{
    (picks[pos]||[]).forEach(pid=>{
      const pl=players.find(p=>p.id===pid);
      if(!pl) return;
      if(!teamGroups[pl.teamId]) teamGroups[pl.teamId]=[];
      teamGroups[pl.teamId].push(pos);
    });
  });
  const teamBadges=Object.keys(teamGroups).map(teamId=>{
    const team=TEAMS.find(tm=>tm.id===Number(teamId));
    if(!team) return"";
    const posList=teamGroups[teamId].join(", ");
    return `<span style="padding:5px 10px;border-radius:14px;font-size:11px;font-weight:500;white-space:nowrap;background:${S_GREENL};color:${S_GREEN};border:0.5px solid ${S_GREEN}">${esc(team.name)} <span style="opacity:0.75">(${posList})</span></span>`;
  }).join("");
  const teamsOverview=Object.keys(teamGroups).length?`<div class="fg-card" style="margin-bottom:10px">
    <div style="font-weight:500;font-size:12px;margin-bottom:8px">${esc(t("rankfantasy.teamsInSquad"))}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${teamBadges}</div>
  </div>`:"";

  return `
  <div style="min-height:100vh;padding-bottom:90px">
    <div class="fg-top">
      <button data-act="rf-back-to-main" style="background:none;border:none;color:#fff;cursor:pointer;font-size:20px;padding:0">←</button>
      <span style="font-weight:500;font-size:16px">${esc(t("rankfantasy.pickTitle"))}</span>
    </div>
    <div style="padding:12px 16px 0">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="rf-player-search" type="search" placeholder="${esc(t("pick.searchPlaceholder"))}" oninput="window._rfPlayerSearchRender&&window._rfPlayerSearchRender()" style="flex:1;padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:13px;background:var(--color-background-secondary)"/>
        <select id="rf-team-filter" onchange="window._rfPlayerSearchRender&&window._rfPlayerSearchRender()" style="padding:8px;border:0.5px solid var(--color-border-secondary);border-radius:8px;font-size:12px;background:var(--color-background-secondary);max-width:130px">
          <option value="" ${teamFilter===""?"selected":""}>${esc(t("pick.allTeams"))}</option>
          ${TEAMS.sort((a,b)=>a.name.localeCompare(b.name)).map(tm=>`<option value="${tm.id}" ${String(tm.id)===String(teamFilter)?"selected":""}>${esc(tm.name)}</option>`).join("")}
        </select>
      </div>
      ${renderRoundMatches(rounds[String(cfg.omg)])}
      <div style="display:grid;grid-template-columns:${transferCard?"1fr 1fr":"1fr"};gap:8px;margin-bottom:10px">
        <div style="background:var(--color-background-secondary);border-radius:6px;padding:10px 8px;text-align:center">
          <div style="font-size:11px;color:var(--color-text-secondary)">${esc(t("rankfantasy.squadSelected"))}</div>
          <div style="font-size:18px;font-weight:500">${totalPicked} / ${RANKFANTASY_TOTAL_SQUAD}</div>
        </div>
        ${transferCard}
      </div>
      ${teamsOverview}
      <div style="display:flex;gap:4px;margin-bottom:10px">${posTabs}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px">${esc(t("rankfantasy.maxOnePerTeamPerPos"))}</div>
      ${rankFantasyPickErr?`<div style="font-size:12px;color:#A32D2D;margin-bottom:8px;font-weight:500">${esc(rankFantasyPickErr)}</div>`:""}
      <div style="font-size:13px;font-weight:500;margin-bottom:6px">${esc(posLabel(rankFantasyPickPos))}</div>
    </div>
    <div id="rf-player-list" style="padding:0 16px">${rows||`<div style="font-size:13px;color:var(--color-text-secondary)">${esc(t("pick.noPlayersFound"))}</div>`}</div>
    <div style="position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:12px 16px;background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary)">
      ${missing?`<div style="font-size:12px;color:#A32D2D;margin-bottom:8px;text-align:center;font-weight:500">${esc(missing)}</div>`:""}
      ${totalPicked>0?`<button data-act="rf-clear-squad" class="fg-outbtn" style="width:100%;margin-bottom:8px">${esc(t("pick.clearAll"))}</button>`:""}
      <button class="fg-btn" data-act="rf-save-squad">${esc(t("rankfantasy.saveSquad"))}</button>
    </div>
  </div>`;
}

        return `<button data-act="user-jump-round" data-r="${r}" style="height:26px;border-radius:5px;border:none;background:${bg};color:${col};font-size:11px;font-weight:${isActive?700:500};cursor:pointer;width:100%">${r}</button>`;
