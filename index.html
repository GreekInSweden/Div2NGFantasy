window._anytimePickChange=function(sel){
  const pos=sel.dataset.pos, slot=Number(sel.dataset.slot);
  const val=sel.value?sel.value:null;
  const arr=[...(anytimeDraft[pos]||[])];
  arr[slot]=val;
  anytimeDraft={...anytimeDraft,[pos]:arr};
  render();
};
window.saveAnytime=async function(){
  if(blockIfTrialExpired())return;
  const statusEl=document.getElementById("anytime-status");
  const picks={DEF:[],MID:[],FW:[]};
  let missing=0;
  document.querySelectorAll('select[data-pos]').forEach(sel=>{
    const pos=sel.dataset.pos, slot=Number(sel.dataset.slot);
    const val=sel.value?sel.value:null;
    if(!val) missing++;
    picks[pos][slot]=val;
  });
  if(missing>0){
    if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Fyll i alla 5 platser innan du sparar.</span>';
    return;
  }
  const allIds=[...picks.DEF,...picks.MID,...picks.FW];
  if(new Set(allIds).size!==allIds.length){
    if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Du kan inte välja samma spelare två gånger.</span>';
    return;
  }
  if(statusEl) statusEl.textContent="Sparar…";
  try{
    const error=await saveAnytimeTip(cfg.omg,picks);
    if(error){ if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Fel: '+error.message+'</span>'; return; }
    anytimeMyTips={...anytimeMyTips,[cfg.omg]:picks};
    const idx=anytimeAllTipsGlobal.findIndex(t=>t.user_id===currentUser.id&&Number(t.round_num)===Number(cfg.omg));
    const row={user_id:currentUser.id,round_num:cfg.omg,picks};
    if(idx>=0) anytimeAllTipsGlobal[idx]=row; else anytimeAllTipsGlobal=[...anytimeAllTipsGlobal,row];
    anytimeDraft={...picks};
    if(statusEl) statusEl.innerHTML='<span style="color:#1a6b3c;font-weight:500">✓ Val sparade!</span>';
  }catch(e){
    if(statusEl) statusEl.innerHTML='<span style="color:#A32D2D">Fel: '+e.message+'</span>';
  }
};
function renderQuizTab(){
  const rnd=cfg.omg;
  const qs=quizQuestions.filter(q=>q.round_num===rnd); // bara denna omgångs frågor
  const answers=quizMyAnswers;
  const answeredAll=qs.length>0&&qs.every(q=>answers[q.id]);
  const timeLeft=qs.length>0?getQuizTimeLeft(rnd):300;
  const timedOut=timeLeft<=0;
  const done=answeredAll||timedOut;
  const pts=calcQuizPts(qs,answers);
  const allAnswers=window._quizAllAnswers||[];
  const allQs=quizQuestions;

  // Start timer if quiz is open and not done
  if(qs.length>0&&!done){
    startQuizTimer(rnd);
  } else {
    stopQuizTimer();
  }

  if(!qs.length) return `
    <div style="font-weight:500;font-size:16px;margin-bottom:12px">🧠 ${esc(currentLeague.name)} Quiz</div>
    <div class="fg-card" style="text-align:center;padding:30px 16px">
      <div style="font-size:40px;margin-bottom:12px">🧠</div>
      <div style="font-weight:500;margin-bottom:8px">Inga frågor den här omgången ännu</div>
      <div style="font-size:13px;color:var(--color-text-secondary)">Admin lägger in frågor inför varje omgång.</div>
    </div>`;

  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const timerColor=timeLeft<=30?"#c1272d":timeLeft<=60?"#e65100":"var(--color-text-primary)";

  const questionCards=qs.map((q,i)=>{
    const myAns=answers[q.id];
    const locked=!!myAns||done;
    const isCorrect=myAns===q.correct;

    const altBtn=(val,label)=>{
      const chosen=myAns===val;
      const correct=done&&q.correct===val;
      const wrong=done&&chosen&&!isCorrect&&val===myAns;
      let bg="var(--color-background-secondary)";
      let border="var(--color-border-secondary)";
      let col="var(--color-text-primary)";
      if(correct){bg="#e8f5ee";border="#1a6b3c";col="#1a6b3c";}
      else if(wrong){bg="#fce8e8";border="#c1272d";col="#c1272d";}
      else if(chosen&&!done){bg=G_GREENL;border=G_GREEN;col=G_GREEN;}
      return `<button data-act="quiz-answer" data-qid="${q.id}" data-ans="${val}" data-rnd="${rnd}" ${locked?"disabled":""} style="flex:1;padding:10px 6px;border-radius:8px;border:1.5px solid ${border};background:${bg};color:${col};font-size:13px;font-weight:500;cursor:${locked?"default":"pointer"};transition:.15s">
        <div style="font-weight:700;font-size:11px;margin-bottom:2px">${val}</div>
        <div style="font-size:12px">${esc(label)}</div>
      </button>`;
    };

    const statusBadge=myAns?(isCorrect?`<span style="color:#1a6b3c;font-size:12px;font-weight:500">✓ Rätt! +1p</span>`:`<span style="color:#c1272d;font-size:12px;font-weight:500">✗ Fel (rätt: ${q.correct})</span>`):(done?`<span style="color:var(--color-text-secondary);font-size:12px">Ej besvarad – 0p</span>`:"");

    return `<div class="fg-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div style="font-size:11px;color:var(--color-text-secondary)">Fråga ${i+1} av ${qs.length}</div>
        ${statusBadge}
      </div>
      <div style="font-size:15px;font-weight:500;margin-bottom:14px;line-height:1.4">${esc(q.question)}</div>
      <div style="display:flex;gap:8px">
        ${altBtn("1",q.alt1)}
        ${altBtn("X",q.altx)}
        ${altBtn("2",q.alt2)}
      </div>
    </div>`;
  }).join("");

  // Topplista
  const medals=["🥇","🥈","🥉"];
  const quizSorted=[...users].filter(u=>allAnswers.some(a=>a.user_id===u.id)).sort((a,b)=>userQuizTotalPts(b.id,allAnswers,allQs)-userQuizTotalPts(a.id,allAnswers,allQs));
  const quizLeaderboard=`<div class="fg-card">
    <div style="font-weight:500;margin-bottom:10px">🏆 Topplista – ${esc(currentLeague.name)} Quiz</div>
    ${quizSorted.map((u,i)=>{
      const p=userQuizTotalPts(u.id,allAnswers,allQs);
      const isMe=u.id===currentUser.id;

  ${renderPrivateLeagueSection("quiz")}`;

function renderStreakTab(){
  const rd=rounds[String(cfg.omg)];
  const matches=rd?.matches||[];
  const locked=rd?.locked||false;
  const published=rd?.results_published||false;
  const myTip=streakMyTips.find(t=>t.round_num===cfg.omg);
  const publishedRounds=Object.keys(rounds).filter(r=>rounds[r].results_published).map(Number);
  const {current,best}=calcUserStreak(streakAllTips,currentUser.id,publishedRounds);

  // Streak-status
  const streakBar=`<div class="fg-card" style="display:flex;gap:0;padding:0;overflow:hidden">
    <div style="flex:1;padding:14px;text-align:center;border-right:0.5px solid var(--color-border-tertiary)">
      <div style="font-size:28px;font-weight:700;color:#e65100">${current}🔥</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">Aktiv streak</div>
    </div>
    <div style="flex:1;padding:14px;text-align:center">
      <div style="font-size:28px;font-weight:700;color:${G_GREEN}">${best}</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">Bästa streak</div>
    </div>
  </div>`;

  // Visa resultatet om publicerat
  if(published&&myTip){
    const picks=myTip.picks||{};
    const picksHtml=Object.entries(picks).map(([mIdx,sign])=>{
      const m=matches[Number(mIdx)];
      if(!m)return"";
      const h=TEAMS.find(t=>t.id===m.hId),a=TEAMS.find(t=>t.id===m.aId);
      const hg=rd.goals?.[m.id]?.h??m.hMål;const ag=rd.goals?.[m.id]?.a??m.aMål;
      const actual=hg>ag?"1":hg<ag?"2":"X";
      const correct=sign===actual;
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <span style="font-size:18px">${correct?"✅":"❌"}</span>
        <div style="flex:1;font-size:13px">${esc(h?.name||"")} – ${esc(a?.name||"")}</div>
        <span style="font-weight:500">${sign}</span>
        <span style="font-size:12px;color:var(--color-text-secondary)">(${actual})</span>
      </div>`;
    }).join("");
    return `${streakBar}
    <div class="fg-card">
      <div style="font-weight:500;margin-bottom:8px">🔥 Omgång ${cfg.omg} – ditt tips</div>
      ${picksHtml}
      <div style="padding-top:8px;font-weight:600;color:${myTip.correct?G_GREEN:"#c1272d"}">
        ${myTip.correct?"✅ Alla 3 rätt – streak fortsätter!":"❌ Streak nollställd"}
      </div>
    </div>
    ${renderPrivateLeagueSection("streak")}`;
  }

  // Välj matcher
  if(myTip&&!published&&!streakEditing){
    const picks=myTip.picks||{};
    const picksHtml=Object.entries(picks).map(([mIdx,sign])=>{
      const m=matches[Number(mIdx)];
      const h=TEAMS.find(t=>t.id===m?.hId),a=TEAMS.find(t=>t.id===m?.aId);
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px">
        <div style="flex:1">${esc(h?.name||"")} – ${esc(a?.name||"")}</div>
        <span style="font-weight:600;background:#1a1a1a;color:#fff;border-radius:4px;padding:2px 8px">${sign}</span>
      </div>`}).join("");
    return `${streakBar}
    <div class="fg-card" style="background:${S_GREENL};border:1px solid ${S_GREEN}">
      <div style="font-weight:500;margin-bottom:8px;color:${S_GREEN}">✅ Tips inlämnat – Omgång ${cfg.omg}</div>
      ${picksHtml}
      ${!locked?`<button data-act="streak-edit" style="margin-top:12px;background:none;border:0.5px solid ${S_GREEN};color:${S_GREEN};border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;width:100%">✏️ Ändra mitt tips</button>`:""}
    </div>
    ${renderPrivateLeagueSection("streak")}`;
  }

  if(locked&&!myTip){
    return `${streakBar}
    <div class="fg-card" style="text-align:center;padding:24px">
      <div style="font-size:32px;margin-bottom:8px">🔒</div>
      <div style="font-weight:500">Tippningen är stängd</div>
      <div style="font-size:13px;color:var(--color-text-secondary);margin-top:4px">Streak nollställs om du inte tippat.</div>
    </div>`;
  }

  if(!matches.length){
    return `${streakBar}
    <div class="fg-card" style="text-align:center;padding:24px">
      <div style="font-size:32px">📅</div>
      <div style="font-weight:500;margin-top:8px">Inga matcher för omgång ${cfg.omg} ännu</div>
      <div style="font-size:11px;color:#999;margin:8px 0;font-family:monospace">
        cfg.omg=${cfg.omg} · rounds=${Object.keys(rounds).join(",")} · rd=${rd?"finns":"saknas"}
      </div>
      <button data-act="streak-reload" style="background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px">🔄 Ladda om matcher</button>
    </div>`;
  }

  // Väljargränssnittet
  const draft=streakDraft;
  const selected=Object.keys(draft).length;
  const matchCards=matches.map((m,i)=>{
    const h=TEAMS.find(t=>t.id===m.hId),a=TEAMS.find(t=>t.id===m.aId);
    const picked=draft[i]!==undefined;
    const signs=["1","X","2"];
    return `<div class="fg-card" style="margin-bottom:8px;border:${picked?`1.5px solid ${G_GREEN}`:"0.5px solid var(--color-border-tertiary)"}">
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;text-align:center">${esc(h?.name||"")} – ${esc(a?.name||"")}</div>
      <div style="display:flex;gap:6px">
        ${signs.map(s=>`<button data-act="streak-pick" data-idx="${i}" data-sign="${s}"
          style="flex:1;padding:8px;border-radius:6px;border:1.5px solid ${draft[i]===s?G_GREEN:"var(--color-border-secondary)"};
          background:${draft[i]===s?G_GREENL:"var(--color-background-primary)"};
          color:${draft[i]===s?G_GREEN:"var(--color-text-secondary)"};
          font-weight:${draft[i]===s?700:400};cursor:pointer;font-size:14px">${s}</button>`).join("")}
      </div>
    </div>`;
  }).join("");

  return `${streakBar}
  <div style="font-weight:500;font-size:15px;margin-bottom:4px">🔥 Streak – Omgång ${cfg.omg}</div>
  <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:12px">Välj <b>3 matcher</b> och tippa 1, X eller 2. Alla 3 rätt = streak fortsätter!</div>
  ${matchCards}
  <button class="fg-btn" data-act="submit-streak" ${selected<3?"disabled":""} style="margin-top:4px;${selected<3?"opacity:0.5":""}">
    ${selected<3?`Välj ${3-selected} match${3-selected===1?"":"er"} till`:"✅ Lämna in tips"}
  </button>`;
}

function getTeamForRound(u,r){
  const rd=rounds[String(r)];
  const snapshot=rd&&rd.picks_snapshot&&rd.picks_snapshot[u.id];
  return {
    picks: snapshot?snapshot.picks:u.picks,
    kapten: snapshot?snapshot.kapten:u.kapten
  };
}
function renderTeamPitchView(u,r){

            <div style="font-size:12.5px;font-weight:600;color:#1a1a1a;line-height:1.3;word-break:break-word">${esc(pl.namn)}</div>
            <div style="font-size:10.5px;color:#888;line-height:1.25;margin-top:3px;word-break:break-word">${esc(team?team.name:"")}</div>
          </div>
          <div style="margin-top:5px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,0.35);border-radius:10px;padding:2px 9px;display:inline-block">${resultsShown?(isCap?pts*2:pts):"–"}p</div>

        ${posRow("GK")}
      </div>

  return `

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">

  </div>
  <div class="fg-card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

    <div style="text-align:center">
      <div style="font-weight:500;font-size:14px">Omgång ${r}</div>

  else if(appMode==="jubel"){title="📊 Båda får Jubla-ligan";getPts=u=>userJubelTotalPts(u.id);subText=u=>`${userJubelTotalPts(u.id)} p totalt`;hasPlayed=u=>jubelAllTipsGlobal.some(t=>t.user_id===u.id);}

      return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;${isMe?"font-weight:500":""}">
        <span>${esc(u.namn)}${isMe?" (du)":""}</span><span>${pts} p</span>
      </div>`;
    }).join(""):"";

    return `<div class="fg-card" style="margin-top:10px">
      <div style="font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between">
        <span>Omgång ${r}</span>
        ${rd.results_published?`<span style="font-size:12px;color:${S_AMBER}">✅ Resultat klara</span>`:rd.locked?`<span style="font-size:12px;color:#c1272d">🔒 Stängd</span>`:`<span style="font-size:12px;color:${S_GREEN}">🟢 Öppen</span>`}
      </div>
      ${matchRows||'<div style="font-size:13px;color:var(--color-text-secondary)">Matcher ej inlagda.</div>'}
      ${rd.results_published?`<div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--color-border-tertiary)">
        <div style="font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px">Fantasy-poäng</div>${ptsRows}
      </div>`:""}
    </div>`;
  }).join("");

  if(!keys.length) return `
    <div style="font-weight:500;font-size:16px;margin-bottom:12px">📅 Omgångar</div>
    <div class="fg-card" style="text-align:center;color:var(--color-text-secondary);font-size:13px">Inga omgångar inlagda ännu.</div>`;

  return `
  <div style="font-weight:500;font-size:16px;margin-bottom:12px">📅 Omgångar</div>
  <div class="fg-card">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${gridBtns}</div>
    ${legend}
  </div>
  ${details}`;
}

function adminDefaultRound(){
  // Hitta första öppna (ej låsta) omgången, annars senaste inlagda
  const keys=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const firstOpen=keys.find(r=>!rounds[String(r)].locked);
  if(firstOpen) return String(firstOpen);
  if(keys.length) return String(keys[keys.length-1]);
  return String(cfg.omg);
}

function defaultBulkRows(rndKey){
  const existing = rounds[rndKey];
  if(existing && existing.matches.length){
    return existing.matches.map(m=>({hId:m.hId,aId:m.aId,hMål:m.hMål,aMål:m.aMål}));
  }
  const rows=[];
  for(let i=0;i<TEAMS.length;i+=2){
    if(TEAMS[i+1]) rows.push({hId:TEAMS[i].id,aId:TEAMS[i+1].id,hMål:0,aMål:0});
  }
  return rows;
}

// Tolkar en inklistrad spelarlista på ett av två format:
//
// A) Strukturerat, en spelare per rad: "Namn;Position;Lag" (semikolon, komma eller
//    tab som avgränsare – funkar även klistrat direkt från Excel/Sheets).
//
// B) "Rörig" webblista – t.ex. kopierad rakt av från en klubbs spelartrupp-sida,
//    där varje spelare ligger på flera separata rader (namn, ev. tröjnummer,
//    ev. nationalitet, ålder) och grupperas under rubriker som "Målvakter",
//    "Försvarare" osv. Detta format saknar helt lag-info (hela listan är ju en
//    och samma klubb) – lag väljs istället en gång för alla i granskningsvyn.
//
// Appen avgör automatiskt vilket format det är: hittas semikolon/tab i texten
// tolkas den som (A), annars som (B).
// Tolkar en inklistrad laglista till bara lagnamnen – klarar både en ren lista
// (ett lagnamn per rad) och en hel tabell klistrad från en webbsida med
// rangordning och statistik-kolumner, t.ex.:
//   1.	Arsenal	0	0	0	0	0-0	0
//   2.	Aston Villa	0	0	0	0	0-0	0
// Om raderna innehåller tabbar plockas det första fältet som innehåller minst
// en bokstav (dvs varken rangordningssiffran eller poäng/resultat-kolumnerna).
// Utan tabbar tas hela raden, med en eventuell ledande rangordningssiffra
// ("1.", "1)", "1 ") bortstädad.
function parseTeamNamesText(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const linkPattern=/^\[(.+?)\]\(.*\)$/;
  if(lines.some(l=>linkPattern.test(l))){
    return lines.filter(l=>linkPattern.test(l)).map(l=>l.match(linkPattern)[1].trim()).filter(Boolean);
  }
  const hasTabs=lines.some(l=>l.includes("\t"));
  let result;
  if(hasTabs){
    result=lines.map(line=>{
      const fields=line.split("\t").map(f=>f.trim());
      const nameField=fields.find(f=>/[A-Za-zÀ-ÖØ-öø-ÿÅÄÖåäö]/.test(f));
      return nameField||fields[0]||"";
    }).filter(Boolean);
  } else {
    result=lines.map(line=>line.replace(/^\d+[.)]?\s+/,"").trim()).filter(Boolean);
  }
  // Om allt klistrades in på en enda rad separerat med komma/semikolon, dela upp det
  if(result.length===1&&/[,;]/.test(result[0])){
    result=result[0].split(/[,;]/).map(s=>s.trim()).filter(s=>s.length>0);
  }
  return result;
}
// Säkerhetsnät som körs EFTER vilken underparser som helst (strukturerad,
// block, bullet-länk eller kort-format) – städar bort skräp som läckt
// igenom (landskoder, etiketter typ "Birth date", rena siffror, kända
// nationaliteter) och slår ihop namn-fragment ("Manuel"/"Neuer") med den
// fullständiga formen ("Manuel Neuer") om den dyker upp inom några rader
// på samma position. Detta fångar dubblett-/fragmentproblem även om
// formatdetekteringen skulle välja fel underparser för en okänd sajts
// struktur (t.ex. om texten saknar markdown-länkar helt och faller igenom
// till den enklaste block-parsern).
function isJunkPlayerName(namn){
  const n=(namn||"").trim();
  if(!n)return true;
  if(/^\d+$/.test(n))return true; // rent tröjnummer
  if(/^[a-zA-ZÀ-ÿ]{2}$/.test(n))return true; // tvåbokstavs-landskod, t.ex. "de"
  const norm=n.toLowerCase();
  if(["birth date","country","appearances","goal","goals","height","weight","preferred foot","market value","position"].includes(norm))return true;
  if(isNationalityText(n))return true;
  return false;
}
function coalesceNameFragments(rows){
  const cleaned=rows.filter(r=>!isJunkPlayerName(r.namn));
  const normNoSpace=s=>s.replace(/\s+/g,"").toLowerCase();
  const drop=new Array(cleaned.length).fill(false);
  for(let i=0;i<cleaned.length;i++){
    if(drop[i])continue;
    for(let j=i+1;j<Math.min(i+4,cleaned.length);j++){
      if(drop[j])continue;
      if(cleaned[j].pos!==cleaned[i].pos)continue;
      const ni=normNoSpace(cleaned[i].namn), nj=normNoSpace(cleaned[j].namn);
      if(ni===nj){ drop[j]=true; continue; } // exakt dubblett
      if(nj.includes(ni)&&nj.length>ni.length){ drop[i]=true; break; } // i är ett fragment av j (j är fylligare)
      if(ni.includes(nj)&&ni.length>nj.length){ drop[j]=true; } // j är ett fragment av i
    }
  }
  return cleaned.filter((_,idx)=>!drop[idx]);
}
// Tolkar "tabell-format" som fotmob.com – varje spelare är uppdelad i flera
// rader (troligen från en HTML-tabell där varje cell blir en egen rad vid
// kopiering): NAMN, ev. en skaderad-beskrivning ("Sträckning baksida lår -
// Mitten av augusti 2026"), POSITIONSKOD(ER) (svenska förkortningar som
// "MV"/"MB, VM"/"DM, AM, M, HY", eller helt utstavat "Målvakt"/"Mittfältare"
// för spelare med bara en position), LAND, och till sist tröjnummer/ålder/
// längd/övergångsvärde tabbseparerat på en rad. Vi använder positionsraden
// som ankare och letar namnet bakåt – hoppar över en ev. skaderad-rad genom
// att känna igen att den innehåller " - " (mellanslag-bindestreck-mellanslag,
// vanligt i skadebeskrivningar, ovanligt i spelarnamn). Tränare ("Tränare"
// som position) matchar inget känt positionsord och utesluts därför
// automatiskt utan särskild specialhantering.
const POSITION_CODE_MAP={mv:"GK",mb:"DEF",vb:"DEF",hb:"DEF",dm:"MID",m:"MID",am:"MID",vm:"MID",hm:"MID",vy:"FW",hy:"FW",a:"FW"};
const POSITION_WORD_MAP={"målvakt":"GK","försvarare":"DEF","mittfältare":"MID","anfallare":"FW"};
function isPositionTableLine(line){
  const c=line.trim();
  if(!c)return false;
  if(POSITION_WORD_MAP[c.toLowerCase()])return true;
  const codes=c.split(",").map(s=>s.trim().toLowerCase());
  return codes.length>0&&codes.every(code=>POSITION_CODE_MAP[code]);
}
function mapPositionTableLine(line){
  const c=line.trim().toLowerCase();
  if(POSITION_WORD_MAP[c])return POSITION_WORD_MAP[c];
  const codes=c.split(",").map(s=>s.trim());
  return POSITION_CODE_MAP[codes[0]]||null; // första koden = huvudposition
}
function parsePlayersTableFormat(lines){
  const headerJunk=new Set(["översikt","tabell","matcher","trupp","spelarstatistik","lagstatistik","övergångar","historik","nyheter","spelare","position","land","tröja","ålder","längd","övergångsvärde"]);
  const out=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line||headerJunk.has(line.toLowerCase()))continue;
    if(!isPositionTableLine(line))continue; // vi utgår ifrån positionsraden
    const pos=mapPositionTableLine(line);
    if(!pos)continue; // t.ex. "Tränare" – utesluts automatiskt
    let j=i-1;
    while(j>=0&&(!lines[j].trim()||headerJunk.has(lines[j].trim().toLowerCase())))j--;
    if(j<0)continue;
    let nameLine=lines[j].trim();
    if(nameLine.includes(" - ")){ // skaderad-beskrivning – gå ytterligare en rad bakåt
      j--;
      while(j>=0&&!lines[j].trim())j--;
      if(j<0)continue;
      nameLine=lines[j].trim();
    }
    if(!nameLine||isPositionTableLine(nameLine))continue; // säkerhetskoll
    out.push({namn:nameLine,pos,posMatched:true,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false});
  }
  return out;
}
// Tolkar Transfermarkt-format – varje spelare inleds med NAMNET UPPREPAT
// TVÅ GÅNGER, tabbseparerat, på samma rad ("Josep Martínez\tJosep Martínez"),
// följt av en egen positionsrad med fullt utskriven position på engelska
// ("Goalkeeper","Centre-Back","Defensive Midfield","Central Midfield",
// "Attacking Midfield","Left/Right Midfield","Centre-Forward","Left/Right
// Winger","Second Striker"). Resten (ålder, nationalitet – ibland på TVÅ
// rader vid dubbelt medborgarskap, kontraktsdatum, marknadsvärde,
// tröjnummer, ev. utlåningsklubb) hoppas över automatiskt eftersom vi bara
// letar efter nästa namn-dubblett-rad som nästa ankare, utan att behöva
// känna till exakt hur många brus-rader som ligger emellan. Samma
// positionsvokabulär används genomgående på hela transfermarkt.com, oavsett
// liga, så denna parser bör funka för fler ligor än bara Serie A.
const TM_POSITION_MAP={
  goalkeeper:"GK",
  "centre-back":"DEF","center-back":"DEF","left-back":"DEF","right-back":"DEF","sweeper":"DEF",
  "defensive midfield":"MID","central midfield":"MID","right midfield":"MID","left midfield":"MID","attacking midfield":"MID",
  "left winger":"FW","right winger":"FW","centre-forward":"FW","center-forward":"FW","second striker":"FW"
};
// Separatorn mellan de dubblerade namnen kan vara antingen en tabb ELLER
// flera mellanslag i rad – beroende på webbläsare/OS vid kopiering ger
// tabellceller olika whitespace. Vi splittar på båda för säkerhets skull.
const TM_NAME_SPLIT=/\t+|\s{2,}/;
function isTransfermarktNameLine(line){
  const parts=line.split(TM_NAME_SPLIT).map(p=>p.trim()).filter(p=>p.length>0);
  return parts.length===2&&parts[0]===parts[1]&&parts[0].length>0;
}
function parsePlayersTransfermarktFormat(lines){
  const out=[];
  let i=0;
  while(i<lines.length){
    if(isTransfermarktNameLine(lines[i])){
      const namn=lines[i].split(TM_NAME_SPLIT).map(p=>p.trim()).filter(Boolean)[0];
      let j=i+1;
      while(j<lines.length&&!lines[j].trim())j++;
      const posLine=j<lines.length?lines[j].trim().toLowerCase():"";
      const pos=TM_POSITION_MAP[posLine];
      if(pos)out.push({namn,pos,posMatched:true,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false});
      i=j+1; // fortsätt efter positionsraden – bruset fram till nästa namn-dubblett hoppas över automatiskt
    } else {
      i++;
    }
  }
  return out;
}
function parsePlayersImportText(text){
  const normalizeStr=s=>s.toLowerCase().replace(/\s+/g," ").trim();
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const bulletLinkPattern=/^[*-]?\s*\[(.+?)\]\(.*\)$/;
  // Transfermarkt-format: varje spelare inleds med NAMNET UPPREPAT TVÅ GÅNGER,
  // tabbseparerat, på en och samma rad ("Josep Martínez\tJosep Martínez") –
  // ett mycket distinkt ankare. Kollas FÖRST eftersom både tabbtecknet (som
  // annars ger hasDelimiters) och positionsordförrådet (som delvis
  // överlappar med kort-formatets engelska positionsord, t.ex.
  // "Centre-Back"/"Centre-Forward") annars riskerar att styra om det till fel
  // parser.
  const tmNameLineCount=lines.filter(l=>isTransfermarktNameLine(l)).length;
  const hasTransfermarktFormat=tmNameLineCount>2;
  // Kort-format (t.ex. slgr.gr): varje SPELARE har sin egen positionsrad
  // ("GOALKEEPER"/"DEFENDER" osv – antingen som ren text direkt under namnet,
  // eller inbäddad i en länk), till skillnad från bundesliga.com-formatet där
  // samma positionsord istället är en RUBRIK som gäller för en hel grupp
  // spelare. Vi räknar hur många gånger ett positionsord förekommer – få
  // gånger (≤6) tyder på gruppdrubriker, många gånger (>6) tyder på att
  // varje spelare har sin egen positionsrad.
  const posWordPattern=/^(goalkeeper|goalkeepers|keeper|defender|defenders|centre-back|center-back|centre back|center back|right-back|left-back|right back|left back|wing-back|wingback|sweeper|full-back|fullback|full back|midfielder|midfielders|central midfielder|centre midfielder|center midfielder|defensive midfielder|attacking midfielder|left midfielder|right midfielder|holding midfielder|forward|forwards|striker|strikers|centre-forward|center-forward|centre forward|center forward|winger|left winger|right winger|attacker)$/i;
  const positionWordCount=lines.filter(l=>{
    const m=l.match(bulletLinkPattern);
    const val=(m?m[1]:l).trim();
    return posWordPattern.test(val);
  }).length;
  const hasPositionCards=positionWordCount>6;
  // Tabell-format (t.ex. fotmob.com): varje spelare är NAMN / [ev. skaderad-text]
  // / POSITIONSKOD(ER) / LAND / tröjnummer-ålder-längd-värde (tabbseparerat på
  // en rad). Positionerna anges som svenska koder ("MV","MB","AM","A" osv,
  // ibland flera kommaseparerade) eller stavas ut i sin helhet för spelare med
  // bara en position ("Målvakt","Mittfältare"...). Måste kollas FÖRE
  // hasDelimiters, annars kapas den bara av tabbtecknen i sifferraden och
  // hamnar fel i det generella strukturerade formatet.
  const positionTableLineCount=lines.filter(l=>isPositionTableLine(l)).length;
  const hasPositionTableFormat=positionTableLineCount>3;
  const hasBulletLinks=lines.some(l=>bulletLinkPattern.test(l));
  const hasDelimiters=lines.some(l=>l.includes(";")||l.includes("\t"));
  const chosenParser=hasTransfermarktFormat?"TransfermarktFormat":hasPositionCards?"CardFormat":hasPositionTableFormat?"TableFormat":hasBulletLinks?"BulletLinkFormat":hasDelimiters?"StructuredFormat":"BlockFormat";
  console.warn("🔍 IMPORT-DEBUG v3 – rader:",lines.length,"tmNameLineCount:",tmNameLineCount,"positionWordCount:",positionWordCount,"positionTableLineCount:",positionTableLineCount,"hasTransfermarktFormat:",hasTransfermarktFormat,"hasPositionCards:",hasPositionCards,"hasPositionTableFormat:",hasPositionTableFormat,"hasBulletLinks:",hasBulletLinks,"hasDelimiters:",hasDelimiters,"→ VALD PARSER:",chosenParser);
  lines.slice(0,6).forEach((l,i)=>console.warn(`  rad ${i}:`,JSON.stringify(l)));
  const rawRowsPre = hasTransfermarktFormat ? parsePlayersTransfermarktFormat(lines)
    : hasPositionCards ? parsePlayersCardFormat(lines)
    : hasPositionTableFormat ? parsePlayersTableFormat(lines)
    : hasBulletLinks ? parsePlayersBulletLinkFormat(lines)
    : hasDelimiters ? parsePlayersStructuredFormat(lines)
    : parsePlayersBlockFormat(lines);
  console.warn("🔍 IMPORT-DEBUG v3 → rader från",chosenParser+":",rawRowsPre.length,rawRowsPre.slice(0,10).map(r=>r.namn));
  // Säkerhetsnät oavsett vilken underparser som användes: städa bort skräp
  // (landskoder, etiketter typ "Birth date", rena siffror, kända
  // nationaliteter) och slå ihop namn-fragment ("Manuel"/"Neuer") med den
  // fullständiga formen ("Manuel Neuer") om den dyker upp i närheten på
  // samma position. Fångar dubblett-/fragmentproblem även om detekteringen
  // ovan skulle välja fel underparser för en okänd sajts format.
  const rawRows=coalesceNameFragments(rawRowsPre);
  console.warn("🔍 IMPORT-DEBUG v3 → rader EFTER städning/hopslagning:",rawRows.length,rawRows.slice(0,10).map(r=>r.namn));
  const seenInBatch=new Set();
  return rawRows.map(r=>{
    const key=normalizeStr(r.namn);
    const dupInBatch=seenInBatch.has(key);
    seenInBatch.add(key);
    const dupExisting=players.some(p=>normalizeStr(p.namn)===key);
    return {...r, warnDup: dupInBatch||dupExisting};
  });
}
// Tolkar spelarlistor där varje spelare markeras med en bullet + länk, t.ex.
// klistrat direkt från en klubbs officiella spelartrupp-sida:
//   * [Alisson Becker](url)
//   [1](url)
//   [Brazil](url)
// Rader UTAN ledande bullet ("*"/"-") hör till samma spelare (tröjnummer,
// nationalitet m.m.) och ignoreras – bara namnet (i bullet-raden) plockas ut.
// Positionsrubriker ("Goalkeepers"/"Defenders" osv, engelska eller svenska)
// grupperar spelarna på samma sätt som i den vanliga textlistan.
// Kända landsnamn/nationaliteter – används för att skilja ut namn-raden från
// nationalitets-raden när båda ser likadana ut (t.ex. bullet-punkt + länk på
// varje rad, oavsett om det är namnet, tröjnumret eller landet). Ett eventuellt
// avslutande "flag" (t.ex. "Brazil flag", vanligt som bild-alt-text) eller en
// ungdomslandslags-suffix ("England U20") plockas bort innan jämförelsen.

  "madagascar","malawi","malaysia","maldives","mali","malta","mauritania","mauritius","mexico","moldova",
  "monaco","mongolia","montenegro","morocco","mozambique","myanmar","namibia","nepal","netherlands","new zealand",

function isNationalityText(content){
  let c=content.trim().toLowerCase();
  c=c.replace(/\s*flag$/,"").trim();
  c=c.replace(/\s+u\d{1,2}$/,"").trim();
  return COUNTRY_NAMES.has(c);
}
function parsePlayersBulletLinkFormat(lines){
  const normalizeStr=s=>s.toLowerCase().replace(/\s+/g," ").trim();
  const posHeaderMap={
    "målvakter":"GK","målvakt":"GK","keepers":"GK","goalkeepers":"GK","goalkeeper":"GK",
    "försvarare":"DEF","defenders":"DEF","defender":"DEF",
    "mittfältare":"MID","midfielders":"MID","midfielder":"MID",
    "forwardar":"FW","forwards":"FW","forward":"FW","anfallare":"FW","strikers":"FW","striker":"FW"
  };
  // Rubriker som INTE är en spelposition – t.ex. bundesliga.com avslutar
  // truppen med en "Head coach"-sektion. Sätter currentPos till null så att
  // eventuella länkrader därefter (tränarens namn, koden "HC" m.m.) hoppas
  // över istället för att felaktigt importeras under den senaste positionen.
  const stopHeaders=new Set(["head coach","coach","huvudtränare","tränare","manager","staff","team staff","backroom staff"]);
  // Bullet-tecknet är valfritt – i praktiken bullets webbsidor ibland varje rad
  // (namn, nummer OCH nationalitet), så vi kan inte lita på var bullet sitter.
  const linkPattern=/^[*-]?\s*\[(.+?)\]\(.*\)$/;
  // Vissa sajter (t.ex. bundesliga.com) klistrar för- och efternamn ihop utan
  // mellanslag ("DayotUpamecano"). Lägger in mellanslag där en liten bokstav
  // följs direkt av en stor. OBS: kan i sällsynta fall felaktigt dela namn med
  // en stor bokstav mitt i efternamnet (t.ex. "McGregor" → "Mc Gregor") –
  // kontrollera Mc-/Mac-/De-namn extra noga i granskningsvyn.
  const splitConcatenatedName=s=>s.replace(/(\p{Ll})(\p{Lu})/gu,"$1 $2");
  // Tvåbokstavs-landskod (t.ex. "de" för Tyskland) – bundesliga.com lägger in
  // flaggans alt-text som en egen länkrad mellan namnet och tröjnumret.
  const isCountryCode=content=>/^[a-zA-ZÀ-ÿ]{2}$/.test(content.trim());
  // Målvakter listas ofta överst helt utan egen rubrik – anta GK som
  // startläge (markerat som "gissat", inte bekräftat) tills en riktig
  // rubrik påträffas.
  let currentPos="GK", currentPosMatched=false;
  const out=[];
  const pushPlayer=namn=>out.push({namn:splitConcatenatedName(namn),pos:currentPos,posMatched:currentPosMatched,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false});
  // Namn-liknande rader för EN spelare kan komma i flera fragment innan
  // tröjnumret/nästa rubrik avslutar blocket – t.ex. bundesliga.com ger
  // "Manuel" / "Neuer" / "Manuel Neuer" (samma spelare tre gånger, där bara
  // den sista raden redan har rätt mellanslag – den kompletta formen).
  // "fragments" samlar de ordelade bitarna (utan mellanslag) och "bestSpaced"
  // håller den bästa (växande) kompletta formen. Om ett nytt mellanslagsnamn
  // dyker upp som INTE är en del av bestSpaced (t.ex. nästa spelare börjar
  // direkt utan att tröjnumret syntes, som "Felipe Chávez" efter "David
  // Santos Daiber") avslutas föregående spelare direkt istället för att
  // fragmenten går förlorade eller blandas ihop.
  let fragments=[], bestSpaced=null;
  const flushBlock=()=>{
    if(!fragments.length&&!bestSpaced)return;
    const bestNorm=bestSpaced?bestSpaced.replace(/\s+/g,"").toLowerCase():null;
    if(bestSpaced) pushPlayer(bestSpaced);
    const seen=new Set();
    fragments.forEach(f=>{
      if(bestNorm&&bestNorm.includes(f.toLowerCase()))return; // ingår redan i den kompletta formen
      const key=f.toLowerCase();
      if(seen.has(key))return; seen.add(key);
      pushPlayer(f); // orelaterat fragment = egen spelare (troligen utan egen "komplett form"-rad)
    });
    fragments=[]; bestSpaced=null;
  };
  lines.forEach(line=>{
    const norm=normalizeStr(line);
    if(posHeaderMap[norm]){ flushBlock(); currentPos=posHeaderMap[norm]; currentPosMatched=true; console.warn("  → rubrik:",norm,"->",currentPos); return; }
    if(stopHeaders.has(norm)){ flushBlock(); currentPos=null; console.warn("  → icke-spelarrubrik, stoppar insamling:",norm); return; }
    const m=line.match(linkPattern);
    if(!m||!currentPos){ console.warn("  → hoppar (ingen länk-match eller ingen position ännu):",JSON.stringify(line)); return; }
    const content=m[1].trim();
    if(/^\d+$/.test(content)){ console.warn("  → tröjnummer, avslutar spelare:",content); flushBlock(); return; }
    if(isNationalityText(content)||isCountryCode(content)){ console.warn("  → landskod/nationalitet, hoppar:",JSON.stringify(content)); return; }
    if(/\s/.test(content)){
      if(bestSpaced===null) bestSpaced=content;
      else if(content.toLowerCase().includes(bestSpaced.toLowerCase())) bestSpaced=content; // växte till en fylligare form
      else if(bestSpaced.toLowerCase().includes(content.toLowerCase())) { /* delmängd av redan känd form, ignorera */ }
      else {
        // orelaterat → en ny spelare börjar här. Eventuella redan buffrade
        // fragment som hör till DEN NYA spelaren (t.ex. "Felipe"/"Chávez"
        // innan "Felipe Chávez" dyker upp) ska följa med till nästa block,
        // inte kastas bort som skräp tillsammans med den gamla spelaren.
        const newNorm=content.replace(/\s+/g,"").toLowerCase();
        const carry=fragments.filter(f=>newNorm.includes(f.toLowerCase()));
        fragments=fragments.filter(f=>!newNorm.includes(f.toLowerCase()));
        flushBlock();
        fragments=carry;
        bestSpaced=content;
      }
      return;
    }
    console.warn("  → namn-fragment:",JSON.stringify(content));
    fragments.push(content);
  });
  flushBlock();
  return out;
}
// Tolkar "profilkort-format" som slgr.gr (Super League Greece) faktiskt
// använder – varje spelare listas som en serie fristående länkrader kring en
// positionsrad, men till skillnad från det ursprungliga (förenklade) antagandet
// är IIINTE allt ihopslaget: etikett och värde ligger på EGNA rader, och
// positionen kan stå som REN TEXT (utan länk) direkt under namnet:
//   [1location-team](url)     ← tröjnummer hopklistrat med ett skräplänk-namn, hoppas över
//   [THOMAS STRAKOSHA](url)   ← namnet, plockas som väntande kandidat
//   GOALKEEPER                ← positionen (ofta ren text) – kopplas till senast sedda namn
//   [Birth date](url)         ← etikett, hoppas över
//   [1995-03-19](url)         ← värde, hoppas över (rent tröjnummer/datum-mönster)
//   [Country](url)            ← etikett, hoppas över
//   [Greece](url)             ← nationalitet, hoppas över (kända landsnamn)
//   [Appearances](url)        ← etikett, hoppas över
//   [0](url)                  ← värde, hoppas över
//   [Goal](url)                ← etikett, hoppas över
//   [0](url)                  ← värde, hoppas över
// Namn i VERSALER (vanligt på klubbsidor) görs om till Stor Bokstav Per Ord.
function toDisplayName(s){
  if(s===s.toUpperCase()&&s!==s.toLowerCase()){
    return s.toLowerCase().replace(/(^|[\s\-'])\p{L}/gu,c=>c.toUpperCase());
  }
  return s;
}
function isJunkCardContent(content){
  const c=content.trim();
  if(/^\d/.test(c))return true; // tröjnummer, ev. hopklistrat med skräp ("1location-team")
  const norm=c.toLowerCase();
  if(["birth date","country","appearances","goal","goals","height","weight","preferred foot","market value","position"].includes(norm))return true;
  if(isNationalityText(c))return true;
  return false;
}
function parsePlayersCardFormat(lines){
  // Bredare igenkänning än bara de fyra grundpositionerna – vissa sajter
  // använder mer specifika etiketter (t.ex. "Centre-Back", "Attacking
  // Midfielder", "Striker", "Winger"). Om en sådan missas helt tappas
  // spelaren (och allt därefter riskerar att hamna fel), så hellre täcka in
  // fler varianter än för få.
  const posWordMap={
    goalkeeper:"GK",goalkeepers:"GK",keeper:"GK",
    defender:"DEF",defenders:"DEF",
    "centre-back":"DEF","center-back":"DEF","centre back":"DEF","center back":"DEF","centreback":"DEF","centerback":"DEF",
    "right-back":"DEF","left-back":"DEF","right back":"DEF","left back":"DEF","rightback":"DEF","leftback":"DEF",
    "wing-back":"DEF","wingback":"DEF","right wing-back":"DEF","left wing-back":"DEF",
    "sweeper":"DEF","full-back":"DEF","fullback":"DEF","full back":"DEF",
    midfielder:"MID",midfielders:"MID",
    "central midfielder":"MID","centre midfielder":"MID","center midfielder":"MID","defensive midfielder":"MID",
    "attacking midfielder":"MID","left midfielder":"MID","right midfielder":"MID","holding midfielder":"MID","box-to-box midfielder":"MID",
    forward:"FW",forwards:"FW",striker:"FW",strikers:"FW",
    "centre-forward":"FW","center-forward":"FW","centre forward":"FW","center forward":"FW",
    winger:"FW","left winger":"FW","right winger":"FW","left wing":"FW","right wing":"FW",
    "second striker":"FW","attacker":"FW"
  };
  const linkPattern=/^[*-]?\s*\[(.+?)\]\(.*\)$/;
  const out=[];
  let pendingName=null;
  lines.forEach(line=>{
    const m=line.match(linkPattern);
    // Innehållet kan komma som "[Namn](url)" ELLER som helt ren text utan
    // några länkar alls (vissa sajter/kopieringssätt ger inga markdown-länkar
    // överhuvudtaget) – behandla båda likadant istället för att bara leta
    // efter positionsord i den ena och namn i den andra.
    const content=(m?m[1]:line).trim();
    const posCandidate=content.toLowerCase();
    const pos=posWordMap[posCandidate];
    if(pos){
      if(pendingName){
        out.push({namn:toDisplayName(pendingName),pos,posMatched:true,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false});
        pendingName=null;
      }
      return;
    }
    if(isJunkCardContent(content))return;
    pendingName=content;
  });
  return out;
}
function parsePlayersStructuredFormat(lines){
  const normalizeStr=s=>s.toLowerCase().replace(/\s+/g," ").trim();
  const posMap={GK:"GK",DEF:"DEF",MID:"MID",FW:"FW",MÅLVAKT:"GK",FÖRSVARARE:"DEF",MITTFÄLTARE:"MID",FORWARD:"FW",ANFALLARE:"FW"};
  return lines.map(line=>{
    let parts;
    if(line.includes("\t")) parts=line.split("\t");
    else if(line.includes(";")) parts=line.split(";");
    else parts=line.split(",");
    parts=parts.map(p=>p.trim());
    const namn=parts[0]||"";
    if(!namn) return null;
    const posRaw=(parts[1]||"").toUpperCase().replace(/[^A-ZÅÄÖ]/g,"");
    const pos=posMap[posRaw]||"";
    const lagRaw=(parts[2]||"").trim();
    let team=lagRaw?TEAMS.find(t=>normalizeStr(t.name)===normalizeStr(lagRaw)):null;
    if(!team&&lagRaw) team=TEAMS.find(t=>normalizeStr(t.name).includes(normalizeStr(lagRaw))||normalizeStr(lagRaw).includes(normalizeStr(t.name)));
    return {
      namn,
      pos: pos||"DEF",
      posMatched: !!pos,
      teamId: team?team.id:(TEAMS[0]?TEAMS[0].id:null),
      teamMatched: !!team
    };
  }).filter(Boolean);
}
function parsePlayersBlockFormat(lines){
  const normalizeStr=s=>s.toLowerCase().replace(/\s+/g," ").trim();
  const posHeaderMap={
    "målvakter":"GK","målvakt":"GK","keepers":"GK","goalkeepers":"GK","goalkeeper":"GK",
    "försvarare":"DEF","defenders":"DEF","defender":"DEF","backar":"DEF","back":"DEF","backspelare":"DEF",
    "mittfältare":"MID","midfielders":"MID","midfielder":"MID",
    "forwardar":"FW","forwards":"FW","forward":"FW","anfallare":"FW","strikers":"FW","striker":"FW"
  };
  const unknownPosHeaders=new Set(["utan position","ingen position","no position","unassigned"]);
  const skipWords=new Set(["ålder","age","nationalitet","land","nummer","tröjnummer","number"]);
  // Delar upp ett namn i ord för att avgöra om två rader troligen syftar på samma
  // spelare (t.ex. "Alisson Ramsés Becker" / "Alisson Becker") – används för att
  // skilja dubblettvarianter av samma namn från nästa, helt olika spelare.
  const namesLikelyRelated=(a,b)=>{
    const wa=normalizeStr(a).split(" ").filter(w=>w.length>1);
    const wb=normalizeStr(b).split(" ").filter(w=>w.length>1);
    return wa.some(w=>wb.includes(w));
  };
  let currentPos=null, currentPosMatched=true;
  let currentPlayer=null; // {namn,pos,...} – spelaren vi just nu bygger på
  let sawTerminalInfo=false; // true så fort vi sett tröjnummer/nationalitet för currentPlayer
  const out=[];
  const finalizeCurrent=()=>{
    if(currentPlayer) out.push(currentPlayer);
    currentPlayer=null;
    sawTerminalInfo=false;
  };
  lines.forEach(line=>{
    const norm=normalizeStr(line);
    if(posHeaderMap[norm]){ finalizeCurrent(); currentPos=posHeaderMap[norm]; currentPosMatched=true; return; }
    if(unknownPosHeaders.has(norm)){ finalizeCurrent(); currentPos="MID"; currentPosMatched=false; return; }
    if(skipWords.has(norm)) return;
    if(line.startsWith("#")) return; // tröjnummer skrivet som "#7"
    if(/^\d{1,3}$/.test(line)){ sawTerminalInfo=true; return; } // tröjnummer eller ålder
    if(isNationalityText(line)){ sawTerminalInfo=true; return; } // nationalitet (även dubblett)
    // annars: en namnliknande rad – städa bort ett ev. ledande tröjnummer ("21. Namn")
    const numMatch=line.match(/^\d{1,3}\.\s*(.+)$/);
    const nameCandidate=numMatch?numMatch[1].trim():line;
    if(!currentPlayer){
      currentPlayer={namn:nameCandidate,pos:currentPos,posMatched:currentPosMatched,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false};
    } else if(!sawTerminalInfo && namesLikelyRelated(nameCandidate,currentPlayer.namn)){
      // dubblett/variant av samma spelares namn – behåll det första, ignorera detta
    } else {
      // antingen har vi redan sett tröjnummer/nationalitet för currentPlayer, eller
      // så är namnet helt orelaterat – i båda fallen börjar nästa spelare här
      finalizeCurrent();
      currentPlayer={namn:nameCandidate,pos:currentPos,posMatched:currentPosMatched,teamId:TEAMS[0]?TEAMS[0].id:null,teamMatched:false};
    }
  });
  finalizeCurrent(); // ta med sista spelaren
  return out;
}

// Tolkar matchprogram klistrat från sidor som premierleague.com – datumrubriker
// (t.ex. "Fri 21 Aug[Live blog](url)") följt av matcher som tre separata rader:
//   [Hemmalag](url)
//   [21:00](url)
//   [Bortalag](url)
// Omgångsnumret (matchvecka) plockas automatiskt ur "Live blog"-länkens
// webbadress om den innehåller "matchweek/ÅÅÅÅ_N" – annars antas aktuell
// omgång (cfg.omg), tydligt märkt i förhandsgranskningen.
// Tolkar matchprogram klistrat från länkbaserade sidor som premierleague.com.
// Hanterar två varianter av samma sida beroende på webbläsare/kopieringssätt:
//   A) Med markdown-länkar: "[Hemmalag](url)" / "[21:00](url)" / "[Bortalag](url)",
//      datumrubrik ihopklistrad med "[Live blog](url)" på en rad.
//   B) Ren text utan länkar: lagnamn och tider klistras in RÅTT, ofta med varje
//      namn DUBBLERAT ("Newcastle United" två gånger i rad), och datumrubriken
//      ("Mon 24 Aug") och "Live blog" på separata rader.
// Omgångsnumret plockas ur en ev. "matchweek/ÅÅÅÅ_N"-webbadress om den finns
// (variant A) – annars (variant B, ingen webbadress alls) antas aktuell omgång,
// tydligt märkt i förhandsgranskningen så admin kan dubbelkolla.
// Tolkar tabellformatet från fixturedownload.com – en ren tabell med
// kolumnerna "Round Number / Date / Location / Home Team / Away Team /
// Result". Fungerar med BÅDE riktig nedladdad CSV (kommaseparerad) OCH
// texten man klistrar in direkt från förhandsgranskningssidan (pipe-
// separerad markdown-tabell, "| 1 | 28/08/2026... | ... |"). Omgångsnumret
// kommer direkt från kolumnen – ingen gissning behövs, till skillnad från
// de andra formaten. Samma källa fungerar för alla ligor på sajten
// (Premier League, Bundesliga, La Liga, Serie A, Ligue 1 m.fl.) eftersom
// strukturen är identisk oavsett liga.
// Tolkar tabellformatet från fixturedownload.com – en tabell med
// kolumnerna "Round Number / Date / Location / Home Team / Away Team /
// Result". Klistrar man in direkt från förhandsgranskningssidan i
// webbläsaren blir kolumnerna ofta hopklistrade med bara MELLANSLAG
// emellan (ingen pipe, inget kommatecken) – t.ex.
// "1 28/08/2026 20:30 Allianz Arena FC Bayern München VfB Stuttgart -".
// Går inte att kolumn-splitta på ett tillförlitligt sätt då (lagnamn,
// planer och orter innehåller ju också mellanslag). Istället: ta bort
// omgångsnummer (först på raden), datum/tid och avslutande resultat, och
// leta sedan efter TVÅ kända lagnamn (från TEAMS) som substrängar i det
// som blir kvar – längsta lagnamn först, för att undvika att ett kort
// lagnamn råkar matcha inuti ett längre. Samma teknik som redan används
// för det gamla svenska Omgång-formatet, bara applicerad på en hel rad
// istället för en rad per lag. Funkar lika bra oavsett om det är riktig
// CSV, pipe-separerad markdown-tabell, eller helt mellanslagsseparerad
// text – alla tre hanteras av samma sökning.
function parseFixtureDownloadFormat(text){
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const headerIdx=lines.findIndex(l=>/round\s*number/i.test(l)&&/home\s*team/i.test(l));
  if(headerIdx===-1)return null; // signalerar "inte det här formatet" till dispatchern
  const dataLines=lines.slice(headerIdx+1).filter(l=>!/^[\s|:-]+$/.test(l));
  if(!dataLines.length)return null;

  // Extra tolerans för vanliga namnvarianter på tyska klubbar: siffersuffix
  // som "04"/"05"/"07" (ofta grundningsår, utelämnas ibland) och översatta
  // ortnamn (München/Munich, Köln/Cologne). Körs på BÅDA sidor (både det
  // sparade lagnamnet och källtexten) så det spelar ingen roll vilken
  // variant som står var.
  const CLUB_NAME_SYNONYMS=[[/münchen/g,"munich"],[/köln/g,"cologne"],[/\brennais\b/g,"rennes"]];
  const normalizeStr=s=>{
    // .normalize("NFC") säkerställer att bokstäver som ü/ö/é alltid lagras på
    // SAMMA sätt oavsett om källan (t.ex. en webbläsares urklipp på Mac)
    // råkade koda dem som ett sammansatt specialtecken eller som bokstav +
    // separat diakritiskt märke – annars kan två visuellt identiska namn
    // ("München") vara olika text för datorn och aldrig matcha varandra.
    let x=(s||"").normalize("NFC").toLowerCase().replace(/&/g,"and").replace(/[|,]/g," ");
    CLUB_NAME_SYNONYMS.forEach(([re,rep])=>{x=x.replace(re,rep);});
    x=x.replace(/\bsport-?club\b/g,"sc"); // "Sport-Club Freiburg" ~ "SC Freiburg"
    x=x.replace(/\b0\d\b/g," "); // fristående tvåsiffrigt suffix, t.ex. "04"/"05"/"07"
    return x.replace(/\s+/g," ").trim();
  };

  // Hittar alla icke-överlappande förekomster av kända lagnamn i en textbit,
  // sorterat efter var de dyker upp (vänster till höger) – längsta lagnamn
  // provas först så de "tar" sin plats innan ett kortare lagnamn hinner
  // matcha en delsträng av det.
  const findTeamOccurrences=remainder=>{
    const norm=normalizeStr(remainder);
    const sorted=[...TEAMS].sort((a,b)=>b.name.length-a.name.length);
    const claimed=new Array(norm.length).fill(false);
    const occ=[];
    for(const t of sorted){
      const tn=normalizeStr(t.name);
      if(!tn)continue;
      let from=0;
      while(true){
        const idx=norm.indexOf(tn,from);
        if(idx===-1)break;
        const end=idx+tn.length;
        if(!claimed.slice(idx,end).some(Boolean)){
          occ.push({team:t,start:idx});
          for(let i=idx;i<end;i++)claimed[i]=true;
        }
        from=idx+1;
      }
    }
    occ.sort((a,b)=>a.start-b.start);
    return occ;
  };

  const byRound={};
  const unmatchedLines=[];
  dataLines.forEach(line=>{
    let l=line.replace(/^\|/,"").replace(/\|$/,"").trim();
    const roundMatch=l.match(/^\s*(\d+)\s*\|?/);
    if(!roundMatch)return;
    const roundNum=parseInt(roundMatch[1],10);
    let remainder=l.slice(roundMatch[0].length);
    remainder=remainder.replace(/\d{1,2}\/\d{1,2}\/\d{2,4}(\s+\d{1,2}:\d{2})?/,""); // datum/tid
    remainder=remainder.replace(/(\d+\s*-\s*\d+|-)\s*\|?\s*$/,""); // avslutande resultat
    const occ=findTeamOccurrences(remainder);
    if(!byRound[roundNum])byRound[roundNum]={roundNum,roundGuessed:false,matches:[],errors:[],infos:[]};
    // Ta INTE bara de två första förekomsterna rakt av – om en arena råkar
    // heta samma sak som hemmalaget (t.ex. "Stadium de Toulouse" för
    // Toulouse FC) skulle det annars ge en falsk "Toulouse vs Toulouse"-
    // match. Leta istället efter det första PARET av olika lag, i den
    // ordning de dyker upp i texten.
    let home=null,away=null;
    for(const o of occ){
      if(!home){home=o;continue;}
      if(o.team.id!==home.team.id){away=o;break;}
    }
    if(home&&away){
      byRound[roundNum].matches.push({hId:home.team.id,aId:away.team.id,hRaw:home.team.name,aRaw:away.team.name});
    } else {
      unmatchedLines.push(line);
    }
  });

  const results=Object.values(byRound).sort((a,b)=>a.roundNum-b.roundNum);
  if(unmatchedLines.length){
    const preview=unmatchedLines.slice(0,5).map(l=>`"${l}"`).join(", ");
    const extra=unmatchedLines.length>5?` (+${unmatchedLines.length-5} rad(er) till)`:"";
    const msg=`${unmatchedLines.length} rad(er) kunde inte tolkas – hittade inte två kända lagnamn: ${preview}${extra}. Kontrollera att lagnamnen i Admin → Lag stämmer exakt (t.ex. "FC Bayern München" måste stavas likadant där).`;
    results.forEach(r=>r.infos.push(msg));
  }
  return results;
}
function parseWebFixturesText(text){
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const normalizeStr=s=>s.toLowerCase().replace(/&/g,"and").replace(/\s+/g," ").trim();
  const findTeamFromText=name=>{
    const lower=normalizeStr(name);
    let t=TEAMS.find(x=>normalizeStr(x.name)===lower);
    if(t)return t;
    return TEAMS.find(x=>{
      const tn=normalizeStr(x.name);
      return lower.includes(tn)||tn.includes(lower);
    });
  };
  const dayHeaderPattern=/^(mon|tue|wed|thu|fri|sat|sun)\s+\d{1,2}\s+[a-z]{3,}/i;

  let currentRound=null;
  let pendingHome=null,pendingAway=null,seenTime=false;
  const rawMatches=[]; // {hRaw,aRaw}
  const skippedLines=[];

  const finalizeMatch=()=>{
    if(pendingHome&&pendingAway) rawMatches.push({hRaw:pendingHome,aRaw:pendingAway});
    pendingHome=null; pendingAway=null; seenTime=false;
  };

  lines.forEach(line=>{
    if(dayHeaderPattern.test(line)){
      finalizeMatch();
      const m=line.match(/matchweek\/\d+_(\d+)/i);
      if(m) currentRound=Number(m[1]);
      return;
    }
    if(/^live ?blog$/i.test(line)) return;

    // Innehåll: från bracket-varianten "[X](url)" tas X, annars hela raden rakt av
    const bm=line.match(/^\[(.+?)\]\(.*\)$/);
    const content=bm?bm[1].trim():line;
    if(/^live ?blog$/i.test(content)) return;
    if(/^\d{1,2}:\d{2}$/.test(content)){ seenTime=true; return; }

    if(pendingHome===null){
      pendingHome=content;
      return;
    }
    if(!seenTime){
      // dubblett av hemmalagets namn (kort/lång variant) – ignorera
      return;
    }
    if(pendingAway===null){
      pendingAway=content;
      return;
    }
    if(normalizeStr(content)===normalizeStr(pendingAway)){
      // dubblett av bortalagets namn – ignorera
      return;
    }
    // en ny, annorlunda rad efter att både hemma- och bortalag redan är satta –
    // det här är nästa matchs hemmalag
    finalizeMatch();
    pendingHome=content;
  });
  finalizeMatch();

  const matches=[];
  rawMatches.forEach(({hRaw,aRaw})=>{
    const h=findTeamFromText(hRaw), a=findTeamFromText(aRaw);
    if(h&&a) matches.push({hId:h.id,aId:a.id,hRaw:h.name,aRaw:a.name});
    else{
      if(!h) skippedLines.push(hRaw);
      if(!a) skippedLines.push(aRaw);
    }
  });

  const roundGuessed=currentRound==null;
  const roundNum=roundGuessed?(cfg.omg||1):currentRound;
  const infos=[];
  if(skippedLines.length) infos.push(`Rader som inte kunde matchas mot något lag: ${skippedLines.map(l=>`"${l}"`).join(", ")}`);
  if(!matches.length) return [];
  return [{roundNum,roundGuessed,matches,errors:[],infos}];
}
// Känner av vilket format som klistrats in och tolkar med rätt parser – så att
// admin inte behöver välja manuellt mellan svenska Fotbollskollen-formatet och
// länkbaserade sidor som premierleague.com.
function parseAnyScheduleText(text){
  const fixtureDownloadResult = parseFixtureDownloadFormat(text);
  if(fixtureDownloadResult) return fixtureDownloadResult;
  const looksLikeWebFixtures = /^\[.+?\]\(.*\)$/m.test(text)
    || /matchweek\//i.test(text)
    || /^(mon|tue|wed|thu|fri|sat|sun)\s+\d{1,2}\s+[a-z]{3,}/im.test(text)
    || /^live ?blog$/im.test(text);
  return looksLikeWebFixtures ? parseWebFixturesText(text) : parseScheduleText(text);
}
function parseScheduleText(text){
  const cleaned=text.replace(/ emblem/g,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");

  const normalizeStr=s=>s.toLowerCase().replace(/&/g,"and").replace(/\s+/g," ").trim();

  const findTeamFromLine=line=>{
    const lower=normalizeStr(line);
    const sorted=[...TEAMS].sort((a,b)=>b.name.length-a.name.length);
    for(const t of sorted){
      const tn=normalizeStr(t.name);
      // Exakt match
      if(lower===tn)return t;
      // Raden börjar med lagnamnet följt av mellanslag
      if(lower.startsWith(tn+" "))return t;
      // Raden börjar med lagnamnet följt av lagnamnet igen (duplikat utan mellanslag)
      if(lower.startsWith(tn+tn.slice(-1)))return t;
      // Lagnamnet innehåller radens text (om raden är förkortad)
      if(tn.startsWith(lower+" ")||tn===lower)return t;
    }
    return null;
  };

  const sections=cleaned.split(/(?=^Omgång\s+\d+)/m);
  const results=[];

  for(const section of sections){
    const roundMatch=section.match(/^Omgång\s+(\d+)/);
    if(!roundMatch)continue;
    const roundNum=Number(roundMatch[1]);
    const lines=section.split("\n").map(l=>l.trim()).filter(l=>l.length>0);

    const foundTeams=[];
    const skippedLines=[];

    for(const line of lines){
      if(/^Omgång\s+\d+/.test(line))continue;
      if(/^\d{1,2}:\d{2}/.test(line))continue;
      if(/^Publik:/i.test(line))continue;
      if(/^\d+$/.test(line))continue; // skippa rena siffror
      const t=findTeamFromLine(line);
      if(t){
        foundTeams.push(t);
      } else {
        skippedLines.push(line);
      }
    }

    const matches=[];
    const errors=[];
    const infos=[];
    for(let i=0;i+1<foundTeams.length;i+=2){
      matches.push({hId:foundTeams[i].id,aId:foundTeams[i+1].id,hRaw:foundTeams[i].name,aRaw:foundTeams[i+1].name});
    }
    if(foundTeams.length%2!==0){
      const leftover=foundTeams[foundTeams.length-1].name;
      errors.push(`Lag utan motståndare: "${leftover}"`);
    }
    const expectedMatches=Math.floor(TEAMS.length/2);
    if(skippedLines.length){
      const msg=`Rader som inte kunde matchas mot något lag: ${skippedLines.map(l=>`"${l}"`).join(", ")}`;
      if(matches.length<expectedMatches){
        errors.push(`${msg} (kontrollera stavning – detta gjorde att en match saknas!)`);
      } else {
        infos.push(`${msg} (troligen bara plan-/arenanamn – ignoreras, påverkar inte matcherna)`);
      }
    }

    results.push({roundNum,matches,errors,infos});
  }

  return results;
}

      let {data,error}=await sb.auth.signInWithPassword({email:SUPER_ADMIN_EMAIL,password:pwd});
      let level="super";
      if(error){
        ({data,error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:pwd}));
        level="admin";
      }
      if(error||!data?.user){ errMsg="Fel lösenord."; render(); return; }
      const {data:adminRow,error:adminErr}=await sb.from("admins").select("level").eq("user_id",data.user.id).maybeSingle();

      errMsg=""; if(adminLevel!=="super") adminSection="round";

      }

    if(appMode==="fantasy"||!appMode){getPts=u=>userTotPts(u);title="Fantasy";}
    else if(appMode==="tipp"){getPts=u=>userTipTotalPts(u);title="Tippa resultat";}
    else if(appMode==="snabbast"){getPts=u=>userSnabbastTotalPts(u.id);title="Snabbast vinner";}
    else if(appMode==="måljakten"){getPts=u=>userMåljaktenTotalPts(u.id);title="Måljakten";}
    else if(appMode==="ligatipp"){getPts=u=>userLigatippTotalPts(allLeagueTips.find(t=>t.user_id===u.id)||{});title="Tippa serien";}

    else{getPts=u=>userTotPts(u);title="Fantasy";}

    const headerH=80,footerH=40;
    const W=400,H=headerH+sorted.length*rowH+footerH+padY*2;

    const canvas=document.getElementById("export-canvas");
    canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext("2d");

    // Bakgrund
    ctx.fillStyle="#1a1a1a";
    ctx.fillRect(0,0,W,H);

    // Header
    ctx.fillStyle="#c1272d";
    ctx.fillRect(0,0,W,headerH);
    ctx.fillStyle="#fff";
    ctx.font="bold 18px Georgia";
    ctx.textAlign="center";
    ctx.fillText(currentLeague.name,W/2,32);
    ctx.font="14px Arial";
    ctx.fillText(title+" – Ligatabell",W/2,56);
    ctx.font="11px Arial";
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.fillText(new Date().toLocaleDateString("sv-SE"),W/2,74);

    // Rader
    const medals=["🥇","🥈","🥉"];
    sorted.forEach((u,i)=>{
      const y=headerH+padY+i*rowH;
      // Alternerande bakgrund
      ctx.fillStyle=i%2===0?"#222":"#1e1e1e";
      ctx.fillRect(padX,y,W-padX*2,rowH-2);

      // Placering
      ctx.font="bold 14px Arial";
      ctx.textAlign="center";
      ctx.fillStyle=i===0?"#ffd700":i===1?"#c0c0c0":i===2?"#cd7f32":"#888";
      ctx.fillText(i<3?["1","2","3"][i]:String(i+1),padX+16,y+27);

      // Namn
      ctx.font=i<3?"bold 14px Arial":"14px Arial";
      ctx.fillStyle="#fff";
      ctx.textAlign="left";
      ctx.fillText(u.namn.slice(0,22),padX+36,y+27);

      // Poäng
      ctx.font="bold 16px Arial";
      ctx.fillStyle="#c1272d";
      ctx.textAlign="right";
      ctx.fillText(String(getPts(u))+" p",W-padX-4,y+27);

      // Separator
      ctx.fillStyle="#333";
      ctx.fillRect(padX,y+rowH-2,W-padX*2,1);
    });

    // Footer
    ctx.fillStyle="#333";
    ctx.fillRect(0,H-footerH,W,footerH);
    ctx.font="11px Arial";
    ctx.fillStyle="#888";
    ctx.textAlign="center";
    ctx.fillText("div2-ng-play.vercel.app",W/2,H-14);

    // Ladda ner
    const link=document.createElement("a");
    link.download=`div2ng-${title.toLowerCase().replace(/ /g,"-")}-${new Date().toLocaleDateString("sv-SE")}.png`;
    link.href=canvas.toDataURL("image/png");
    link.click();
  };
